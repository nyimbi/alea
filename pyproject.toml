[project]
name = "alea"
version = "0.1.0"
description = "ALEA (African Light and Energy Analytics): continental energy system planning, predictive operations, market simulation and periodic intelligence"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

dependencies = [
	# Planning core
	"pypsa>=1.4",
	"atlite>=0.2.13",
	"pandas>=3.0",
	"numpy>=2.4",
	"xarray>=2024.0",
	"geopandas>=1.0",
	"rasterio>=1.3",
	"powerplantmatching>=0.5",
	"tsam>=4.0",
	"scipy>=1.14",
	"networkx>=3.3",
	# Machine learning
	"scikit-learn>=1.4",
	"xgboost>=2.0",
	"lightgbm>=4.0",
	"shap>=0.44",
	"imbalanced-learn>=0.12",
	"lifelines>=0.29",
	# Satellite
	"earthaccess>=0.9",
	"h5py>=3.10",
	"pyproj>=3.6",
	# Market simulation
	"mesa>=2.0",
	"gymnasium>=0.29",
	# API, dashboard, reporting
	"fastapi>=0.110",
	"uvicorn>=0.29",
	"pydantic>=2.7",
	"plotly>=5.20",
	"dash>=2.16",
	"jinja2>=3.1",
	"weasyprint>=61",
	"apscheduler>=3.10",
	# Scanning
	"feedparser>=6.0",
	"requests>=2.31",
	"beautifulsoup4>=4.12",
	"datasketch>=1.6",
	"redis>=5.0",
	# Utilities
	"uuid6>=2024.1.12",
	"pyyaml>=6.0",
	"python-dateutil>=2.9",
	"tenacity>=8.2",
	"typer>=0.12",
	"structlog>=24.1",
	"matplotlib>=3.8",
	"joblib>=1.4",
]

[project.optional-dependencies]
# tensorflow is deliberately absent. It publishes no cp314 wheel, and because uv
# locks every extra, an unsatisfiable one here fails the entire lock rather than
# just that extra. The spec's outage models are xgboost/lightgbm anyway; add
# tensorflow back only alongside a Python downgrade.
# Solver. HiGHS is not an extra: pypsa 1.4 declares highspy as a direct
# dependency, so it arrives with the planning core and is available in a
# dev-only install. pulp is here for the older LP-file route only.
solvers = ["pulp>=2.8"]
notebooks = ["jupyterlab>=4.0", "ipykernel>=6.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-httpserver>=1.0", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.5", "pyright>=1.1", "pandas-stubs>=2.2"]

[project.scripts]
alea = "alea.cli:main"

# maturin, not hatchling: the package ships a compiled extension, and a bare
# `cargo build` of an extension-module crate fails on macOS with
# "ld: symbol(s) not found for architecture arm64" because the platform needs
# -undefined dynamic_lookup, which maturin sets.
[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "alea._core._rust"
manifest-path = "rust/alea-python/Cargo.toml"
features = ["pyo3/extension-module"]
# abi3-py312: one wheel per platform, not one per Python version. Verified: a
# cp312-abi3-macosx_11_0_arm64 wheel built this way imports and runs under
# Python 3.14.
strip = true

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py314"
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E101", "W191"]

[tool.pytest.ini_options]
# Only `tests/ci` is collected, deliberately. The two other test directories
# hold no pytest-style tests:
#   * `tests/determinism/run.py` is a script with a `main()`, not a test module.
#     It is invoked directly by `scripts/determinism.py` (the group
#     `scripts/check.py` runs), which builds the fixture in two processes and
#     diffs them. Collecting it here would import a module with import-time
#     side effects for no test.
#   * `tests/reference/` holds the independent Python reference kernels, not
#     tests. They are exercised by `tests/ci/test_kernels_differential.py`,
#     which is collected: that module puts `tests/` on `sys.path` and compares
#     each reference against the compiled kernel. A reference with no caller
#     there would be a reference nothing checks, which is why the differential
#     suite covers every module in that directory.
testpaths = ["tests/ci"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
