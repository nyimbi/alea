[project]
name = "alea"
version = "0.1.0"
description = "ALEA (African Light and Energy Analytics): continental energy system planning, predictive operations, market simulation and periodic intelligence"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

dependencies = [
	# Planning core
	"pypsa>=1.4",
	"atlite>=0.2.13",
	"pandas>=3.0",
	"numpy>=2.4",
	"xarray>=2024.0",
	"geopandas>=1.0",
	"rasterio>=1.3",
	"powerplantmatching>=0.5",
	"tsam>=4.0",
	"scipy>=1.14",
	"networkx>=3.3",
	# Machine learning
	"scikit-learn>=1.4",
	"xgboost>=2.0",
	"lightgbm>=4.0",
	"shap>=0.44",
	"imbalanced-learn>=0.12",
	"lifelines>=0.29",
	# Satellite
	"earthaccess>=0.9",
	"h5py>=3.10",
	"pyproj>=3.6",
	# Market simulation
	"mesa>=2.0",
	"gymnasium>=0.29",
	# API, dashboard, reporting
	"fastapi>=0.110",
	"uvicorn>=0.29",
	"pydantic>=2.7",
	"plotly>=5.20",
	"dash>=2.16",
	"jinja2>=3.1",
	"weasyprint>=61",
	"apscheduler>=3.10",
	# Scanning
	"feedparser>=6.0",
	"requests>=2.31",
	"beautifulsoup4>=4.12",
	"datasketch>=1.6",
	"redis>=5.0",
	# Utilities
	"uuid6>=2024.1.12",
	"pyyaml>=6.0",
	"python-dateutil>=2.9",
	"tenacity>=8.2",
]

[project.optional-dependencies]
# tensorflow is deliberately absent. It publishes no cp314 wheel, and because uv
# locks every extra, an unsatisfiable one here fails the entire lock rather than
# just that extra. The spec's outage models are xgboost/lightgbm anyway; add
# tensorflow back only alongside a Python downgrade.
# Command-line solvers. HiGHS ships in-process via highspy and needs no extra.
solvers = ["highspy>=1.7", "pulp>=2.8"]
notebooks = ["jupyterlab>=4.0", "ipykernel>=6.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-httpserver>=1.0", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.5", "pyright>=1.1"]

[project.scripts]
alea = "alea.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alea"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py314"
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E101", "W191"]

[tool.pytest.ini_options]
testpaths = ["tests/ci"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
