    latex: \mathrm{gas}_{eaf} = 1 - \mathrm{forced}_{outage\_rate\_gas} - \mathrm{planned}_{outage\_rate}
  gas_price_per_mwh_definition:
    name: Gas price per MWh thermal
    description: 'Commodity gas price converted to a thermal basis. Dimensional check: USD/MMBtu times
      MMBtu/MWh is USD/MWh; 1 MMBtu is 0.293 MWh, so MMBtu/MWh is 1/0.293. The conversion is written so
      the unit error has nowhere to hide. `unit_check: false` because the graph does not carry `MMBtu`
      as a Pint-compatible unit string.'
    system: cost_accounting
    lhs: gas_price_per_mwh
    rhs: gas_price / 0.293
    relation: eq
    parameters:
    - gas_price
    free_variables:
    - gas_price
    determined_variables:
    - gas_price_per_mwh
    tolerance: 1.0e-09
    unit_check: false
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  gasification_cost_alias:
    name: Gasification plant capital cost is Gasification plant capital cost
    description: 'The alias resolution the fragments'' alias register declared and nothing applied: `gasification_cost`
      and `capex_gasification` are two spellings of one quantity. The equality states it in the graph''s
      own idiom, so a reader of either id sees the derivation; the drift that made this alias list exist
      cannot return, because the equation holds at every value set.'
    system: employment
    lhs: gasification_cost
    rhs: capex_gasification
    relation: eq
    parameters:
    - gasification_cost
    - capex_gasification
    free_variables:
    - capex_gasification
    determined_variables:
    - gasification_cost
    tolerance: 1.0e-09
    unit_check: true
    reference: The fragments' alias register (docs/param_batch7.md and successors), applied
    priority: P2
    solution_method: direct
    linearity: linear
    latex: \mathrm{gasification}_{cost} = \mathrm{capex}_{gasification}
  gearing_ratio_definition:
    name: Gearing from the debt fraction
    description: Debt over equity, where equity is the complement of the debt fraction. The singularity
      at a debt fraction of one is excluded by the node's own range, which Batch 2 capped at 0.95.
    system: financial
    lhs: gearing_ratio
    rhs: debt_fraction / (1 - debt_fraction)
    relation: eq
    parameters:
    - debt_fraction
    free_variables: []
    determined_variables:
    - gearing_ratio
    tolerance: 1.0e-06
    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: nonlinear
    latex: \mathrm{gearing}_{ratio} = \frac{\mathrm{debt}_{fraction}}{1 - \mathrm{debt}_{fraction}}
  geothermal_cost_alias:
    name: Geothermal capital cost (legacy) is Geothermal capital cost
    description: 'The alias resolution the fragments'' alias register declared and nothing applied: `geothermal_cost`
      and `capex_geothermal` are two spellings of one quantity. The equality states it in the graph''s
      own idiom, so a reader of either id sees the derivation; the drift that made this alias list exist
      cannot return, because the equation holds at every value set.'
    system: employment
    lhs: geothermal_cost
    rhs: capex_geothermal
    relation: eq
    parameters:
    - geothermal_cost
    - capex_geothermal
    free_variables:
    - capex_geothermal
    determined_variables:
    - geothermal_cost
    tolerance: 1.0e-09
    unit_check: true
    reference: The fragments' alias register (docs/param_batch7.md and successors), applied
    priority: P2
    solution_method: direct
    linearity: linear
    latex: \mathrm{geothermal}_{cost} = \mathrm{capex}_{geothermal}
  health_cost_definition:
    name: Health cost
    description: 'The DALY burden priced at the value of a statistical life year. Dimensional check: DALY/year
      times USD/DALY is USD/year. `healthcare_cost_per_case` is used as the value of a DALY, which is
      the only human-capital price the graph carries; a VSL-based value would need its own parameter,
      and the graph does not hold one.'
    system: health
    lhs: health_cost_usd_per_year
    rhs: dalys_per_year * healthcare_cost_per_case
    relation: eq
    parameters:
    - dalys_per_year
    - healthcare_cost_per_case
    free_variables:
    - dalys_per_year
    - healthcare_cost_per_case
    determined_variables:
    - health_cost_usd_per_year
    tolerance: 1.0e-08
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  hydrogen_fuel_cell_cost_alias:
    name: Hydrogen fuel cell capital cost is Hydrogen fuel cell capital cost
    description: 'The alias resolution the fragments'' alias register declared and nothing applied: `hydrogen_fuel_cell_cost`
      and `capex_hydrogen_fuel_cell` are two spellings of one quantity. The equality states it in the
      graph''s own idiom, so a reader of either id sees the derivation; the drift that made this alias
      list exist cannot return, because the equation holds at every value set.'
    system: employment
    lhs: hydrogen_fuel_cell_cost
    rhs: capex_hydrogen_fuel_cell
    relation: eq
    parameters:
    - hydrogen_fuel_cell_cost
    - capex_hydrogen_fuel_cell
    free_variables:
    - capex_hydrogen_fuel_cell
    determined_variables:
    - hydrogen_fuel_cell_cost
