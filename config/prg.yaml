  allowed_return_on_debt:
    name: Allowed return on debt
    description: The regulator's allowance for debt service, pre-tax. Was 0.08, below the commercial cost
      of debt it is meant to cap (0.09); an allowed return below market debt pricing closes every project
      in the jurisdiction and caps nothing. A 300 basis point spread over the policy rate is the level
      utility debt actually clears at.
    category: Regulatory Finance
    subcategory: null
    type: float
    unit: 1/year
    range:
    - 0.02
    - 0.25
    default: 0.12
    initial: null
    role: free
    determinism: policy
    categories: []
    source: Regulator's determination
    source_url: null
    users:
    - Regulators
    priority: P1
    status: to_build
    deprecated_by: null
  allowed_return_on_equity:
    name: Allowed return on equity
    description: The regulator's allowed equity return for a transmission or distribution utility. Was
      0.14, below the cost of equity the financial block carries (0.16), so the cap bound investments
      the utility's own financing terms refuse. 18% is an emerging-market utility's level; the range keeps
      30% as the ceiling.
    category: Regulatory Finance
    subcategory: null
    type: float
    unit: 1/year
    range:
    - 0.03
    - 0.3
    default: 0.18
    initial: null
    role: free
    determinism: policy
    categories: []
    source: Regulator's determination; cf. AER Rate of Return Instrument
    source_url: null
    users:
    - Regulators
    priority: P1
    status: to_build
    deprecated_by: null
  allowed_revenue_requirement:
    name: Allowed revenue requirement
    description: 'Depreciation plus the allowed return on the asset base: the revenue the utility must
      recover for the regulator''s accounts to balance. The tariff a cost-recovery regime sets is exactly
      this spread over the energy the fleet delivers, which is why the revenue cap''s multiplier reads
      a tariff the recovery identity computes rather than a second cost build-up.'
    category: Cost
    subcategory: null
    type: float
    unit: USD million/year
    range:
    - 0.0
    - 20000.0
    initial: null
