equations:
  affordability_constraint:
    name: Affordability limit
    description: The burden above which a tariff is politically impossible, whatever its LCOE.
    system: affordability
    lhs: energy_burden_limit
    rhs: energy_burden
    relation: geq
    parameters:
    - energy_burden_limit
    - energy_burden
    tolerance: 1.0e-06
    linearity: linear
    solution_method: numeric
    priority: P1
  annualised_capex:
    name: Annualised capital cost
    description: Capex recovered per year is capex times the recovery factor.
    system: cost_accounting
    lhs: annualised_capex_usd_per_kw
    rhs: capex_usd_per_kw * crf
    parameters:
    - annualised_capex_usd_per_kw
    - capex_usd_per_kw
    - crf
    determined_variables:
    - annualised_capex_usd_per_kw
    tolerance: 1.0e-09
    linearity: linear
    solution_method: direct
    priority: P1
  capture_price_equation:
    name: Capture price under cannibalisation
    description: 'The price a renewable unit receives falls as its own share rises. This is `params-prg1.md`
      §2 class 6: higher VRE lowers the capture price, which lowers the return to building more VRE.

      '
    system: capture_price
    lhs: capture_price_usd_per_mwh
    rhs: marginal_cost_usd_per_mwh * (1 - capture_price_sensitivity * vre_share)
    parameters:
    - capture_price_usd_per_mwh
    - marginal_cost_usd_per_mwh
    - capture_price_sensitivity
    - vre_share
    determined_variables:
    - capture_price_usd_per_mwh
    tolerance: 1.0e-08
    linearity: linear
    solution_method: iterative
    priority: P2
  capture_price_ratio_definition:
    name: Capture price ratio
    description: 'The loop''s answer as a single number: what a renewable unit is paid, against what the
      alternative costs to run.

      '
    system: capture_price
    lhs: capture_price_ratio
    rhs: capture_price_usd_per_mwh / marginal_cost_usd_per_mwh
    parameters:
    - capture_price_ratio
    - capture_price_usd_per_mwh
    - marginal_cost_usd_per_mwh
    determined_variables:
    - capture_price_ratio
    tolerance: 1.0e-08
    linearity: linear
    solution_method: direct
    priority: P2
  carbon_budget_constraint:
    name: Carbon budget
    description: 'A cumulative budget over a horizon is a constraint on the whole path, not on any one
      year, which is why it is an inequality and not a derivation.

      '
    system: carbon_trajectory
    lhs: carbon_budget_mtco2
    rhs: emissions_mtco2_per_year * horizon_years
    relation: geq
    parameters:
    - carbon_budget_mtco2
    - emissions_mtco2_per_year
    - horizon_years
    tolerance: 1.0e-06
    linearity: linear
    solution_method: numeric
    priority: P1
  carbon_budget_ratio_definition:
    name: Budget ratio
    description: Emissions over the horizon against the budget. Above one, the trajectory misses.
    system: carbon_trajectory
    lhs: carbon_budget_ratio
    rhs: emissions_mtco2_per_year * horizon_years / carbon_budget_mtco2
    parameters:
    - carbon_budget_ratio
    - emissions_mtco2_per_year
    - horizon_years
    - carbon_budget_mtco2
    determined_variables:
    - carbon_budget_ratio
    tolerance: 1.0e-09
    linearity: linear
    solution_method: direct
    priority: P2
  carbon_cost:
    name: Carbon cost per MWh
    description: 'Carbon price times emission factor: the price, per unit generated.'
    system: emissions
    lhs: carbon_cost_usd_per_mwh
    rhs: carbon_price_usd_per_tco2 * emission_factor_t_per_mwh
    parameters:
    - carbon_cost_usd_per_mwh
    - carbon_price_usd_per_tco2
    - emission_factor_t_per_mwh
    determined_variables:
    - carbon_cost_usd_per_mwh
    tolerance: 1.0e-09
    linearity: linear
    solution_method: direct
    priority: P1
  cfads_definition:
    name: Cash available for debt service
    description: 'Tariff less marginal cost, over the energy one kilowatt sells in a year. A stated simplification:
      the tariff is the single buyer''s whole revenue, not the generator''s share of it.

      '
    system: financial
    lhs: cfads_usd_per_kw_year
    rhs: (tariff_usd_per_mwh - marginal_cost_usd_per_mwh) * 8760 * capacity_factor / 1000
    parameters:
    - cfads_usd_per_kw_year
    - tariff_usd_per_mwh
    - marginal_cost_usd_per_mwh
    - capacity_factor
    determined_variables:
    - cfads_usd_per_kw_year
    tolerance: 1.0e-09
    linearity: linear
    solution_method: direct
    priority: P2
  cooling_water_definition:
    name: Cooling water demand
    description: Water the thermal fleet withdraws, per megawatt-hour generated.
    system: water_energy
    lhs: cooling_water_demand_m3
    rhs: generation_twh * 1000000 * cooling_water_m3_per_mwh
    parameters:
    - cooling_water_demand_m3
    - generation_twh
    - cooling_water_m3_per_mwh
    determined_variables:
    - cooling_water_demand_m3
    tolerance: 1.0e-09
    linearity: linear
    solution_method: direct
    priority: P2
  crf_definition:
    name: Capital recovery factor
    description: 'The annuity factor: the annual charge that repays one unit of capex over the asset''s
      life at the discount rate.

      '
    system: cost_accounting
    lhs: discount_rate * (1 + discount_rate) ** asset_life
    rhs: crf * ((1 + discount_rate) ** asset_life - 1)
    parameters:
    - crf
    - discount_rate
    - asset_life
    determined_variables:
    - crf
    tolerance: 1.0e-09
    reference: Standard annuity formula; cf. LCOE definitions in IEA/NEA Projected Costs of Generating
      Electricity
    linearity: nonlinear
    solution_method: direct
    priority: P1
  dalys_definition:
    name: DALYs
    description: Years of life lost per premature death, which is the burden the emissions cost in health.
    system: health
    lhs: dalys_per_year
    rhs: premature_deaths_per_year * years_of_life_lost
    parameters:
    - dalys_per_year
    - premature_deaths_per_year
    - years_of_life_lost
    determined_variables:
    - dalys_per_year
    tolerance: 1.0e-09
    linearity: linear
    solution_method: direct
    priority: P2
  debt_service_definition:
    name: Debt service
    description: The annuity a lender is repaid per kilowatt of debt-financed capex.
    system: financial
    lhs: debt_service_usd_per_kw_year
    rhs: debt_fraction * capex_usd_per_kw * cost_of_debt * (1 + cost_of_debt) ** asset_life / ((1 + cost_of_debt)
      ** asset_life - 1)
    parameters:
    - debt_service_usd_per_kw_year
    - debt_fraction
    - capex_usd_per_kw
    - cost_of_debt
    - asset_life
    determined_variables:
    - debt_service_usd_per_kw_year
    tolerance: 1.0e-09
    linearity: nonlinear
    solution_method: direct
    priority: P2
  direct_jobs_definition:
    name: Direct jobs
    description: Construction and O&M jobs the installed fleet supports.
    system: employment
    lhs: direct_jobs
    rhs: total_capacity_mw * (construction_jobs_per_mw + om_jobs_per_mw)
    parameters:
    - direct_jobs
    - total_capacity_mw
    - construction_jobs_per_mw
    - om_jobs_per_mw
    determined_variables:
    - direct_jobs
    tolerance: 1.0e-09
    linearity: linear
    solution_method: direct
    priority: P2
  dscr_definition:
    name: Debt service coverage ratio
    description: Cash available against the debt service the gearing implies.
    system: financial
    lhs: project_gearing_dscr
    rhs: cfads_usd_per_kw_year / debt_service_usd_per_kw_year
    parameters:
    - project_gearing_dscr
    - cfads_usd_per_kw_year
    - debt_service_usd_per_kw_year
    determined_variables:
    - project_gearing_dscr
    tolerance: 1.0e-09
    linearity: nonlinear
    solution_method: direct
    priority: P2
  dscr_requirement:
    name: DSCR floor
    description: 'The coverage a lender requires. A build that clears the physics and the cost can still
      be one no lender will finance, which is what this states.

      '
    system: financial
    lhs: project_gearing_dscr
    rhs: dscr_min
    relation: geq
    parameters:
    - project_gearing_dscr
    - dscr_min
    tolerance: 1.0e-06
    linearity: linear
    solution_method: numeric
    priority: P1
  emissions_definition:
    name: Annual emissions
    description: Generation times an emission factor. One terawatt-hour is one million megawatt-hours,
      so this reads directly in megatonnes.
    system: carbon_trajectory
    lhs: emissions_mtco2_per_year
    rhs: generation_twh * emission_factor_t_per_mwh
    parameters:
    - emissions_mtco2_per_year
    - generation_twh
    - emission_factor_t_per_mwh
    determined_variables:
    - emissions_mtco2_per_year
    tolerance: 1.0e-09
    linearity: linear
    solution_method: direct
    priority: P1
  energy_balance:
    name: Energy balance
    description: 'What is generated, less what the wires lose, plus what is imported, is what is served.
      A scenario that misses this is a scenario that does not clear, however cheap it is.

      '
    system: energy_balance
    lhs: generation_twh * (1 - transmission_loss_fraction) + net_imports_twh
    rhs: equilibrium_demand_twh
    parameters:
    - generation_twh
    - transmission_loss_fraction
    - net_imports_twh
    - equilibrium_demand_twh
    determined_variables:
    - generation_twh
    tolerance: 1.0e-09
    linearity: linear
    solution_method: direct
    priority: P1
  energy_burden_definition:
    name: Energy burden
    description: 'The share of household income spent on electricity. The system that stops a scenario
      being cost-optimal and socially impossible at once.

      '
    system: affordability
    lhs: energy_burden
    rhs: tariff_usd_per_mwh * household_consumption_mwh_per_year / household_income_usd_per_year
    parameters:
    - energy_burden
    - tariff_usd_per_mwh
    - household_consumption_mwh_per_year
    - household_income_usd_per_year
    determined_variables:
    - energy_burden
    tolerance: 1.0e-09
    linearity: linear
    solution_method: direct
    priority: P1
  energy_demand:
    name: Demand at the horizon
    description: 'Base-year demand compounded to the horizon year. A growth rate with no base and a base
      with no growth rate are the same document twice.

      '
    system: energy_balance
    lhs: demand_twh
    rhs: base_demand_twh * (1 + demand_growth) ** horizon_years
    parameters:
    - demand_twh
    - base_demand_twh
    - demand_growth
    - horizon_years
    determined_variables:
    - demand_twh
    tolerance: 1.0e-09
    linearity: nonlinear
    solution_method: direct
    priority: P1
  equilibrium_demand:
    name: Demand at the tariff
    description: 'Demand after the tariff moves, at a constant elasticity, against the tariff the system''s
      own cost implies. The reason a tariff rise is not a free fiscal move: it is also a demand forecast,
      and the demand it forecasts changes the cost the tariff was meant to recover. Iterative rather than
      a derivation because of that circularity -- see the System 15 block below, which is where the other
      half of the loop lives.

      '
    system: demand_supply
    lhs: equilibrium_demand_twh
    rhs: demand_twh * (regulated_tariff_usd_per_mwh / reference_tariff_usd_per_mwh) ** price_elasticity
    parameters:
    - equilibrium_demand_twh
    - demand_twh
    - regulated_tariff_usd_per_mwh
    - reference_tariff_usd_per_mwh
    - price_elasticity
    determined_variables:
    - equilibrium_demand_twh
    tolerance: 1.0e-08
    linearity: nonlinear
    solution_method: iterative
    priority: P2
  firm_capacity_definition:
    name: Firm capacity
    description: 'The firm fleet is the thermal units plus the dispatchable renewables: the generators
      whose output the operator chooses. Derived from the optimiser''s own capacity decisions, which is
      what makes the reserve margin below a check on the build rather than on a declared number.

      '
    system: reserve_margin
    lhs: firm_capacity_mw
    rhs: thermal_capacity_mw + dispatchable_re_capacity_mw
    parameters:
    - firm_capacity_mw
    - thermal_capacity_mw
    - dispatchable_re_capacity_mw
    determined_variables:
    - firm_capacity_mw
    tolerance: 1.0e-09
    reference: Nameplate adequacy accounting; cf. ENTSO-E adequacy studies
    linearity: linear
    solution_method: direct
    priority: P1
  hydrogen_water_definition:
    name: Hydrogen water demand
    description: Water the hydrogen programme consumes over the year.
    system: water_energy
    lhs: hydrogen_water_demand_m3
    rhs: hydrogen_production_kt_per_year * 1000000 * hydrogen_water_m3_per_kg
    parameters:
    - hydrogen_water_demand_m3
    - hydrogen_production_kt_per_year
    - hydrogen_water_m3_per_kg
    determined_variables:
    - hydrogen_water_demand_m3
    tolerance: 1.0e-09
    linearity: linear
    solution_method: direct
    priority: P2
  inertia_requirement:
    name: RoCoF limit
    description: The frequency slope the protection settings tolerate before tripping.
    system: inertia
    lhs: rocof_limit_hz_per_s
    rhs: rocof_df_dt_hz_per_s
    relation: geq
    parameters:
    - rocof_limit_hz_per_s
    - rocof_df_dt_hz_per_s
    tolerance: 1.0e-06
    linearity: linear
    solution_method: numeric
    priority: P1
  lcoe_definition:
    name: Levelised cost
    description: 'Levelised cost: the annualised capital charge spread over the energy the asset actually
      produces, plus marginal cost. The 1000 and 8760 convert kW to MW and hours to a year, and they are
      written here rather than folded into a constant so a reader can check the units.

      '
    system: cost_accounting
    lhs: lcoe_usd_per_mwh
    rhs: annualised_capex_usd_per_kw * 1000 / (8760 * capacity_factor) + marginal_cost_usd_per_mwh
    parameters:
    - lcoe_usd_per_mwh
    - annualised_capex_usd_per_kw
    - capacity_factor
    - marginal_cost_usd_per_mwh
    determined_variables:
    - lcoe_usd_per_mwh
    tolerance: 1.0e-09
    reference: IEA/NEA, Projected Costs of Generating Electricity
    linearity: linear
    solution_method: direct
    priority: P1
  lcoe_learning_definition:
    name: LCOE at learning-adjusted capex
    description: The same LCOE identity, over the capex the learning curve leaves.
    system: learning
    lhs: lcoe_learning_usd_per_mwh
    rhs: capex_learning_usd_per_kw * crf * 1000 / (8760 * capacity_factor) + marginal_cost_usd_per_mwh
    parameters:
    - lcoe_learning_usd_per_mwh
    - capex_learning_usd_per_kw
    - crf
    - capacity_factor
    - marginal_cost_usd_per_mwh
    determined_variables:
    - lcoe_learning_usd_per_mwh
    tolerance: 1.0e-09
    linearity: nonlinear
    solution_method: direct
    priority: P2
  learning_curve:
    name: Learning curve
    description: 'Cost falls with cumulative deployment at a stated learning rate, as a power law in the
      doubling count. The one system whose equation is non-linear in every parameter.

      '
    system: learning
    lhs: capex_learning_usd_per_kw
    rhs: capex_usd_per_kw * (cumulative_capacity_mw / cumulative_capacity_reference_mw) ** (log(1 - learning_rate)
      / log(2))
    parameters:
    - capex_learning_usd_per_kw
    - capex_usd_per_kw
    - cumulative_capacity_mw
    - cumulative_capacity_reference_mw
    - learning_rate
    determined_variables:
    - capex_learning_usd_per_kw
    tolerance: 1.0e-09
    reference: Wright's law; cf. IRENA renewable cost statistics
    linearity: nonlinear
    solution_method: direct
    priority: P1
  marginal_cost:
    name: Marginal cost
    description: 'Short-run marginal cost. The carbon cost enters here rather than as a separate term
      in the objective, so a carbon price and a fuel price cannot be double-counted or omitted independently.

      '
    system: cost_accounting
    lhs: marginal_cost_usd_per_mwh
    rhs: fuel_price_usd_per_mwh + carbon_cost_usd_per_mwh
    parameters:
    - marginal_cost_usd_per_mwh
    - fuel_price_usd_per_mwh
    - carbon_cost_usd_per_mwh
    determined_variables:
    - marginal_cost_usd_per_mwh
    tolerance: 1.0e-09
    linearity: linear
    solution_method: direct
    priority: P1
  ppa_price_definition:
    name: PPA price
    description: 'Cost plus the risk premium and the sponsor''s return, divided by availability. The price
      a project signs at, which is not its LCOE: the two differ by exactly the risk the offtaker will
      not carry.

      '
    system: ppa_pricing
    lhs: ppa_price_usd_per_mwh
    rhs: (lcoe_usd_per_mwh * (1 + offtake_risk_premium + equity_return_target)) / ppa_availability
    parameters:
    - ppa_price_usd_per_mwh
    - lcoe_usd_per_mwh
    - offtake_risk_premium
    - equity_return_target
    - ppa_availability
    determined_variables:
    - ppa_price_usd_per_mwh
    tolerance: 1.0e-09
    linearity: linear
    solution_method: direct
    priority: P2
  premature_deaths_definition:
    name: Premature deaths
    description: 'Exposed population times baseline mortality times the relative risk the particulate
      burden adds. The concentration-response function, linearised.

      '
    system: health
    lhs: premature_deaths_per_year
    rhs: exposed_population * baseline_mortality_rate * pm25_kt_per_year * pm25_relative_risk_per_kt
    parameters:
    - premature_deaths_per_year
    - exposed_population
    - baseline_mortality_rate
    - pm25_kt_per_year
    - pm25_relative_risk_per_kt
    determined_variables:
    - premature_deaths_per_year
    tolerance: 1.0e-09
    reference: Linearised concentration-response; cf. WHO AirQ+ methodology
    linearity: linear
    solution_method: direct
    priority: P2
  reliability_cost_definition:
    name: Reliability cost
    description: 'The value of the energy the system fails to serve. A reliability standard is a purchase,
      and this is its price.

      '
    system: reliability
    lhs: reliability_cost_usd
    rhs: unserved_energy_gwh * 1000 * voll_usd_per_mwh
    parameters:
    - reliability_cost_usd
    - unserved_energy_gwh
    - voll_usd_per_mwh
    determined_variables:
    - reliability_cost_usd
    tolerance: 1.0e-09
    linearity: linear
    solution_method: direct
    priority: P2
  reserve_margin:
    name: Reserve margin
    description: 'Firm capacity plus the renewable fleet''s contribution at its capacity factor must cover
      peak demand with the required margin. An inequality, because it bounds a build rather than fixing
      one.

      '
    system: reserve_margin
    lhs: firm_capacity_mw + vre_capacity_mw * capacity_factor
    rhs: peak_demand_mw * (1 + reserve_margin_min)
    relation: geq
    parameters:
    - firm_capacity_mw
    - vre_capacity_mw
    - capacity_factor
    - peak_demand_mw
    - reserve_margin_min
    tolerance: 1.0e-06
    reference: Standard N-1 planning criterion; cf. ENTSO-E adequacy studies
    linearity: linear
    solution_method: direct
    priority: P1
  rocof_definition:
    name: Rate of change of frequency
    description: 'The swing equation''s first instant: the largest credible loss divided by twice the
      stored kinetic energy. Bounds the instantaneous renewable share, because inverters store no kinetic
      energy.

      '
    system: inertia
    lhs: rocof_df_dt_hz_per_s
    rhs: largest_loss_mw / (2 * system_inertia_mws)
    parameters:
    - rocof_df_dt_hz_per_s
    - largest_loss_mw
    - system_inertia_mws
    determined_variables:
    - rocof_df_dt_hz_per_s
    tolerance: 1.0e-09
    reference: Swing equation at t=0, df/dt = -P_loss / (2 H S)
    linearity: linear
    solution_method: direct
    priority: P1
  tariff_cost_recovery:
    name: Cost-recovery tariff
    description: 'What serving the load costs, per unit sold: the annualised fixed charge spread over
      the energy, plus short-run marginal cost. A tariff below this is a subsidy; above it, a surplus.

      '
    system: price_demand
    lhs: regulated_tariff_usd_per_mwh
    rhs: annualised_capex_usd_per_kw * total_capacity_mw * 1000 / (equilibrium_demand_twh * 1000000) +
      marginal_cost_usd_per_mwh
    parameters:
    - regulated_tariff_usd_per_mwh
    - annualised_capex_usd_per_kw
    - total_capacity_mw
    - equilibrium_demand_twh
    - marginal_cost_usd_per_mwh
    determined_variables:
    - regulated_tariff_usd_per_mwh
    tolerance: 1.0e-08
    reference: 'Average-cost pricing: fixed cost recovered over units sold, plus short-run marginal cost'
    linearity: nonlinear
    solution_method: iterative
    priority: P2
  total_jobs_definition:
    name: Total jobs
    description: Direct employment plus what the supply chain and the wage bill support.
    system: employment
    lhs: total_jobs
    rhs: direct_jobs * (1 + indirect_jobs_multiplier + induced_jobs_multiplier)
    parameters:
    - total_jobs
    - direct_jobs
    - indirect_jobs_multiplier
    - induced_jobs_multiplier
    determined_variables:
    - total_jobs
    tolerance: 1.0e-09
    linearity: linear
    solution_method: direct
    priority: P2
  unserved_definition:
    name: Expected unserved energy
    description: Demand times the fraction the system is expected to fail to serve.
    system: reliability
    lhs: unserved_energy_gwh
    rhs: equilibrium_demand_twh * expected_unserved_fraction * 1000
    parameters:
    - unserved_energy_gwh
    - equilibrium_demand_twh
    - expected_unserved_fraction
    determined_variables:
    - unserved_energy_gwh
    tolerance: 1.0e-09
    linearity: linear
    solution_method: direct
    priority: P2
  vre_build:
    name: Renewable build response
    description: 'Investors build in proportion to the capture price''s ratio to the alternative''s cost.
      The loop''s forcing term, and the reason the fixed point is below the target: the build erodes the
      price that justified it.

      '
    system: capture_price
    lhs: vre_capacity_mw
    rhs: vre_capacity_target_mw * capture_price_usd_per_mwh / marginal_cost_usd_per_mwh
    parameters:
    - vre_capacity_mw
    - vre_capacity_target_mw
    - capture_price_usd_per_mwh
    - marginal_cost_usd_per_mwh
    determined_variables:
    - vre_capacity_mw
    tolerance: 1.0e-08
    linearity: linear
    solution_method: iterative
    priority: P2
  vre_share_definition:
    name: Renewable share
    description: Renewable capacity as a fraction of the system's total.
    system: capture_price
    lhs: vre_share
    rhs: vre_capacity_mw / total_capacity_mw
    parameters:
    - vre_share
    - vre_capacity_mw
    - total_capacity_mw
    determined_variables:
    - vre_share
    tolerance: 1.0e-08
    linearity: linear
    solution_method: iterative
    priority: P2
  wacc_definition:
    name: Weighted average cost of capital
    description: 'The blend of debt and equity, with interest shielded by tax. This is why the discount
      rate is derived: the blend and the rate are one quantity.

      '
    system: financial
    lhs: discount_rate
    rhs: debt_fraction * cost_of_debt * (1 - tax_rate) + (1 - debt_fraction) * cost_of_equity
    parameters:
    - discount_rate
    - debt_fraction
    - cost_of_debt
    - tax_rate
    - cost_of_equity
    determined_variables:
    - discount_rate
    tolerance: 1.0e-09
    reference: Standard WACC with the interest tax shield
    linearity: linear
    solution_method: direct
    priority: P1
  water_availability_constraint:
    name: Water availability
    description: 'Cooling and hydrogen demand together against what the catchment makes available. A build
      that clears on cost can still be one the catchment cannot supply.

      '
    system: water_energy
    lhs: water_availability_m3
    rhs: cooling_water_demand_m3 + hydrogen_water_demand_m3
    relation: geq
    parameters:
    - water_availability_m3
    - cooling_water_demand_m3
    - hydrogen_water_demand_m3
    tolerance: 1.0e-06
    linearity: linear
    solution_method: numeric
    priority: P2
