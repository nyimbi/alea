    rhs: capex_solar_pv
    relation: eq
    parameters:
    - solar_pv_cost
    - capex_solar_pv
    free_variables:
    - capex_solar_pv
    determined_variables:
    - solar_pv_cost
    tolerance: 1.0e-09
    unit_check: true
    reference: The fragments' alias register (docs/param_batch7.md and successors), applied
    priority: P2
    solution_method: direct
    linearity: linear
    latex: \mathrm{solar}_{pv\_cost} = \mathrm{capex}_{solar\_pv}
  tariff_cost_recovery:
    name: Cost-recovery tariff
    description: 'What serving the load costs, per unit sold: the annualised fixed charge spread over
      the energy, plus short-run marginal cost. A tariff below this is a subsidy; above it, a surplus.

      '
    system: price_demand
    lhs: regulated_tariff_usd_per_mwh
    rhs: annualised_capex_usd_per_kw * total_capacity_mw * 1000 / (equilibrium_demand_twh * 1000000) +
      marginal_cost_usd_per_mwh
    relation: eq
    parameters:
    - regulated_tariff_usd_per_mwh
    - annualised_capex_usd_per_kw
    - total_capacity_mw
    - equilibrium_demand_twh
    - marginal_cost_usd_per_mwh
    free_variables: []
    determined_variables:
    - regulated_tariff_usd_per_mwh
    tolerance: 1.0e-08
    unit_check: true
    reference: 'Average-cost pricing: fixed cost recovered over units sold, plus short-run marginal cost'
    priority: P2
    solution_method: iterative
    linearity: nonlinear
    latex: null
  tidal_range_cost_alias:
    name: Tidal range capital cost is Tidal range capital cost
    description: 'The alias resolution the fragments'' alias register declared and nothing applied: `tidal_range_cost`
      and `capex_tidal_range` are two spellings of one quantity. The equality states it in the graph''s
      own idiom, so a reader of either id sees the derivation; the drift that made this alias list exist
      cannot return, because the equation holds at every value set.'
    system: employment
    lhs: tidal_range_cost
    rhs: capex_tidal_range
    relation: eq
    parameters:
    - tidal_range_cost
    - capex_tidal_range
    free_variables:
    - capex_tidal_range
    determined_variables:
    - tidal_range_cost
    tolerance: 1.0e-09
    unit_check: true
    reference: The fragments' alias register (docs/param_batch7.md and successors), applied
    priority: P2
    solution_method: direct
    linearity: linear
    latex: \mathrm{tidal}_{range\_cost} = \mathrm{capex}_{tidal\_range}
  total_jobs_definition:
    name: Total jobs
    description: Direct employment plus what the supply chain and the wage bill support.
    system: employment
    lhs: total_jobs
    rhs: direct_jobs * (1 + indirect_jobs_multiplier + induced_jobs_multiplier)
    relation: eq
    parameters:
    - total_jobs
    - direct_jobs
    - indirect_jobs_multiplier
    - induced_jobs_multiplier
    free_variables: []
    determined_variables:
    - total_jobs
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  total_revenue_definition:
    name: Total revenue
    description: 'The fleet''s annual revenue at the PPA price. Dimensional check: TWh times 1e6 is MWh/year,
      times USD/MWh is USD/year. Uses the PPA price rather than a market price because the graph''s single-buyer
      simplification is what the revenue identity is written against.'
    system: financial
    lhs: total_revenue_usd_per_year
    rhs: generation_twh * 1000000 * ppa_price_usd_per_mwh
    relation: eq
    parameters:
    - generation_twh
    - ppa_price_usd_per_mwh
    free_variables:
    - generation_twh
    - ppa_price_usd_per_mwh
    determined_variables:
    - total_revenue_usd_per_year
    tolerance: 1.0e-06
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  total_water_demand_definition:
    name: Total water demand
    description: 'Cooling and hydrogen demand together. Dimensional check: m3 plus m3 is m3.'
    system: water_energy
    lhs: total_water_demand_m3
    rhs: cooling_water_demand_m3 + hydrogen_water_demand_m3
    relation: eq
    parameters:
    - cooling_water_demand_m3
    - hydrogen_water_demand_m3
    free_variables:
    - cooling_water_demand_m3
    - hydrogen_water_demand_m3
    determined_variables:
    - total_water_demand_m3
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  unserved_definition:
    name: Expected unserved energy
    description: Demand times the fraction the system is expected to fail to serve.
    system: reliability
    lhs: unserved_energy_gwh
    rhs: equilibrium_demand_twh * expected_unserved_fraction * 1000
    relation: eq
    parameters:
    - unserved_energy_gwh
    - equilibrium_demand_twh
    - expected_unserved_fraction
    free_variables: []
    determined_variables:
    - unserved_energy_gwh
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  variable_stack_definition:
    name: The variable cost stack
    description: 'Fuel and carbon: the marginal cost''s variable part. The shipped marginal-cost definition
      adds them already; this one is named so the pass-through and the applied-tariff chain can name what
      they scale, rather than reading the whole marginal cost.'
    system: cost_accounting
    lhs: variable_stack_usd_per_mwh
    rhs: fuel_price_usd_per_mwh + carbon_cost_usd_per_mwh
    relation: eq
    parameters:
    - variable_stack_usd_per_mwh
    - fuel_price_usd_per_mwh
    - carbon_cost_usd_per_mwh
    free_variables: []
    determined_variables:
