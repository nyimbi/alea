    latex: null
  equilibrium_demand:
    name: Demand at the tariff
    description: 'Demand after the tariff moves, at a constant elasticity, against the tariff the system''s
      own cost implies. The reason a tariff rise is not a free fiscal move: it is also a demand forecast,
      and the demand it forecasts changes the cost the tariff was meant to recover. Iterative rather than
      a derivation because of that circularity -- see the System 15 block below, which is where the other
      half of the loop lives.

      '
    system: demand_supply
    lhs: equilibrium_demand_twh
    rhs: demand_twh * (regulated_tariff_usd_per_mwh / reference_tariff_usd_per_mwh) ** price_elasticity
    relation: eq
    parameters:
    - equilibrium_demand_twh
    - demand_twh
    - regulated_tariff_usd_per_mwh
    - reference_tariff_usd_per_mwh
    - price_elasticity
    free_variables: []
    determined_variables:
    - equilibrium_demand_twh
    tolerance: 1.0e-08
    unit_check: true
    reference: null
    priority: P2
    solution_method: iterative
    linearity: nonlinear
    latex: null
  equity_irr_definition:
    name: Equity IRR estimate
    description: 'A first-year ratio: the return the sponsor earns on equity after debt service. Dimensional
      check: (USD/kW/year) / (USD/kW) is 1/year, which is a rate. A full IRR needs a schedule; this is
      the ratio a diligence process reads.'
    system: financial
    lhs: equity_irr_estimate
    rhs: (cfads_usd_per_kw_year - debt_service_usd_per_kw_year) / capex_usd_per_kw / (1 - debt_fraction)
    relation: eq
    parameters:
    - cfads_usd_per_kw_year
    - debt_service_usd_per_kw_year
    - capex_usd_per_kw
    - debt_fraction
    free_variables:
    - cfads_usd_per_kw_year
    - debt_service_usd_per_kw_year
    - capex_usd_per_kw
    - debt_fraction
    determined_variables:
    - equity_irr_estimate
    tolerance: 1.0e-08
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  equity_share_definition:
    name: Equity share from the debt fraction
    description: The equity share is the complement of the debt fraction. This is the identity that makes
      a scenario's debt and equity claims consistent by construction rather than by a cross-validation
      rule.
    system: financial
    lhs: equity_share
    rhs: 1 - debt_fraction
    relation: eq
    parameters:
    - debt_fraction
    free_variables: []
    determined_variables:
    - equity_share
    tolerance: 1.0e-06
    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{equity}_{share} = 1 - \mathrm{debt}_{fraction}
  firm_capacity_definition:
    name: Firm capacity
    description: 'The firm fleet is the thermal units plus the dispatchable renewables: the generators
      whose output the operator chooses. Derived from the optimiser''s own capacity decisions, which is
      what makes the reserve margin below a check on the build rather than on a declared number.

      '
    system: reserve_margin
    lhs: firm_capacity_mw
    rhs: thermal_capacity_mw + dispatchable_re_capacity_mw
    relation: eq
    parameters:
    - firm_capacity_mw
    - thermal_capacity_mw
    - dispatchable_re_capacity_mw
    free_variables: []
    determined_variables:
    - firm_capacity_mw
    tolerance: 1.0e-09
    unit_check: true
    reference: Nameplate adequacy accounting; cf. ENTSO-E adequacy studies
    priority: P1
    solution_method: direct
    linearity: linear
    latex: null
  fleet_build_balance:
    name: The build set within the fleet
    description: The optimiser's per-technology builds must not exceed the fleet size the plan declares
      for them. This is a *constraint* coupling -- the equation the LP carries, not an identity the evaluator
      solves -- because the builds are decision variables with no single value until the solve settles
      them.
    system: reserve_margin
    lhs: battery_capacity + biomass_capacity + coal_capacity + csp_capacity + gas_capacity + geothermal_capacity
      + hydro_capacity + nuclear_capacity + oil_capacity + phs_capacity + wind_offshore_capacity + wind_onshore_capacity
    rhs: total_capacity_mw + storage_headroom_mw
    relation: leq
    parameters:
    - battery_capacity
    - biomass_capacity
    - coal_capacity
    - csp_capacity
    - gas_capacity
    - geothermal_capacity
    - hydro_capacity
    - nuclear_capacity
    - oil_capacity
    - phs_capacity
    - wind_offshore_capacity
    - wind_onshore_capacity
    - total_capacity_mw
    - storage_headroom_mw
    free_variables:
    - total_capacity_mw
    - storage_headroom_mw
    determined_variables: []
    tolerance: 1.0e-06
    unit_check: true
    reference: 'Least-cost generation expansion: Koltsaklis & Dagoumas (2018), Applied Energy 230:563-589;
      Tejada-Arango (2023), arXiv:2307.16842; Oree et al. (2017), RSER 69:790-803'
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{battery}_{capacity} + \mathrm{biomass}_{capacity} + \mathrm{coal}_{capacity} + \mathrm{csp}_{capacity}
      + \mathrm{gas}_{capacity} + \mathrm{geothermal}_{capacity} + \mathrm{hydro}_{capacity} + \mathrm{nuclear}_{capacity}
      + \mathrm{oil}_{capacity} + \mathrm{phs}_{capacity} + \mathrm{wind}_{offshore\_capacity} + \mathrm{wind}_{onshore\_capacity}
      \leq \mathrm{total}_{capacity\_mw} + \mathrm{storage}_{headroom\_mw}
  fleet_emission_intensity_definition:
    name: Fleet emission intensity
    description: 'The emission factor at the horizon, discounted by the CCS the fleet carries. Dimensional
      check: tonne/MWh times a dimensionless share is tonne/MWh.'
    system: emissions
    lhs: fleet_emission_intensity_t_per_mwh
