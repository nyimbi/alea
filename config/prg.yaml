equations:
  affordability_constraint:
    name: Affordability limit
    description: The burden above which a tariff is politically impossible, whatever its LCOE.
    system: affordability
    lhs: energy_burden_limit
    rhs: energy_burden
    relation: geq
    parameters:
    - energy_burden_limit
    - energy_burden
    free_variables: []
    determined_variables: []
    tolerance: 1.0e-06
    unit_check: true
    reference: null
    priority: P1
    solution_method: numeric
    linearity: linear
    latex: null
  agricultural_demand_definition:
    name: Agricultural demand
    description: 'The share times the demand it is a share OF. A share with no numerator is a word; with
      the total demand as its base it is a quantity the metering checks the synthesis against. Units:
      a dimensionless share times TWh is TWh.'
    system: demand_supply
    lhs: agricultural_demand_twh
    rhs: agricultural_demand_share * base_demand_twh
    relation: eq
    parameters:
    - agricultural_demand_twh
    - agricultural_demand_share
    - base_demand_twh
    free_variables:
    - agricultural_demand_share
    - base_demand_twh
    determined_variables:
    - agricultural_demand_twh
    tolerance: 1.0e-09
    unit_check: true
    reference: Bottom-up load synthesis (catalog method cell)
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{agricultural}_{demand\_twh} = \mathrm{agricultural}_{demand\_share} \mathrm{base}_{demand\_twh}
  allowed_revenue_requirement_definition:
    name: Allowed revenue requirement
    description: Depreciation plus the allowed return on the base, with that return taken as the blend
      the financial block computes -- the vanilla regulatory WACC the UKRN guidance builds. A tariff that
      recovers less than this under-recovers the utility; the revenue cap and the applied tariff are the
      instruments around it.
    system: financial
    lhs: allowed_revenue_requirement
    rhs: regulatory_depreciation + regulatory_asset_base * discount_rate
    relation: eq
    parameters:
    - allowed_revenue_requirement
    - regulatory_depreciation
    - regulatory_asset_base
    - discount_rate
    free_variables:
    - regulatory_depreciation
    - regulatory_asset_base
    determined_variables:
    - allowed_revenue_requirement
    tolerance: 1.0e-09
    unit_check: true
    reference: UKRN cost of capital guidance (2023), §allowed returns
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{allowed}_{revenue\_requirement} = \mathrm{regulatory}_{depreciation} + \mathrm{regulatory}_{asset\_base}
      \mathrm{discount}_{rate}
  ammonia_price_per_mwh_definition:
    name: ammonia price per mwh (computed)
    description: 'Ammonia''s lower heating value is 18.6 GJ per tonne; at 3.6 GJ per MWh that is 5.167
      MWh delivered per tonne. The delivered price divides. The conversion is dimensional: a price over
      an energy basis scales by the unit''s own MWh content.'
    system: cost_accounting
    lhs: ammonia_price_per_mwh
    rhs: ammonia_price / mwh_per_ammonia_unit
    relation: eq
    parameters:
    - ammonia_price_per_mwh
    - ammonia_price
    - mwh_per_ammonia_unit
    free_variables:
    - ammonia_price
    - mwh_per_ammonia_unit
    determined_variables:
    - ammonia_price_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    reference: 'LHV of NH3: 18.6 GJ/t (standard fuel tables)'
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{ammonia}_{price\_per\_mwh} = \frac{\mathrm{ammonia}_{price}}{\mathrm{mwh}_{per\_ammonia\_unit}}
  annualised_capex:
    name: Annualised capital cost
    description: Capex recovered per year is capex times the recovery factor.
    system: cost_accounting
    lhs: annualised_capex_usd_per_kw
    rhs: capex_usd_per_kw * crf
    relation: eq
    parameters:
    - annualised_capex_usd_per_kw
    - capex_usd_per_kw
    - crf
    free_variables: []
    determined_variables:
    - annualised_capex_usd_per_kw
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: linear
    latex: null
  annualised_capex_solar_definition:
    name: Annualised solar capex
    description: 'Solar capex recovered per year, at the system discount rate. Dimensional check: USD/kW
      times a dimensionless factor is USD/kW/year.'
    system: cost_accounting
    lhs: annualised_capex_usd_per_kw_solar
    rhs: capex_solar_pv * crf
    relation: eq
    parameters:
    - capex_solar_pv
    - crf
    free_variables:
    - capex_solar_pv
    - crf
    determined_variables:
    - annualised_capex_usd_per_kw_solar
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  annualised_capex_wind_definition:
    name: Annualised wind capex
    description: 'Onshore wind capex recovered per year, at the same discount rate. Dimensional check:
      USD/kW times a dimensionless factor is USD/kW/year.'
    system: cost_accounting
    lhs: annualised_capex_usd_per_kw_wind
    rhs: capex_wind_onshore * crf
    relation: eq
    parameters:
    - capex_wind_onshore
    - crf
    free_variables:
    - capex_wind_onshore
    - crf
    determined_variables:
    - annualised_capex_usd_per_kw_wind
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  applied_tariff_definition:
    name: Applied tariff under the cap
    description: The revenue cap's multiplier applied to the cost-recovery tariff. A cap below 1.0 withholds
      part of the revenue requirement -- the incentive instrument a price-control settlement actually
      sets -- and a cap above 1.0 is a premium the accounts must carry.
    system: price_demand
    lhs: applied_tariff_usd_per_mwh
    rhs: regulated_tariff_usd_per_mwh * revenue_cap
    relation: eq
    parameters:
    - applied_tariff_usd_per_mwh
    - regulated_tariff_usd_per_mwh
    - revenue_cap
    free_variables:
    - revenue_cap
    determined_variables:
    - applied_tariff_usd_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    reference: World Bank Regulation of Utilities handbook, revenue caps
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{applied}_{tariff\_usd\_per\_mwh} = \mathrm{regulated}_{tariff\_usd\_per\_mwh} \mathrm{revenue}_{cap}
  availability_definition:
    name: Availability from MTBF and MTTR
    description: 'The steady-state UNAVAILABILITY: the fraction of time the asset is down, which is what
      `forced_outage_rate` means. MTTR / (MTBF + MTTR) is the down fraction, not the up fraction -- the
      batch described this result as "availability, the fraction of time the asset is up", which is its
      complement, 1 - MTTR/(MTBF+MTTR). The arithmetic is unchanged; only the description was inverted.
      Dimensional check: hours / (hours + hours) is dimensionless.'
    system: reliability
    lhs: forced_outage_rate
    rhs: mean_time_to_repair / (mean_time_between_failures + mean_time_to_repair)
    relation: eq
    parameters:
    - forced_outage_rate
    - mean_time_between_failures
    - mean_time_to_repair
    free_variables:
    - mean_time_between_failures
    - mean_time_to_repair
    determined_variables:
    - forced_outage_rate
    tolerance: 1.0e-06
    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: nonlinear
    latex: null
  battery_cost_alias:
    name: Battery capital cost (legacy) is Battery capital cost
    description: 'The alias resolution the fragments'' alias register declared and nothing applied: `battery_cost`
      and `capex_battery` are two spellings of one quantity. The equality states it in the graph''s own
      idiom, so a reader of either id sees the derivation; the drift that made this alias list exist cannot
      return, because the equation holds at every value set.'
    system: employment
    lhs: battery_cost
    rhs: capex_battery
    relation: eq
    parameters:
    - battery_cost
    - capex_battery
    free_variables:
    - capex_battery
    determined_variables:
    - battery_cost
    tolerance: 1.0e-09
    unit_check: true
    reference: The fragments' alias register (docs/param_batch7.md and successors), applied
    priority: P2
    solution_method: direct
    linearity: linear
    latex: \mathrm{battery}_{cost} = \mathrm{capex}_{battery}
  benefit_sharing_from_revenue_definition:
    name: Community benefit transfer
    description: 'The revenue transferred to the host community, from the project''s total revenue and
      the benefit-sharing share. Dimensional check: USD/year times a dimensionless share is USD/year.'
    system: employment
    lhs: community_benefit_usd_per_year
    rhs: generation_twh * 1000000 * ppa_price_usd_per_mwh * community_benefit_share_of_revenue
    relation: eq
    parameters:
    - community_benefit_usd_per_year
    - generation_twh
    - ppa_price_usd_per_mwh
    - community_benefit_share_of_revenue
    free_variables:
    - generation_twh
    - ppa_price_usd_per_mwh
    - community_benefit_share_of_revenue
    determined_variables:
    - community_benefit_usd_per_year
    tolerance: 1.0e-06
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  biogas_cost_alias:
    name: Biogas plant capital cost is Biogas plant capital cost
    description: 'The alias resolution the fragments'' alias register declared and nothing applied: `biogas_cost`
      and `capex_biogas` are two spellings of one quantity. The equality states it in the graph''s own
      idiom, so a reader of either id sees the derivation; the drift that made this alias list exist cannot
      return, because the equation holds at every value set.'
    system: employment
    lhs: biogas_cost
    rhs: capex_biogas
    relation: eq
    parameters:
    - biogas_cost
    - capex_biogas
    free_variables:
    - capex_biogas
    determined_variables:
    - biogas_cost
    tolerance: 1.0e-09
    unit_check: true
    reference: The fragments' alias register (docs/param_batch7.md and successors), applied
    priority: P2
    solution_method: direct
    linearity: linear
    latex: \mathrm{biogas}_{cost} = \mathrm{capex}_{biogas}
  capacity_credit_definition:
    name: VRE capacity credit
    description: 'The firm contribution a renewable fleet makes to the reserve margin. Approximated as
      the fleet''s average capacity factor, which is the standard first-order proxy when the graph carries
      no hourly data on the peak-hour output of each technology. Dimensional check: dimensionless times
      MW is MW.'
    system: reserve_margin
    lhs: vre_firm_capacity_mw
    rhs: vre_capacity_mw * capacity_factor
    relation: eq
    parameters:
    - vre_capacity_mw
    - capacity_factor
    free_variables:
    - vre_capacity_mw
    - capacity_factor
    determined_variables:
    - vre_firm_capacity_mw
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: linear
    latex: null
  capture_price_equation:
    name: Capture price under cannibalisation
    description: 'The price a renewable unit receives falls as its own share rises. This is `params-prg1.md`
      §2 class 6: higher VRE lowers the capture price, which lowers the return to building more VRE.

      '
    system: capture_price
    lhs: capture_price_usd_per_mwh
    rhs: marginal_cost_usd_per_mwh * (1 - capture_price_sensitivity * vre_share)
    relation: eq
    parameters:
    - capture_price_usd_per_mwh
    - marginal_cost_usd_per_mwh
    - capture_price_sensitivity
    - vre_share
    free_variables: []
    determined_variables:
    - capture_price_usd_per_mwh
    tolerance: 1.0e-08
    unit_check: true
    reference: null
    priority: P2
    solution_method: iterative
    linearity: linear
    latex: null
  capture_price_ratio_definition:
    name: Capture price ratio
    description: 'The loop''s answer as a single number: what a renewable unit is paid, against what the
      alternative costs to run.

      '
    system: capture_price
    lhs: capture_price_ratio
    rhs: capture_price_usd_per_mwh / marginal_cost_usd_per_mwh
    relation: eq
    parameters:
    - capture_price_ratio
    - capture_price_usd_per_mwh
    - marginal_cost_usd_per_mwh
    free_variables: []
    determined_variables:
    - capture_price_ratio
    tolerance: 1.0e-08
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  carbon_budget_constraint:
    name: Carbon budget
    description: 'A cumulative budget over a horizon is a constraint on the whole path, not on any one
      year, which is why it is an inequality and not a derivation.

      '
    system: carbon_trajectory
    lhs: carbon_budget_mtco2
    rhs: emissions_mtco2_per_year * horizon_years
    relation: geq
    parameters:
    - carbon_budget_mtco2
    - emissions_mtco2_per_year
    - horizon_years
    free_variables: []
    determined_variables: []
    tolerance: 1.0e-06
    unit_check: true
    reference: null
    priority: P1
    solution_method: numeric
    linearity: linear
    latex: null
  carbon_budget_ratio_definition:
    name: Budget ratio
    description: Emissions over the horizon against the budget. Above one, the trajectory misses.
    system: carbon_trajectory
    lhs: carbon_budget_ratio
    rhs: emissions_mtco2_per_year * horizon_years / carbon_budget_mtco2
    relation: eq
    parameters:
    - carbon_budget_ratio
    - emissions_mtco2_per_year
    - horizon_years
    - carbon_budget_mtco2
    free_variables: []
    determined_variables:
    - carbon_budget_ratio
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  carbon_cost:
    name: Carbon cost per MWh
    description: 'Carbon price times emission factor: the price, per unit generated.'
    system: emissions
    lhs: carbon_cost_usd_per_mwh
    rhs: carbon_price_usd_per_tco2 * emission_factor_t_per_mwh
    relation: eq
    parameters:
    - carbon_cost_usd_per_mwh
    - carbon_price_usd_per_tco2
    - emission_factor_t_per_mwh
    free_variables: []
    determined_variables:
    - carbon_cost_usd_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: linear
    latex: null
  carbon_price_escalated_definition:
    name: Escalated carbon price
    description: 'The base-year carbon price compounded to the horizon. Dimensional check: USD/tonne times
      a dimensionless factor is USD/tonne.'
    system: carbon_trajectory
    lhs: carbon_price_escalated_usd_per_tco2
    rhs: carbon_price_usd_per_tco2 * (1 + carbon_price_escalation) ** horizon_years
    relation: eq
    parameters:
    - carbon_price_usd_per_tco2
    - carbon_price_escalation
    - horizon_years
    free_variables:
    - carbon_price_usd_per_tco2
    - carbon_price_escalation
    - horizon_years
    determined_variables:
    - carbon_price_escalated_usd_per_tco2
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: nonlinear
    latex: null
  carbon_revenue_definition:
    name: Carbon revenue
    description: 'Covered emissions times the price. Dimensional check: MtCO2/year times USD/tonne is
      USD-million/year; the 1000000 converts to USD/year. Uses the base-year price, not the escalated
      price: a government does not collect next decade''s revenue today.'
    system: emissions
    lhs: carbon_revenue_usd_per_year
    rhs: emissions_mtco2_per_year * carbon_price_usd_per_tco2 * carbon_price_coverage * 1000000
    relation: eq
    parameters:
    - emissions_mtco2_per_year
    - carbon_price_usd_per_tco2
    - carbon_price_coverage
    free_variables:
    - emissions_mtco2_per_year
    - carbon_price_usd_per_tco2
    - carbon_price_coverage
    determined_variables:
    - carbon_revenue_usd_per_year
    tolerance: 1.0e-06
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  cfads_definition:
    name: Cash available for debt service
    description: 'Tariff less marginal cost, over the energy one kilowatt sells in a year. A stated simplification:
      the tariff is the single buyer''s whole revenue, not the generator''s share of it.

      '
    system: financial
    lhs: cfads_usd_per_kw_year
    rhs: (tariff_usd_per_mwh - marginal_cost_usd_per_mwh) * 8760 * capacity_factor / 1000
    relation: eq
    parameters:
    - cfads_usd_per_kw_year
    - tariff_usd_per_mwh
    - marginal_cost_usd_per_mwh
    - capacity_factor
    free_variables: []
    determined_variables:
    - cfads_usd_per_kw_year
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  coal_eaf_definition:
    name: Coal availability from its outage rates
    description: 'The energy availability factor: the share of rated energy the fleet can deliver, which
      is one minus the fraction lost to forced and planned outages. Both outage rates are shares of the
      same rated energy, so they subtract from one without a capacity weighting.'
    system: reliability
    lhs: coal_eaf
    rhs: 1 - forced_outage_rate - planned_outage_rate
    relation: eq
    parameters:
    - forced_outage_rate
    - planned_outage_rate
    free_variables: []
    determined_variables:
    - coal_eaf
    tolerance: 1.0e-06
    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{coal}_{eaf} = 1 - \mathrm{forced}_{outage\_rate} - \mathrm{planned}_{outage\_rate}
  coal_price_per_mwh_definition:
    name: Coal price per MWh thermal
    description: 'Commodity coal price converted to a thermal basis. Dimensional check: USD/tonne divided
      by (GJ/tonne times MWh/GJ) is USD/MWh. The 3.6 is MWh per GJ; the 25 is GJ per tonne. Both are written
      so a reader can check the conversion, because the conversion is where a unit error would hide.'
    system: cost_accounting
    lhs: coal_price_per_mwh
    rhs: coal_price / (25 * 3.6)
    relation: eq
    parameters:
    - coal_price
    free_variables:
    - coal_price
    determined_variables:
    - coal_price_per_mwh
    tolerance: 1.0e-09
    unit_check: false
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  commercial_demand_definition:
    name: Commercial demand
    description: 'The share times the demand it is a share OF. A share with no numerator is a word; with
      the total demand as its base it is a quantity the metering checks the synthesis against. Units:
      a dimensionless share times TWh is TWh.'
    system: demand_supply
    lhs: commercial_demand_twh
    rhs: commercial_demand_share * base_demand_twh
    relation: eq
    parameters:
    - commercial_demand_twh
    - commercial_demand_share
    - base_demand_twh
    free_variables:
    - commercial_demand_share
    - base_demand_twh
    determined_variables:
    - commercial_demand_twh
    tolerance: 1.0e-09
    unit_check: true
    reference: Bottom-up load synthesis (catalog method cell)
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{commercial}_{demand\_twh} = \mathrm{commercial}_{demand\_share} \mathrm{base}_{demand\_twh}
  composite_governance_index_definition:
    name: Composite governance index
    description: 'The unweighted average of the five governance indicators. Dimensional check: the sum
      of five dimensionless quantities divided by five is dimensionless. The unweighted average is a stated
      simplification: a weighted composite needs weights the graph does not carry, and the unweighted
      form is what a reader can check from the components.'
    system: demand_supply
    lhs: composite_governance_index
    rhs: (rule_of_law_index + political_stability + corruption_perception + regulatory_predictability
      + contract_enforceability) / 5
    relation: eq
    parameters:
    - rule_of_law_index
    - political_stability
    - corruption_perception
    - regulatory_predictability
    - contract_enforceability
    free_variables:
    - rule_of_law_index
    - political_stability
    - corruption_perception
    - regulatory_predictability
    - contract_enforceability
    determined_variables:
    - composite_governance_index
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  compressed_air_cost_alias:
    name: CAES capital cost is Compressed air storage capital cost
    description: 'The alias resolution the fragments'' alias register declared and nothing applied: `compressed_air_cost`
      and `capex_caes` are two spellings of one quantity. The equality states it in the graph''s own idiom,
      so a reader of either id sees the derivation; the drift that made this alias list exist cannot return,
      because the equation holds at every value set.'
    system: employment
    lhs: compressed_air_cost
    rhs: capex_caes
    relation: eq
    parameters:
    - compressed_air_cost
    - capex_caes
    free_variables:
    - capex_caes
    determined_variables:
    - compressed_air_cost
    tolerance: 1.0e-09
    unit_check: true
    reference: The fragments' alias register (docs/param_batch7.md and successors), applied
    priority: P2
    solution_method: direct
    linearity: linear
    latex: \mathrm{compressed}_{air\_cost} = \mathrm{capex}_{caes}
  consumer_surplus_definition:
    name: Consumer surplus
    description: 'A linear approximation of the triangle under the demand curve. Dimensional check: (USD/MWh)
      times (MWh) is USD, times a dimensionless elasticity factor is USD. The 0.5 is the half-base rule
      for a linear demand curve; the shipped graph does not carry a demand-curve slope, so the elasticity
      is used as the shape parameter.'
    system: price_demand
    lhs: consumer_surplus_usd_per_year
    rhs: (reference_tariff_usd_per_mwh - regulated_tariff_usd_per_mwh) * equilibrium_demand_twh * 1000000
      * price_elasticity * 0.5
    relation: eq
    parameters:
    - reference_tariff_usd_per_mwh
    - regulated_tariff_usd_per_mwh
    - equilibrium_demand_twh
    - price_elasticity
    free_variables:
    - reference_tariff_usd_per_mwh
    - regulated_tariff_usd_per_mwh
    - equilibrium_demand_twh
    - price_elasticity
    determined_variables:
    - consumer_surplus_usd_per_year
    tolerance: 1.0e-06
    unit_check: false
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  cooling_water_definition:
    name: Cooling water demand
    description: Water the thermal fleet withdraws, per megawatt-hour generated.
    system: water_energy
    lhs: cooling_water_demand_m3
    rhs: generation_twh * 1000000 * cooling_water_m3_per_mwh
    relation: eq
    parameters:
    - cooling_water_demand_m3
    - generation_twh
    - cooling_water_m3_per_mwh
    free_variables: []
    determined_variables:
    - cooling_water_demand_m3
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  cost_of_debt_capped:
    name: Debt cost within the allowed return
    description: 'The regulator''s debt allowance binds the commercial cost of debt the scenario may assume:
      a component priced above the allowed return is the pass-through the cap regime forbids, so a scenario
      carrying it is inadmissible rather than silently under-recovering.'
    system: financial
    lhs: cost_of_debt
    rhs: allowed_return_on_debt
    relation: leq
    parameters:
    - cost_of_debt
    - allowed_return_on_debt
    free_variables:
    - cost_of_debt
    - allowed_return_on_debt
    determined_variables: []
    tolerance: 1.0e-06
    unit_check: true
    reference: UKRN cost of capital guidance (2023), §overall framework
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{cost}_{of\_debt} \leq \mathrm{allowed}_{return\_on\_debt}
  cost_of_equity_capped:
    name: Equity cost within the allowed return
    description: 'The equity-return allowance binds the cost of equity: the CAPM-estimated return a project
      demands cannot exceed what the regulatory settlement awards.'
    system: financial
    lhs: cost_of_equity
    rhs: allowed_return_on_equity
    relation: leq
    parameters:
    - cost_of_equity
    - allowed_return_on_equity
    free_variables:
    - cost_of_equity
    - allowed_return_on_equity
    determined_variables: []
    tolerance: 1.0e-06
    unit_check: true
    reference: Ofwat PR24 Appendix 11, allowed return on capital
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{cost}_{of\_equity} \leq \mathrm{allowed}_{return\_on\_equity}
  crf_biomass_definition:
    name: CRF (biomass)
    description: 'The standard annuity: a constant annual charge whose present value equals one unit of
      capital over this technology''s life, at the fleet discount rate. Reference: the CRF row in sources/INDEX.md;
      NREL ATB 2025 states the same form.'
    system: financial
    lhs: crf_biomass
    rhs: discount_rate * (1 + discount_rate) ** asset_life_biomass / ((1 + discount_rate) ** asset_life_biomass
      - 1)
    relation: eq
    parameters:
    - crf_biomass
    - discount_rate
    - asset_life_biomass
    free_variables:
    - discount_rate
    - asset_life_biomass
    determined_variables:
    - crf_biomass
    tolerance: 1.0e-09
    unit_check: true
    reference: Standard annuity formula
    priority: P2
    solution_method: numeric
    linearity: nonlinear
    latex: \mathrm{crf}_{biomass} = \frac{\mathrm{discount}_{rate} {\left(1 + \mathrm{discount}_{rate}\right)}^{\mathrm{asset}_{life\_biomass}}}{{\left(\mathrm{discount}_{rate}
      + 1\right)}^{\mathrm{asset}_{life\_biomass}} - 1}
