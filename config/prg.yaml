    reference: Composition-target shares (planning policy)
    priority: P2
    solution_method: direct
    linearity: linear
    latex: \mathrm{locally}_{sourced\_jobs} = \mathrm{direct}_{jobs} \mathrm{local}_{employment\_share}
  lole_definition:
    name: Loss of load expectation
    description: 'The LOLP annualised: the probability times the hours in a year. Dimensional check: dimensionless
      times hours/year is hours/year.'
    system: reliability
    lhs: lole_hours_per_year
    rhs: lolp * 8760
    relation: eq
    parameters:
    - lolp
    free_variables:
    - lolp
    determined_variables:
    - lole_hours_per_year
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: linear
    latex: null
  lolp_definition:
    name: Loss of load probability
    description: 'The LOLP as an exponential in the reserve margin. A standard first-order approximation
      when the graph carries no forced-outage distribution: the LOLP falls off exponentially with margin.
      The decay is CALIBRATED to this graph''s own reliability rules, not chosen: `lole_exceeds_days`
      (Batch 6) flags a loss-of-load expectation above one day per year, and 24 hours / 8760 hours is
      a LOLP of 24/8760, so the curve is pinned to pass through `lolp = 24/8760` at the required minimum
      margin `reserve_margin_min = 0.15`. Written as `(24/8760) ** (m / 0.15)` that is exact at the pin
      and stays inside [0, 1] for every m >= 0, because a base in [0, 1] raised to a non-negative power
      is in [0, 1] — the range is a property of the form. The previous form, `exp(-10 * m)`, was the same
      family with an uncalibrated constant: at the default m = 0.15 it returned 0.2231, a LOLP of 1 hour
      in 4.5, which put LOLE at 1954.6 h/yr — 81x the batch''s own 24 h/yr ceiling and outside the node''s
      declared range of [0, 500]. The batch''s prose said the constant was "set so a margin equal to the
      required minimum gives a LOLP near the regulatory ceiling of 1 in 100 hours"; 10 does not do that
      (it gives 0.2231, not 0.01), and the arithmetic never named `reserve_margin_min`''s default, so
      the claim was never checked against the curve it describes. Dimensional check: dimensionless raised
      to a dimensionless power is dimensionless.'
    system: reliability
    lhs: lolp
    rhs: (24 / 8760) ** (reserve_margin_min / 0.15)
    relation: eq
    parameters:
    - reserve_margin_min
    free_variables:
    - reserve_margin_min
    determined_variables:
    - lolp
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: nonlinear
    latex: null
  marginal_cost:
    name: Marginal cost
    description: 'Short-run marginal cost. The carbon cost enters here rather than as a separate term
      in the objective, so a carbon price and a fuel price cannot be double-counted or omitted independently.

      '
    system: cost_accounting
    lhs: marginal_cost_usd_per_mwh
    rhs: fuel_price_usd_per_mwh + carbon_cost_usd_per_mwh
    relation: eq
    parameters:
    - marginal_cost_usd_per_mwh
    - fuel_price_usd_per_mwh
    - carbon_cost_usd_per_mwh
    free_variables: []
    determined_variables:
    - marginal_cost_usd_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: linear
    latex: null
  oil_eaf_definition:
    name: Oil availability from its outage rates
    description: The oil fleet's energy availability, over the same two outage rates as coal. Oil and
      coal share the fleet-level forced-outage node because both are reported against one thermal availability
      figure in the national statistics the catalog cites.
    system: reliability
    lhs: oil_eaf
    rhs: 1 - forced_outage_rate - planned_outage_rate
    relation: eq
    parameters:
    - forced_outage_rate
    - planned_outage_rate
    free_variables: []
    determined_variables:
    - oil_eaf
    tolerance: 1.0e-06
    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{oil}_{eaf} = 1 - \mathrm{forced}_{outage\_rate} - \mathrm{planned}_{outage\_rate}
  oil_price_per_mwh_definition:
    name: oil price per mwh (computed)
    description: 'A barrel of crude carries, on the EIA distillate average, 5.8 MMBtu; at 0.29307 MWh
      per MMBtu that is 1.699 MWh delivered per barrel. The delivered price divides by the energy content,
      so the constant''s unit is MWh/barrel. The conversion is dimensional: a price over an energy basis
      scales by the unit''s own MWh content.'
    system: cost_accounting
    lhs: oil_price_per_mwh
    rhs: oil_price / mwh_per_oil_unit
    relation: eq
    parameters:
    - oil_price_per_mwh
    - oil_price
    - mwh_per_oil_unit
    free_variables:
    - oil_price
    - mwh_per_oil_unit
    determined_variables:
    - oil_price_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    reference: EIA conversion basis (5.8 MMBtu/barrel); physical constant 0.29307 MWh/MMBtu
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{oil}_{price\_per\_mwh} = \frac{\mathrm{oil}_{price}}{\mathrm{mwh}_{per\_oil\_unit}}
  pass_through_tariff_definition:
    name: Tariff with pass-through
    description: 'The cost-recovery level plus the variable stack carried at the pass-through share the
      policy sets. The regulator''s lever: the share the variable costs pass to consumers against what
      the utility absorbs.'
    system: price_demand
    lhs: pass_through_tariff_usd_per_mwh
    rhs: applied_tariff_usd_per_mwh + wholesale_cost_pass_through * variable_stack_usd_per_mwh
    relation: eq
    parameters:
    - pass_through_tariff_usd_per_mwh
    - applied_tariff_usd_per_mwh
    - wholesale_cost_pass_through
    - variable_stack_usd_per_mwh
    free_variables:
    - applied_tariff_usd_per_mwh
    - wholesale_cost_pass_through
    determined_variables:
    - pass_through_tariff_usd_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    reference: Pass-through pricing
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{pass}_{through\_tariff\_usd\_per\_mwh} = \mathrm{applied}_{tariff\_usd\_per\_mwh} +
      \mathrm{wholesale}_{cost\_pass\_through} \mathrm{variable}_{stack\_usd\_per\_mwh}
  phs_cost_alias:
    name: Pumped hydro capital cost (legacy) is PHS capital cost
    description: 'The alias resolution the fragments'' alias register declared and nothing applied: `phs_cost`
      and `capex_phs` are two spellings of one quantity. The equality states it in the graph''s own idiom,
      so a reader of either id sees the derivation; the drift that made this alias list exist cannot return,
      because the equation holds at every value set.'
    system: employment
    lhs: phs_cost
    rhs: capex_phs
    relation: eq
    parameters:
    - phs_cost
    - capex_phs
    free_variables:
    - capex_phs
    determined_variables:
    - phs_cost
    tolerance: 1.0e-09
    unit_check: true
    reference: The fragments' alias register (docs/param_batch7.md and successors), applied
    priority: P2
    solution_method: direct
    linearity: linear
    latex: \mathrm{phs}_{cost} = \mathrm{capex}_{phs}
  ppa_annual_revenue_definition:
    name: PPA annual revenue
    description: 'The annual revenue per kilowatt of contracted capacity. Dimensional check: USD/MWh times
      hours/year times dimensionless / 1000 is USD/kW/year. The 1000 converts kW to MW. The capacity factor
      is the proxy for the plant''s actual output, which the graph does not carry hour by hour.'
    system: ppa_pricing
    lhs: ppa_annual_revenue_usd_per_kw_year
    rhs: ppa_price_usd_per_mwh * capacity_factor * 8760 / 1000
    relation: eq
    parameters:
    - ppa_price_usd_per_mwh
    - capacity_factor
    free_variables:
    - ppa_price_usd_per_mwh
    - capacity_factor
    determined_variables:
    - ppa_annual_revenue_usd_per_kw_year
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  ppa_indexed_price_definition:
    name: PPA indexed price
    description: 'The contract price compounded to the end of the contract. Dimensional check: USD/MWh
      times a dimensionless factor is USD/MWh.'
    system: ppa_pricing
    lhs: ppa_indexed_price_usd_per_mwh
    rhs: ppa_price_usd_per_mwh * (1 + tariff_indexation) ** ppa_duration
    relation: eq
    parameters:
    - ppa_price_usd_per_mwh
    - tariff_indexation
    - ppa_duration
    free_variables:
    - ppa_price_usd_per_mwh
    - tariff_indexation
    - ppa_duration
    determined_variables:
    - ppa_indexed_price_usd_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: nonlinear
    latex: null
  ppa_price_definition:
    name: PPA price
    description: 'Cost plus the risk premium and the sponsor''s return, divided by availability. The price
      a project signs at, which is not its LCOE: the two differ by exactly the risk the offtaker will
      not carry.

      '
    system: ppa_pricing
    lhs: ppa_price_usd_per_mwh
    rhs: (lcoe_usd_per_mwh * (1 + offtake_risk_premium + equity_return_target)) / ppa_availability
    relation: eq
    parameters:
    - ppa_price_usd_per_mwh
    - lcoe_usd_per_mwh
    - offtake_risk_premium
    - equity_return_target
    - ppa_availability
    free_variables: []
    determined_variables:
    - ppa_price_usd_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  premature_deaths_definition:
    name: Premature deaths
    description: 'Exposed population times baseline mortality times the relative risk the particulate
      burden adds. The concentration-response function, linearised.

      '
    system: health
    lhs: premature_deaths_per_year
    rhs: exposed_population * baseline_mortality_rate * pm25_kt_per_year * pm25_relative_risk_per_kt
    relation: eq
    parameters:
    - premature_deaths_per_year
    - exposed_population
    - baseline_mortality_rate
    - pm25_kt_per_year
    - pm25_relative_risk_per_kt
    free_variables: []
    determined_variables:
    - premature_deaths_per_year
    tolerance: 1.0e-09
    unit_check: true
    reference: Linearised concentration-response; cf. WHO AirQ+ methodology
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  property_tax_definition:
    name: Property tax (computed)
    description: 'The rate times its base: property tax is the annual charge on the regulated asset base;
      the investment allowance is the fiscal credit against capital expenditure. Both are rates with no
      arithmetic beyond the product, so the definition is the whole of the coupling.'
    system: financial
    lhs: property_tax
    rhs: property_tax_rate * regulatory_asset_base
    relation: eq
    parameters:
    - property_tax
    - property_tax_rate
    - regulatory_asset_base
    free_variables:
    - property_tax_rate
    determined_variables:
    - property_tax
    tolerance: 1.0e-09
    unit_check: true
    reference: Rate-based levy and allowance definitions (standard fiscal accounting)
    priority: P2
    solution_method: direct
    linearity: linear
    latex: \mathrm{property}_{tax} = \mathrm{property}_{tax\_rate} \mathrm{regulatory}_{asset\_base}
  pyrolysis_cost_alias:
    name: Pyrolysis plant capital cost is Pyrolysis plant capital cost
    description: 'The alias resolution the fragments'' alias register declared and nothing applied: `pyrolysis_cost`
      and `capex_pyrolysis` are two spellings of one quantity. The equality states it in the graph''s
      own idiom, so a reader of either id sees the derivation; the drift that made this alias list exist
      cannot return, because the equation holds at every value set.'
    system: employment
    lhs: pyrolysis_cost
    rhs: capex_pyrolysis
    relation: eq
    parameters:
    - pyrolysis_cost
    - capex_pyrolysis
    free_variables:
    - capex_pyrolysis
    determined_variables:
    - pyrolysis_cost
    tolerance: 1.0e-09
    unit_check: true
    reference: The fragments' alias register (docs/param_batch7.md and successors), applied
    priority: P2
    solution_method: direct
    linearity: linear
    latex: \mathrm{pyrolysis}_{cost} = \mathrm{capex}_{pyrolysis}
  regulatory_asset_base_definition:
    name: Regulated asset base from the fleet
    description: Gross fleet capital less what the books have written down. The gross capital is the capacity-weighted
      capex; the 1000 converts kW-per-MW and the million converts USD. A fraction the regulator's roll-forward
      states, not one the model invents.
    system: financial
    lhs: regulatory_asset_base
    rhs: capex_usd_per_kw * total_capacity_mw * (1 - accumulated_depreciation_fraction) / 1000
    relation: eq
    parameters:
    - regulatory_asset_base
    - capex_usd_per_kw
    - total_capacity_mw
    - accumulated_depreciation_fraction
    free_variables:
    - capex_usd_per_kw
    - total_capacity_mw
    - accumulated_depreciation_fraction
    determined_variables:
    - regulatory_asset_base
    tolerance: 1.0e-09
    unit_check: true
    reference: Ofwat PR24 Appendix 11, allowed return on capital
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{regulatory}_{asset\_base} = \frac{\mathrm{capex}_{usd\_per\_kw} \mathrm{total}_{capacity\_mw}
      \left(1 - \mathrm{accumulated}_{depreciation\_fraction}\right)}{1000}
  regulatory_depreciation_definition:
    name: Regulatory depreciation
    description: Straight-line write-down of the asset base over the regulatory asset life. The rate-of-return
      revenue requirement's first term; the second is the return on the base below.
    system: financial
    lhs: regulatory_depreciation
    rhs: regulatory_asset_base / depreciation_life_by_asset
    relation: eq
    parameters:
    - regulatory_depreciation
    - regulatory_asset_base
    - depreciation_life_by_asset
    free_variables:
    - depreciation_life_by_asset
    determined_variables:
    - regulatory_depreciation
    tolerance: 1.0e-09
    unit_check: true
    reference: Ofwat PR24 Appendix 11, allowed return on capital
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{regulatory}_{depreciation} = \frac{\mathrm{regulatory}_{asset\_base}}{\mathrm{depreciation}_{life\_by\_asset}}
  reliability_cost_definition:
    name: Reliability cost
    description: 'The value of the energy the system fails to serve. A reliability standard is a purchase,
      and this is its price.

      '
    system: reliability
    lhs: reliability_cost_usd
    rhs: unserved_energy_gwh * 1000 * voll_usd_per_mwh
    relation: eq
    parameters:
    - reliability_cost_usd
    - unserved_energy_gwh
    - voll_usd_per_mwh
    free_variables: []
    determined_variables:
    - reliability_cost_usd
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  remaining_life_from_condition_definition:
    name: Remaining useful life from condition
    description: 'A linear approximation of the remaining life: an asset that is end-of-life has zero
      years left, and an asset at peak condition has the full asset life. The graph does not carry a condition-to-life
      curve, and this linear form is the simplest one consistent with the two endpoints. A future batch
      should replace it with the curve the utility''s asset register supports. Dimensional check: years
      times a dimensionless factor is years.'
    system: reliability
    lhs: remaining_useful_life
    rhs: asset_life * asset_condition_index
    relation: eq
    parameters:
    - asset_life
    - asset_condition_index
    free_variables:
    - asset_life
    - asset_condition_index
    determined_variables:
    - remaining_useful_life
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: linear
    latex: null
  reserve_margin:
    name: Reserve margin
    description: 'Firm capacity plus the renewable fleet''s contribution at its capacity factor must cover
      peak demand with the required margin. An inequality, because it bounds a build rather than fixing
      one.

      '
    system: reserve_margin
    lhs: firm_capacity_mw + vre_capacity_mw * capacity_factor
    rhs: peak_demand_mw * (1 + reserve_margin_min)
    relation: geq
    parameters:
    - firm_capacity_mw
    - vre_capacity_mw
    - capacity_factor
    - peak_demand_mw
    - reserve_margin_min
    free_variables: []
    determined_variables: []
    tolerance: 1.0e-06
    unit_check: true
    reference: Standard N-1 planning criterion; cf. ENTSO-E adequacy studies
    priority: P1
    solution_method: direct
    linearity: linear
    latex: null
  reserve_margin_actual_definition:
    name: Actual reserve margin
    description: 'The reserve margin the built fleet delivers: firm capacity plus the firm contribution
      from VRE, less peak demand, over peak demand. Dimensional check: MW over MW is dimensionless. The
      VRE contribution enters at its capacity factor; the same credit the reserve-margin constraint uses,
      so the actual margin and the requirement are on the same basis.'
    system: reserve_margin
    lhs: reserve_margin_actual
    rhs: (firm_capacity_mw + vre_capacity_mw * capacity_factor - peak_demand_mw) / peak_demand_mw
    relation: eq
    parameters:
    - firm_capacity_mw
    - vre_capacity_mw
    - capacity_factor
    - peak_demand_mw
    free_variables:
    - firm_capacity_mw
    - vre_capacity_mw
    - capacity_factor
    - peak_demand_mw
    determined_variables:
    - reserve_margin_actual
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: nonlinear
    latex: null
  reserve_margin_with_firm_vre:
    name: Reserve margin with firm VRE
    description: 'The reserve margin identity with the renewable fleet''s firm contribution made explicit.
      An inequality, because it bounds a build rather than fixing one. Dimensional check: MW plus MW must
      be at least MW times a dimensionless factor.'
    system: reserve_margin
    lhs: firm_capacity_mw + vre_capacity_mw * capacity_factor
    rhs: peak_demand_mw * (1 + reserve_margin_min)
    relation: geq
    parameters:
    - firm_capacity_mw
    - vre_capacity_mw
    - capacity_factor
    - peak_demand_mw
    - reserve_margin_min
    free_variables: []
    determined_variables: []
    tolerance: 1.0e-06
    unit_check: true
    reference: null
    priority: P1
    solution_method: numeric
    linearity: linear
    latex: null
  resettlement_cost_total_definition:
    name: Total resettlement cost
    description: 'The total cost of resettlement, from the population share, the exposed population and
      the per-person cost. Dimensional check: people times dimensionless share times USD/person is USD.'
    system: cost_accounting
    lhs: resettlement_costs_total_usd
    rhs: exposed_population * resettlement_population_share * resettlement_cost_per_person
    relation: eq
    parameters:
    - resettlement_costs_total_usd
    - exposed_population
    - resettlement_population_share
    - resettlement_cost_per_person
    free_variables:
    - exposed_population
    - resettlement_population_share
    - resettlement_cost_per_person
    determined_variables:
    - resettlement_costs_total_usd
    tolerance: 1.0e-06
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  residential_demand_definition:
    name: Residential demand
    description: 'The share times the demand it is a share OF. A share with no numerator is a word; with
      the total demand as its base it is a quantity the metering checks the synthesis against. Units:
      a dimensionless share times TWh is TWh.'
    system: demand_supply
    lhs: residential_demand_twh
    rhs: residential_demand_share * base_demand_twh
    relation: eq
    parameters:
    - residential_demand_twh
    - residential_demand_share
    - base_demand_twh
    free_variables:
    - residential_demand_share
    - base_demand_twh
    determined_variables:
    - residential_demand_twh
    tolerance: 1.0e-09
    unit_check: true
    reference: Bottom-up load synthesis (catalog method cell)
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{residential}_{demand\_twh} = \mathrm{residential}_{demand\_share} \mathrm{base}_{demand\_twh}
  retention_and_deductible_bound:
    name: Retention and deductible shares sum to at most one
    description: A risk-retention share and a deductible share are both fractions of the same insured
      loss kept by the insured party, so together they cannot exceed the whole loss. A ceiling because
      a policy may leave a layer to the insurer between the two.
    system: financial
    lhs: retention_share + deductible_share
    rhs: '1.0'
    relation: leq
    parameters:
    - retention_share
    - deductible_share
    free_variables: []
    determined_variables: []
    tolerance: 1.0e-06
    unit_check: true
    reference: null
    priority: P2
    solution_method: numeric
    linearity: linear
    latex: \mathrm{retention}_{share} + \mathrm{deductible}_{share} \leq 1
  rocof_definition:
    name: Rate of change of frequency
    description: 'The swing equation''s first instant: the largest credible loss divided by twice the
      stored kinetic energy. Bounds the instantaneous renewable share, because inverters store no kinetic
      energy.

      '
    system: inertia
    lhs: rocof_df_dt_hz_per_s
    rhs: largest_loss_mw / (2 * system_inertia_mws)
    relation: eq
    parameters:
    - rocof_df_dt_hz_per_s
    - largest_loss_mw
    - system_inertia_mws
    free_variables: []
    determined_variables:
    - rocof_df_dt_hz_per_s
    tolerance: 1.0e-09
    unit_check: true
    reference: Swing equation at t=0, df/dt = -P_loss / (2 H S)
    priority: P1
    solution_method: direct
    linearity: linear
    latex: null
  saidi_definition:
    name: SAIDI
    description: 'Outage duration times the frequency, against 8760 hours. Dimensional check: hours/event
      times events/year is hours/year. Uses forced and planned outage rates, which is the graph''s only
      evidence about interruption.'
    system: reliability
    lhs: system_saidi_hours_per_year
    rhs: outage_duration * outage_frequency
    relation: eq
    parameters:
    - outage_duration
    - outage_frequency
    free_variables:
    - outage_duration
    - outage_frequency
    determined_variables:
    - system_saidi_hours_per_year
    tolerance: 1.0e-09
    unit_check: true
    reference: IEEE Std 1366 (distribution reliability)
    priority: P1
    solution_method: direct
    linearity: linear
    latex: null
  saifi_definition:
    name: SAIFI
    description: 'Interruption frequency, normalised to the customer base. Dimensional check: events/year.
      The graph carries no customer count, so the frequency is used directly; a per-customer version needs
      the customer count as a parameter, which the graph does not hold.'
    system: reliability
    lhs: system_saifi_events_per_year
    rhs: outage_frequency
    relation: eq
    parameters:
    - outage_frequency
    free_variables:
    - outage_frequency
    determined_variables:
    - system_saifi_events_per_year
    tolerance: 1.0e-09
    unit_check: true
    reference: IEEE Std 1366 (distribution reliability)
    priority: P1
    solution_method: direct
    linearity: linear
    latex: null
  salinity_gradient_cost_alias:
    name: Salinity gradient capital cost is Salinity gradient capital cost
    description: 'The alias resolution the fragments'' alias register declared and nothing applied: `salinity_gradient_cost`
      and `capex_salinity_gradient` are two spellings of one quantity. The equality states it in the graph''s
      own idiom, so a reader of either id sees the derivation; the drift that made this alias list exist
