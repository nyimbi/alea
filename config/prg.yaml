  wacc_alias:
    name: WACC is the discount rate
    description: The catalog's WACC row and the financial block's discount rate are one quantity, so the
      duplicate derives from the computed one and the graph keeps a single blend. An equality between
      two ids for one number is the closure that keeps a scenario setting either name consistent; the
      alternative -- deprecating the id -- loses the label a report may cite.
    system: financial
    lhs: weighted_average_cost_of_capital
    rhs: discount_rate
    relation: eq
    parameters:
    - weighted_average_cost_of_capital
    - discount_rate
    free_variables:
    - discount_rate
    determined_variables:
    - weighted_average_cost_of_capital
    tolerance: 1.0e-09
    unit_check: true
    reference: Standard WACC with the interest tax shield
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{weighted}_{average\_cost\_of\_capital} = \mathrm{discount}_{rate}
  wacc_definition:
    name: Weighted average cost of capital
    description: 'The blend of debt and equity, with interest shielded by tax. This is why the discount
      rate is derived: the blend and the rate are one quantity.

      '
    system: financial
    lhs: discount_rate
    rhs: debt_fraction * cost_of_debt * (1 - tax_rate) + (1 - debt_fraction) * cost_of_equity
    relation: eq
    parameters:
    - discount_rate
    - debt_fraction
    - cost_of_debt
    - tax_rate
    - cost_of_equity
    free_variables: []
    determined_variables:
    - discount_rate
    tolerance: 1.0e-09
    unit_check: true
    reference: Standard WACC with the interest tax shield
    priority: P1
    solution_method: direct
    linearity: linear
    latex: null
