  gearing_ratio:
    name: Gearing ratio
    description: 'Debt as a multiple of equity, the complement of the debt fraction. Determined by gearing_ratio_definition.
      The description here previously read "debt as a fraction of total capitalisation", which is the
      debt fraction and not the gearing ratio -- the two differ by the factor 1/(1 - debt_fraction), so
      a scenario reading one for the other was out by 3.3x at the default. The range was corrected for
      the same reason and is the larger half of the same error: it read [0, 0.95], which is `debt_fraction`''s
      bound and not this node''s. A multiple of equity is unbounded above as the debt fraction approaches
      1, and over the driver''s own range [0, 0.95] the image is [0, 19]. At the default debt_fraction
      = 0.7 the ratio is 2.3333, which the old range refused -- the node was declared out of range at
      its own default. The bound is the image of `debt_fraction`''s range under the definition, so it
      is derived rather than chosen; if that range moves, this one moves with it.'
    category: Investment & Finance
    subcategory: null
    type: float
    unit: '1'
    range:
    - 0.0
    - 19.0
    initial: null
    role: derived
    determinism: fixed
    categories: []
    source: docs/params.md#9.24
    source_url: null
    users:
    - Investors
    priority: P1
    status: to_build
    deprecated_by: null
