    description: 'The share of the fleet''s gross capital the books have already depreciated, which is
      what stands between gross fleet capital and the net regulated asset base. 0.6 on the shipped fleet:
      a fleet whose assets are, on average, more than ten years into a 25-year life. Book-specific; the
      range admits a book that has not depreciated at all.'
