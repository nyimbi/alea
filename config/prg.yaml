    unit_check: true
    reference: The fragments' alias register (docs/param_batch7.md and successors), applied
    priority: P2
    solution_method: direct
    linearity: linear
    latex: \mathrm{hydrogen}_{fuel\_cell\_cost} = \mathrm{capex}_{hydrogen\_fuel\_cell}
  hydrogen_price_per_mwh_definition:
    name: hydrogen price per mwh (computed)
    description: 'Hydrogen''s lower heating value is 33.33 kWh per kg (0.03333 MWh/kg); the delivered
      price divides by it. The conversion is dimensional: a price over an energy basis scales by the unit''s
      own MWh content.'
    system: cost_accounting
    lhs: hydrogen_price_per_mwh
    rhs: hydrogen_price / mwh_per_hydrogen_unit
    relation: eq
    parameters:
    - hydrogen_price_per_mwh
    - hydrogen_price
    - mwh_per_hydrogen_unit
    free_variables:
    - hydrogen_price
    - mwh_per_hydrogen_unit
    determined_variables:
    - hydrogen_price_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    reference: 'LHV of H2: 33.33 kWh/kg (standard fuel tables)'
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{hydrogen}_{price\_per\_mwh} = \frac{\mathrm{hydrogen}_{price}}{\mathrm{mwh}_{per\_hydrogen\_unit}}
  hydrogen_water_definition:
    name: Hydrogen water demand
    description: Water the hydrogen programme consumes over the year.
    system: water_energy
    lhs: hydrogen_water_demand_m3
    rhs: hydrogen_production_kt_per_year * 1000000 * hydrogen_water_m3_per_kg
    relation: eq
    parameters:
    - hydrogen_water_demand_m3
    - hydrogen_production_kt_per_year
    - hydrogen_water_m3_per_kg
    free_variables: []
    determined_variables:
    - hydrogen_water_demand_m3
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: null
  indirect_jobs_derivation:
    name: Indirect jobs (derived)
    description: 'The multiplier form of the input-output employment method: direct jobs computed by the
      kernel''s own definition, times the supply-chain or consumption multiplier the method states.'
    system: employment
    lhs: indirect_jobs
    rhs: direct_jobs * indirect_employment_multiplier
    relation: eq
    parameters:
    - indirect_jobs
    - direct_jobs
    - indirect_employment_multiplier
    free_variables:
    - indirect_employment_multiplier
    determined_variables:
    - indirect_jobs
    tolerance: 1.0e-09
    unit_check: true
    reference: Leontief input-output employment multipliers
    priority: P2
    solution_method: direct
    linearity: linear
    latex: \mathrm{indirect}_{jobs} = \mathrm{direct}_{jobs} \mathrm{indirect}_{employment\_multiplier}
  induced_jobs_derivation:
    name: Induced jobs (derived)
    description: 'The multiplier form of the input-output employment method: direct jobs computed by the
      kernel''s own definition, times the supply-chain or consumption multiplier the method states.'
    system: employment
    lhs: induced_jobs
    rhs: direct_jobs * induced_employment_multiplier
    relation: eq
    parameters:
    - induced_jobs
    - direct_jobs
    - induced_employment_multiplier
    free_variables:
    - induced_employment_multiplier
    determined_variables:
    - induced_jobs
    tolerance: 1.0e-09
    unit_check: true
    reference: Leontief input-output employment multipliers
    priority: P2
    solution_method: direct
    linearity: linear
    latex: \mathrm{induced}_{jobs} = \mathrm{direct}_{jobs} \mathrm{induced}_{employment\_multiplier}
  industrial_demand_definition:
    name: Industrial demand
    description: 'The share times the demand it is a share OF. A share with no numerator is a word; with
      the total demand as its base it is a quantity the metering checks the synthesis against. Units:
      a dimensionless share times TWh is TWh.'
    system: demand_supply
    lhs: industrial_demand_twh
    rhs: industrial_demand_share * base_demand_twh
    relation: eq
    parameters:
    - industrial_demand_twh
    - industrial_demand_share
    - base_demand_twh
    free_variables:
    - industrial_demand_share
    - base_demand_twh
    determined_variables:
    - industrial_demand_twh
    tolerance: 1.0e-09
    unit_check: true
    reference: Bottom-up load synthesis (catalog method cell)
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{industrial}_{demand\_twh} = \mathrm{industrial}_{demand\_share} \mathrm{base}_{demand\_twh}
  industrial_electrification_bound:
    name: Industrial electrification and heat electrification are bounded together
    description: Direct electrification and heat electrification are two routes to the same decarbonised
      industrial load, and a scenario that took both to their maximum would electrify more of industry
      than industry has. Bounded at 1.5 rather than 1.0 because the two measures overlap partially --
      a process counted in both is electrified once -- so the sum is allowed above unity and not without
      limit.
    system: demand_supply
    lhs: industrial_electrification + industrial_heat_electrification
    rhs: '1.5'
    relation: leq
    parameters:
    - industrial_electrification
    - industrial_heat_electrification
    free_variables: []
    determined_variables: []
    tolerance: 1.0e-06
    unit_check: true
    reference: null
    priority: P2
    solution_method: numeric
    linearity: linear
    latex: \mathrm{industrial}_{electrification} + \mathrm{industrial}_{heat\_electrification} \leq 1.5
  inertia_from_capacity_definition:
    name: System inertia from capacity
    description: 'The fleet''s stored kinetic energy: firm capacity times the inertia constant. Dimensional
      check: MW times seconds is MW·s. The inertia constant H is the ratio of stored energy to rated power;
      the graph carries the fleet-level weighted average, not a per-technology value, which is a stated
      simplification.'
    system: inertia
    lhs: system_inertia_mws
    rhs: firm_capacity_mw * inertia_constant_s
    relation: eq
    parameters:
    - firm_capacity_mw
    - inertia_constant_s
    free_variables:
    - firm_capacity_mw
    - inertia_constant_s
    determined_variables:
    - system_inertia_mws
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: linear
    latex: null
  inertia_requirement:
    name: RoCoF limit
    description: The frequency slope the protection settings tolerate before tripping.
    system: inertia
    lhs: rocof_limit_hz_per_s
    rhs: rocof_df_dt_hz_per_s
    relation: geq
    parameters:
    - rocof_limit_hz_per_s
    - rocof_df_dt_hz_per_s
    free_variables: []
    determined_variables: []
    tolerance: 1.0e-06
    unit_check: true
    reference: null
    priority: P1
    solution_method: numeric
    linearity: linear
    latex: null
  insurance_combined_ratio_definition:
    name: Combined ratio from the loss and expense ratios
    description: The combined ratio is the loss ratio plus the expense ratio. This replaces the equation
      dropped from param_batch5, which stated the same identity over `premium_share_of_asset` -- premiums
      over assets, not expenses over premiums. Both terms here are shares of premiums, so the sum is the
      share of premiums paid out in claims and underwriting.
    system: financial
    lhs: combined_ratio
    rhs: loss_ratio + expense_ratio
    relation: eq
    parameters:
    - loss_ratio
    - expense_ratio
    free_variables: []
    determined_variables:
    - combined_ratio
    tolerance: 1.0e-06
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: linear
    latex: \mathrm{combined}_{ratio} = \mathrm{loss}_{ratio} + \mathrm{expense}_{ratio}
  investment_allowance_definition:
    name: Investment allowance (computed)
    description: 'The rate times its base: property tax is the annual charge on the regulated asset base;
      the investment allowance is the fiscal credit against capital expenditure. Both are rates with no
      arithmetic beyond the product, so the definition is the whole of the coupling.'
    system: financial
    lhs: investment_allowance
    rhs: investment_allowance_rate * capex_usd_per_kw
    relation: eq
    parameters:
    - investment_allowance
    - investment_allowance_rate
    - capex_usd_per_kw
    free_variables:
    - investment_allowance_rate
    determined_variables:
    - investment_allowance
    tolerance: 1.0e-09
    unit_check: true
    reference: Rate-based levy and allowance definitions (standard fiscal accounting)
    priority: P2
    solution_method: direct
    linearity: linear
    latex: \mathrm{investment}_{allowance} = \mathrm{investment}_{allowance\_rate} \mathrm{capex}_{usd\_per\_kw}
  landfill_gas_cost_alias:
    name: Landfill gas plant capital cost is Landfill gas plant capital cost
    description: 'The alias resolution the fragments'' alias register declared and nothing applied: `landfill_gas_cost`
      and `capex_landfill_gas` are two spellings of one quantity. The equality states it in the graph''s
      own idiom, so a reader of either id sees the derivation; the drift that made this alias list exist
      cannot return, because the equation holds at every value set.'
    system: employment
    lhs: landfill_gas_cost
    rhs: capex_landfill_gas
    relation: eq
    parameters:
    - landfill_gas_cost
    - capex_landfill_gas
    free_variables:
    - capex_landfill_gas
    determined_variables:
    - landfill_gas_cost
    tolerance: 1.0e-09
    unit_check: true
    reference: The fragments' alias register (docs/param_batch7.md and successors), applied
    priority: P2
    solution_method: direct
    linearity: linear
    latex: \mathrm{landfill}_{gas\_cost} = \mathrm{capex}_{landfill\_gas}
  lcoe_battery_definition:
    name: Levelised cost of storage
    description: 'The LCOS form: the capital cost per delivered kilowatt-hour over the battery''s daily
      cycle count, annualised by the financial block''s CRF, discounted by the round-trip efficiency,
      plus the variable O&M the per-cycle wear prices. The charging cost is deliberately absent: the price
      of the electricity the battery buys is the system''s own economics and not the asset''s.'
    system: cost_accounting
    lhs: lcoe_battery_usd_per_kwh
    rhs: crf * capex_battery / (365 * battery_cycles_per_day * battery_round_trip_efficiency) + opex_variable_battery
      / 1000
    relation: eq
    parameters:
    - lcoe_battery_usd_per_kwh
    - crf
    - capex_battery
    - battery_cycles_per_day
    - battery_round_trip_efficiency
    - opex_variable_battery
    free_variables:
    - capex_battery
    - battery_cycles_per_day
    - battery_round_trip_efficiency
    - opex_variable_battery
    determined_variables:
    - lcoe_battery_usd_per_kwh
    tolerance: 1.0e-09
    unit_check: true
    reference: NREL ATB 2025 battery equations; Lazard LCOS
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{lcoe}_{battery\_usd\_per\_kwh} = \frac{\mathrm{crf} \mathrm{capex}_{battery}}{365 \mathrm{battery}_{cycles\_per\_day}
      \mathrm{battery}_{round\_trip\_efficiency}} + \frac{\mathrm{opex}_{variable\_battery}}{1000}
  lcoe_biomass_definition:
    name: LCOE (biomass)
    description: 'Biomass levelised cost in the fixed-charge-annuity form the field standardises on: the
      annualised capital charge over the energy the plant actually produces, plus fixed and variable O&M,
      the fuel the fleet''s heat rate prices, and the stack''s carbon at carbon_price. Dimensional check:
      a USD/kW/year rate over an hours/year denominator with a dimensionless capacity factor is USD/MWh,
      and every per-MWh term shares it.'
    system: cost_accounting
    lhs: lcoe_biomass_usd_per_mwh
    rhs: (capex_biomass * crf_biomass + opex_fixed_biomass) * 1000 / (8760 * capacity_factor_biomass)
      + opex_variable_biomass + fuel_cost_biomass + emission_factor_biomass_t_per_mwh * carbon_price_usd_per_tco2
    relation: eq
    parameters:
    - lcoe_biomass_usd_per_mwh
    - capex_biomass
    - opex_fixed_biomass
    - capacity_factor_biomass
    - opex_variable_biomass
    - fuel_cost_biomass
    - emission_factor_biomass_t_per_mwh
    - carbon_price_usd_per_tco2
    - crf_biomass
    free_variables:
    - capex_biomass
    - opex_fixed_biomass
    - capacity_factor_biomass
    - opex_variable_biomass
    - fuel_cost_biomass
    - emission_factor_biomass_t_per_mwh
    - carbon_price_usd_per_tco2
    - crf_biomass
    determined_variables:
    - lcoe_biomass_usd_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    reference: NREL ATB 2025 Equations & Variables; Short, Packey & Holt (1995), NREL/TP-462-5173; EIA
      AEO LCOE methodology
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{lcoe}_{biomass\_usd\_per\_mwh} = \frac{1000 \left(\mathrm{capex}_{biomass} \mathrm{crf}_{biomass}
      + \mathrm{opex}_{fixed\_biomass}\right)}{8760 \mathrm{capacity}_{factor\_biomass}} + \mathrm{opex}_{variable\_biomass}
      + \mathrm{fuel}_{cost\_biomass} + \mathrm{emission}_{factor\_biomass\_t\_per\_mwh} \mathrm{carbon}_{price\_usd\_per\_tco2}
  lcoe_coal_definition:
    name: LCOE (coal)
    description: 'Coal levelised cost in the fixed-charge-annuity form the field standardises on: the
      annualised capital charge over the energy the plant actually produces, plus fixed and variable O&M,
      the fuel the fleet''s heat rate prices, and the stack''s carbon at carbon_price. Dimensional check:
      a USD/kW/year rate over an hours/year denominator with a dimensionless capacity factor is USD/MWh,
      and every per-MWh term shares it.'
    system: cost_accounting
    lhs: lcoe_coal_usd_per_mwh
    rhs: (capex_coal * crf_coal + opex_fixed_coal) * 1000 / (8760 * capacity_factor_coal) + opex_variable_coal
      + fuel_cost_coal + emission_factor_coal_t_per_mwh * carbon_price_usd_per_tco2
    relation: eq
    parameters:
    - lcoe_coal_usd_per_mwh
    - capex_coal
    - opex_fixed_coal
    - capacity_factor_coal
    - opex_variable_coal
    - fuel_cost_coal
    - emission_factor_coal_t_per_mwh
    - carbon_price_usd_per_tco2
    - crf_coal
    free_variables:
    - capex_coal
    - opex_fixed_coal
    - capacity_factor_coal
    - opex_variable_coal
    - fuel_cost_coal
    - emission_factor_coal_t_per_mwh
    - carbon_price_usd_per_tco2
    - crf_coal
    determined_variables:
    - lcoe_coal_usd_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    reference: NREL ATB 2025 Equations & Variables; Short, Packey & Holt (1995), NREL/TP-462-5173; EIA
      AEO LCOE methodology
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{lcoe}_{coal\_usd\_per\_mwh} = \frac{1000 \left(\mathrm{capex}_{coal} \mathrm{crf}_{coal}
      + \mathrm{opex}_{fixed\_coal}\right)}{8760 \mathrm{capacity}_{factor\_coal}} + \mathrm{opex}_{variable\_coal}
      + \mathrm{fuel}_{cost\_coal} + \mathrm{emission}_{factor\_coal\_t\_per\_mwh} \mathrm{carbon}_{price\_usd\_per\_tco2}
  lcoe_csp_definition:
    name: LCOE (csp)
    description: 'Csp levelised cost in the fixed-charge-annuity form the field standardises on: the annualised
      capital charge over the energy the plant actually produces, plus fixed and variable O&M, the fuel
      the fleet''s heat rate prices, and the stack''s carbon at carbon_price. Dimensional check: a USD/kW/year
      rate over an hours/year denominator with a dimensionless capacity factor is USD/MWh, and every per-MWh
      term shares it.'
    system: cost_accounting
    lhs: lcoe_csp_usd_per_mwh
    rhs: (capex_csp * crf_csp + opex_fixed_csp) * 1000 / (8760 * capacity_factor_csp) + opex_variable_csp
    relation: eq
    parameters:
    - lcoe_csp_usd_per_mwh
    - capex_csp
    - opex_fixed_csp
    - capacity_factor_csp
    - opex_variable_csp
    - crf_csp
    free_variables:
    - capex_csp
    - opex_fixed_csp
    - capacity_factor_csp
    - opex_variable_csp
    - crf_csp
    determined_variables:
    - lcoe_csp_usd_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    reference: NREL ATB 2025 Equations & Variables; Short, Packey & Holt (1995), NREL/TP-462-5173; EIA
      AEO LCOE methodology
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{lcoe}_{csp\_usd\_per\_mwh} = \frac{1000 \left(\mathrm{capex}_{csp} \mathrm{crf}_{csp}
      + \mathrm{opex}_{fixed\_csp}\right)}{8760 \mathrm{capacity}_{factor\_csp}} + \mathrm{opex}_{variable\_csp}
  lcoe_definition:
    name: Levelised cost
    description: 'Levelised cost: the annualised capital charge spread over the energy the asset actually
      produces, plus marginal cost. The 1000 and 8760 convert kW to MW and hours to a year, and they are
      written here rather than folded into a constant so a reader can check the units.

      '
    system: cost_accounting
    lhs: lcoe_usd_per_mwh
    rhs: annualised_capex_usd_per_kw * 1000 / (8760 * capacity_factor) + marginal_cost_usd_per_mwh
    relation: eq
    parameters:
    - lcoe_usd_per_mwh
    - annualised_capex_usd_per_kw
    - capacity_factor
    - marginal_cost_usd_per_mwh
    free_variables: []
    determined_variables:
    - lcoe_usd_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    reference: IEA/NEA, Projected Costs of Generating Electricity
    priority: P1
    solution_method: direct
    linearity: linear
    latex: null
  lcoe_gas_definition:
    name: LCOE (gas)
    description: 'Gas levelised cost in the fixed-charge-annuity form the field standardises on: the annualised
      capital charge over the energy the plant actually produces, plus fixed and variable O&M, the fuel
      the fleet''s heat rate prices, and the stack''s carbon at carbon_price. Dimensional check: a USD/kW/year
      rate over an hours/year denominator with a dimensionless capacity factor is USD/MWh, and every per-MWh
      term shares it.'
    system: cost_accounting
    lhs: lcoe_gas_usd_per_mwh
    rhs: (capex_gas * crf_gas + opex_fixed_gas) * 1000 / (8760 * capacity_factor_gas) + opex_variable_gas
      + fuel_cost_gas + emission_factor_gas_t_per_mwh * carbon_price_usd_per_tco2
    relation: eq
    parameters:
    - lcoe_gas_usd_per_mwh
    - capex_gas
    - opex_fixed_gas
    - capacity_factor_gas
    - opex_variable_gas
    - fuel_cost_gas
    - emission_factor_gas_t_per_mwh
    - carbon_price_usd_per_tco2
    - crf_gas
    free_variables:
    - capex_gas
    - opex_fixed_gas
    - capacity_factor_gas
    - opex_variable_gas
    - fuel_cost_gas
    - emission_factor_gas_t_per_mwh
    - carbon_price_usd_per_tco2
    - crf_gas
    determined_variables:
    - lcoe_gas_usd_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    reference: NREL ATB 2025 Equations & Variables; Short, Packey & Holt (1995), NREL/TP-462-5173; EIA
      AEO LCOE methodology
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{lcoe}_{gas\_usd\_per\_mwh} = \frac{1000 \left(\mathrm{capex}_{gas} \mathrm{crf}_{gas}
      + \mathrm{opex}_{fixed\_gas}\right)}{8760 \mathrm{capacity}_{factor\_gas}} + \mathrm{opex}_{variable\_gas}
      + \mathrm{fuel}_{cost\_gas} + \mathrm{emission}_{factor\_gas\_t\_per\_mwh} \mathrm{carbon}_{price\_usd\_per\_tco2}
