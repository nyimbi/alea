  solar_pv_cost_alias:
    name: Solar PV capital cost (legacy) is Solar PV capital cost
    description: 'The alias resolution the fragments'' alias register declared and nothing applied: `solar_pv_cost`
      and `capex_solar_pv` are two spellings of one quantity. The equality states it in the graph''s own
      idiom, so a reader of either id sees the derivation; the drift that made this alias list exist cannot
