    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: linear
    latex: null
  energy_demand:
    name: Demand at the horizon
    description: 'Base-year demand compounded to the horizon year. A growth rate with no base and a base
      with no growth rate are the same document twice.

      '
    system: energy_balance
    lhs: demand_twh
    rhs: base_demand_twh * (1 + demand_growth) ** horizon_years
    relation: eq
