    latex: null
  demand_growth_implied_definition:
    name: Implied demand growth
    description: 'The elasticity''s own implication: demand grows with income at the income elasticity,
      in the log-linear form the growth literature uses. A dimensionless base to a dimensionless power
      is dimensionless; the 1/year unit is the growth rate''s own.'
    system: demand_supply
    lhs: demand_growth_implied
    rhs: income_elasticity * gdp_growth
    relation: eq
    parameters:
    - demand_growth_implied
    - gdp_growth
    - income_elasticity
    free_variables:
    - gdp_growth
    - income_elasticity
    determined_variables:
    - demand_growth_implied
    tolerance: 1.0e-09
    unit_check: true
    reference: Burke & Csereklyei 2016; EIA/Stanford EMF demand elasticities; Hou & Tan 2008; 单葆国 2017
    priority: P1
    solution_method: numeric
    linearity: nonlinear
    latex: \mathrm{demand}_{growth\_implied} = \mathrm{income}_{elasticity} \mathrm{gdp}_{growth}
  demand_shares_bound:
    name: Sector demand shares sum to at most one
    description: 'The four sector shares are a decomposition of total demand, so they cannot sum above
      one: a set summing higher describes more demand than the total it is a decomposition of. A ceiling
      rather than an equality, because a scenario may leave a residual unallocated -- the shares need
      not exhaust the total.'
    system: demand_supply
    lhs: residential_demand_share + commercial_demand_share + industrial_demand_share + agricultural_demand_share
    rhs: '1.0'
    relation: leq
    parameters:
    - residential_demand_share
    - commercial_demand_share
    - industrial_demand_share
    - agricultural_demand_share
    free_variables: []
    determined_variables: []
    tolerance: 1.0e-06
    unit_check: true
    reference: null
