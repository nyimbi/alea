  fuel_diversity_definition:
    name: Fuel diversity index
    description: 'One minus the Herfindahl-Hirschman Index over the fleet''s fuel capacities, expressed
      as a fraction. Dimensional check: MW squared over MW squared is dimensionless, and one minus it
      is dimensionless. Seven fuels are named explicitly; a technology the graph carries but does not
      list here (marine, hydrogen fuel cell, SMR) is excluded from the sum and the index overstates diversity
      by its own omission — a finding rather than a mathematical error. The denominator is the SUM OF
      THE SEVEN, not `total_capacity_mw`: an HHI divides by the total of the shares it is taken over,
      and the two totals are different parameters that are free to disagree. At the shipped defaults the
      seven sum to 63000 MW while `total_capacity_mw` is 10000 MW, so dividing by the latter gave 1 -
      8.39 = -7.39, outside the index''s own [0, 1]. Dividing by the seven''s own total makes the sum
      of the shares exactly 1 by construction, so Cauchy-Schwarz bounds the index in [0, 1] for every
      value set — the range is then a property of the formula, not a coincidence of the defaults.'
    system: demand_supply
    lhs: fuel_diversity_index
    rhs: 1 - (coal_capacity ** 2 + gas_capacity ** 2 + oil_capacity ** 2 + nuclear_capacity ** 2 + hydro_capacity
      ** 2 + solar_pv_capacity ** 2 + wind_onshore_capacity ** 2) / ((coal_capacity + gas_capacity + oil_capacity
      + nuclear_capacity + hydro_capacity + solar_pv_capacity + wind_onshore_capacity) ** 2)
    relation: eq
    parameters:
    - coal_capacity
    - gas_capacity
    - oil_capacity
    - nuclear_capacity
    - hydro_capacity
    - solar_pv_capacity
    - wind_onshore_capacity
    free_variables:
    - coal_capacity
    - gas_capacity
    - oil_capacity
    - nuclear_capacity
    - hydro_capacity
    - solar_pv_capacity
    - wind_onshore_capacity
    determined_variables:
    - fuel_diversity_index
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P2
    solution_method: direct
    linearity: nonlinear
    latex: null
