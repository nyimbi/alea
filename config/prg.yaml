  locally_sourced_jobs_definition:
    name: Local employment target applied
    description: 'The composition share applied to the direct jobs: jobs by group equal the share times
      the count the equation is a member of. Nothing deeper -- the share''s whole content is who the jobs
      go to.'
    system: employment
    lhs: locally_sourced_jobs
    rhs: direct_jobs * local_employment_share
    relation: eq
    parameters:
