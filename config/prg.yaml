cross_validation:
- id: carbon_price_budget_alignment
  condition: carbon_price_usd_per_tco2 > 150 and carbon_budget_ratio > 1.0
  severity: warning
  message: A carbon price above 150 USD/t with emissions over the declared budget means the price is not
    doing the work the budget assumes
  suggestion: Raise carbon_budget_mtco2, or check that the price reaches the sectors the budget covers
- id: reserve_margin_vre_penetration
  condition: reserve_margin_min < 0.10 and vre_capacity_target_mw > 20000
  severity: error
  message: A reserve margin floor below 10% with a 20 GW-plus VRE target is a system with no firm capacity
    to fall back on
  suggestion: Raise reserve_margin_min, or lower vre_capacity_target_mw and add firm capacity
- id: financing_terms_conflict
  condition: dscr_min > 2.0 and equity_return_target > 0.15
  severity: warning
  message: A debt coverage floor above 2.0 together with an equity return above 15% is a capital structure
    no offtake price is likely to carry
  suggestion: Lower dscr_min or equity_return_target, or accept a higher ppa_price_usd_per_mwh
- id: elastic_demand_growth
  condition: price_elasticity < -1.5 and demand_growth > 0.10
  severity: info
  message: 'Fast demand growth against highly elastic demand: the tariff path moves the load as much as
    the growth assumption does'
  suggestion: Check the demand projection is not double-counting the tariff response
- id: escalated_carbon_price_budget_consistency
  condition: carbon_price_escalated_usd_per_tco2 > 500 and carbon_budget_ratio > 1.5
  severity: warning
  message: A carbon price that escalates above 500 USD/t while the trajectory still misses its budget
    by more than half means the coverage, not the price, is the binding gap
  suggestion: Raise carbon_price_coverage, or check that the price reaches the sectors the budget covers
- id: fuel_price_escalation_inversion
  condition: fuel_price_escalation > 0.05 and carbon_price_escalation > 0.10
  severity: warning
  message: Fuels escalating at 5% a year against a carbon price escalating at 10% is a trajectory that
    prices carbon and reopens coal at the same time, unless the coverage differs
  suggestion: Reconcile the two escalations, or record the coverage difference
- id: llcr_dscr_inconsistency
  condition: llcr_estimate < dscr_min and debt_tenor > 10
  severity: error
  message: A loan life coverage ratio below the DSCR floor over a loan life longer than a decade is a
    financing no lender will sign
  suggestion: Lower debt_tenor, raise the tariff, or accept the DSCR floor
- id: equity_return_below_target
  condition: equity_irr_estimate < equity_return_target
  severity: warning
  message: The equity return the tariff delivers is below the sponsor's stated target, which is a build
    programme that stalls
  suggestion: Raise ppa_price_usd_per_mwh, or check that equity_return_target is the number the sponsor
    actually requires
- id: water_balance_overdrawn
  condition: water_availability_m3 > 0 and total_water_demand_m3 > water_availability_m3
  severity: error
  message: Cooling and hydrogen together draw more water than the catchment makes available, which is
    a build the hydrology cannot support
  suggestion: Reduce the hydrogen programme, or add desalination capacity
- id: carbon_revenue_exceeds_cost
  condition: carbon_revenue_usd_per_year > 10000000000 and carbon_price_coverage < 0.25
  severity: info
  message: A carbon price raising more than 10 billion USD a year on under a quarter of emissions is a
    coverage the policy dial does not yet match
  suggestion: Check that the covered set is the intended one
- id: saidi_below_target_but_poor_reliability
  condition: system_saidi_hours_per_year < 10 and forced_outage_rate > 0.15
  severity: warning
  message: A SAIDI below 10 hours a year with a forced outage rate above 15% means the outage duration
    assumption is doing the work the outage rate should
  suggestion: Reconcile outage_duration with forced_outage_rate
- id: consumer_surplus_large_negative
  condition: consumer_surplus_usd_per_year < -1000000000 and regulated_tariff_usd_per_mwh > reference_tariff_usd_per_mwh
  severity: info
  message: The tariff exceeds the reference, and the surplus triangle is negative — which is a cost-recovery
    tariff that is above the level at which the load was surveyed
  suggestion: Verify reference_tariff_usd_per_mwh, or accept the surplus transfer as the policy
- id: jobs_multiplier_out_of_range
  condition: indirect_jobs_multiplier > 3.0 or induced_jobs_multiplier > 2.0
  severity: warning
  message: A jobs multiplier above 3 (indirect) or 2 (induced) is outside the range most input-output
    studies report for energy infrastructure
  suggestion: Use the study's value, or record that this is a national-accounts coefficient rather than
    a rule of thumb
- id: learning_rates_out_of_range
  condition: solar_pv_learning_rate > 0.35 or battery_learning_rate > 0.35 or electrolyser_learning_rate
    > 0.35
  severity: warning
  message: A learning rate above 35% per doubling is outside the range the empirical literature reports
    for any energy technology
  suggestion: Use a rate from the empirical range, or record that this is a deliberately aggressive scenario
- id: lcoe_reference_sanity
  condition: lcoe_usd_per_mwh < 10 or lcoe_usd_per_mwh > 500
  severity: warning
  message: The reference-technology LCOE is outside the range any 2020s technology exhibits. Either the
    capex is wrong, the capacity factor is wrong, or the discount rate is wrong.
  suggestion: Check capex_usd_per_kw, capacity_factor and discount_rate against their own ranges
- id: fuel_cost_escalation_overtakes_carbon
  condition: fuel_price_escalation > carbon_price_escalation and carbon_price_usd_per_tco2 > 0
  severity: info
  message: A fuel price rising faster than the carbon price is a scenario in which the carbon policy is
    losing ground to the fuel market. Worth recording, not necessarily worth changing.
  suggestion: Confirm the escalation pair is the intended scenario
- id: delivered_fuel_below_commodity
  condition: fuel_cost_coal < coal_price_per_mwh and coal_price > 0
  severity: warning
  message: The delivered coal cost is below the commodity-derived thermal cost, which would require the
    transport to be free or negative
  suggestion: Reconcile the two parameters, or check the calorific value used
- id: delivered_gas_below_commodity
  condition: fuel_cost_gas < gas_price_per_mwh and gas_price > 0
  severity: warning
  message: Same reconciliation for gas
  suggestion: Reconcile the two parameters, or check the MMBtu conversion
- id: capex_battery_units_consistent
  condition: capex_battery > 700
  severity: info
  message: A battery capex above 700 USD/kWh is above any observed value for a complete grid-scale system
  suggestion: Check the unit — the shipped parameter is USD/kWh, not USD/kW
- id: capex_transmission_out_of_band
  condition: capex_transmission < 100 or capex_transmission > 2000
  severity: warning
  message: A transmission line cost per MW-km outside 100-2000 is at the edge of what any documented African
    project has cost
  suggestion: Confirm the unit is USD/MW-km and not USD/km
- id: discount_rate_gearing_interaction
  condition: discount_rate > 0.20 and gearing_ratio > 4.0
  severity: warning
  message: A discount rate above 20% with gearing above 4.0 (a debt fraction above 80%) is a financing
    structure that prices equity as if it were mezzanine debt
  suggestion: Reconcile discount_rate with the WACC identity in wacc_definition
- id: carbon_tax_rate_units
  condition: carbon_tax_rate > 0 and carbon_tax_rate < 0.5
  severity: warning
  message: A carbon tax rate between 0 and 0.5 USD/tonne is below every jurisdiction's adopted rate -
    the value is likely in a local currency or in cents
  suggestion: Convert to USD/tonne before setting
- id: index_above_unity
  condition: digital_divide_metrics > 0.99 or energy_security_index > 0.99 or geopolitical_risk_index
    > 0.99 or rule_of_law_index > 0.99 or corruption_perception > 0.99 or political_stability > 0.99 or
    regulatory_predictability > 0.99 or contract_enforceability > 0.99 or adaptive_capacity > 0.99 or
    vulnerability_index > 0.99 or exposure_index > 0.99
  severity: error
  message: A composite index with a [0, 1] construction has been set at the top of its range. Confirm
    the value is on the scale the equations that consume it assume.
  suggestion: Rescale the index to its documented range
- id: concentration_above_hhi_max
  condition: supply_chain_concentration > 9000 or market_concentration > 9000
  severity: error
  message: An HHI above 9,000 is close to the 10,000 a single supplier implies. Confirm the value is an
    index and not a share or a percentage.
  suggestion: Rescale to the 0–10,000 HHI scale
- id: geothermal_cost_below_drilling
  condition: geothermal_cost < 3000 and geothermal_drilling_success < 0.7
  severity: warning
  message: A geothermal capex below 3000 USD/kW with a drilling success rate below 70% implies a resource-risk
    premium the capex does not carry
  suggestion: Raise geothermal_cost, or raise the assumed drilling success rate
- id: wave_capex_below_offshore_wind
  condition: capex_marine_wave < capex_wind_offshore and capex_marine_wave > 0
  severity: info
  message: Wave energy priced below offshore wind is below any observed wave project. The parameter is
    on a projection, not an observation.
  suggestion: Confirm whether the value is a projected nth-of-a-kind or an observed first-of-a-kind
- id: mini_grid_cost_below_distribution
  condition: mini_grid_cost < distribution_capex_per_connection and mini_grid_cost > 0
  severity: info
  message: A mini-grid connection cheaper than a distribution connection is possible only if the mini-grid
    serves dense settlements the distribution network has not reached; otherwise the two are on different
    scopes
  suggestion: Confirm the scopes of the two parameters
- id: shs_cost_above_mini_grid
  condition: shs_cost > mini_grid_cost and mini_grid_cost > 0
  severity: info
  message: A solar home system priced above a mini-grid connection is unusual but possible where the home
    system includes a large appliance package and the mini-grid does not
  suggestion: Confirm the scopes
- id: adaptation_index_out_of_band
  condition: adaptive_capacity < 0.1 or adaptive_capacity > 0.95
  severity: warning
  message: An adaptive capacity index below 0.1 or above 0.95 is outside the range the ND-GAIN sample
    produces across all countries
  suggestion: Check whether the value is on a different index's scale
- id: mtbf_below_repair_time
  condition: mean_time_between_failures < mean_time_to_repair
  severity: warning
  message: MTBF below MTTR is possible for equipment that fails more often than it is repaired, but unusual
    for any equipment class the sample contains
  suggestion: Check the unit — MTBF is in hours and MTTR is in hours
- id: regulatory_lag_exceeds_period
  condition: regulatory_lag > regulatory_period_length
  severity: error
  message: The regulatory lag is longer than the regulatory period. A tariff review that occurs less often
    than the cost is recovered is a review the tariff never catches up to.
  suggestion: Lower regulatory_lag, or raise regulatory_period_length
- id: allowed_return_below_sovereign
  condition: allowed_return_on_debt < interest_rate
  severity: warning
  message: The regulator's allowed return on debt is below the sovereign policy rate. That is not a market-clearing
    cost of debt.
  suggestion: Reconcile allowed_return_on_debt with interest_rate and the sovereign risk premium
- id: allowed_equity_below_debt
  condition: allowed_return_on_equity < allowed_return_on_debt
  severity: warning
  message: The allowed return on equity is below the allowed return on debt. Equity holders bear more
    risk than debt holders, and a regulator that sets the two the wrong way round is setting a capital
    structure no investor will fund.
  suggestion: Raise allowed_return_on_equity above allowed_return_on_debt
- id: revenue_cap_below_cost
  condition: revenue_cap < 0.8
  severity: warning
  message: A revenue cap below 80% of cost-recovery revenue is a cap that forces a loss in most periods.
    This is possible under a political directive, but it is worth flagging.
  suggestion: Confirm the cap is the intended policy
- id: ppa_duration_beyond_asset_life
  condition: ppa_duration > asset_life
  severity: error
  message: The PPA extends beyond the asset's economic life. Either the duration is wrong, or the asset
    life should be extended.
  suggestion: Lower ppa_duration, or raise asset_life
- id: market_structure_without_model
  condition: (market_structure == 'monopoly' or market_structure == 'single_buyer') and market_model !=
    'regulated'
  severity: warning
  message: A market structure with no competition at the wholesale level is paired with a market model
    that is not regulated. A monopoly or a single buyer is administered, so a competitive model beside
    it describes a market that does not exist.
  suggestion: Set market_model to 'regulated', or move market_structure to 'wholesale' or 'retail'
- id: contract_for_difference_without_guarantees
  condition: contract_for_difference == 1 and ppa_guarantees == 0
  severity: info
  message: A CfD without a government PPA guarantee is a private contract with no sovereign backstop —
    possible but unusual
  suggestion: Confirm the pairing
- id: loss_carryback_exceeds_forward
  condition: loss_carryback_years > loss_carryforward_years
  severity: info
  message: Carry-back longer than carry-forward is possible in principle but unknown in the sample. Worth
    flagging as a scenario the graph's own evidence does not support.
  suggestion: Check the tax code
- id: insurance_combined_below_loss
  condition: combined_ratio < loss_ratio
  severity: error
  message: The combined ratio is below the loss ratio, which would imply a negative expense ratio
  suggestion: Reconcile the two, or check the market-level assumption
- id: solvency_below_regulatory_floor
  condition: solvency_capital_ratio < 1.0
  severity: error
  message: A solvency capital ratio below 1.0 is below the regulatory floor in every prudential regime
    the sample contains
  suggestion: Raise solvency_capital_ratio, or record that the scenario models an insurer in breach
- id: resettlement_population_exceeds_exposed
  condition: resettlement_population_share > 0.4
  severity: error
  message: A resettlement population share above 0.4 is at the top of the range any documented project
    has reached
  suggestion: Confirm whether the share is of the exposed population or of the whole population
- id: compensation_below_market
  condition: compensation_share_of_market < 1.0
  severity: info
  message: A compensation package below market value is possible where only economic displacement applies,
    but under IFC Performance Standard 5 physical displacement requires replacement cost at minimum
  suggestion: Confirm the displacement category
- id: investment_allowance_with_thin_cap_conflict
  condition: investment_allowance_rate > 0.5 and thin_capitalisation_limit > 3.0
  severity: info
  message: A generous investment allowance with a permissive thin-cap limit is a tax regime that subsidises
    debt-financed capex
  suggestion: Confirm the two are intended to coexist
- id: vat_on_equipment_with_import_exemption
  condition: vat_rate > 0.10 and import_duty_equipment == 0
  severity: info
  message: Zero import duty with a positive VAT is a jurisdiction that exempts the tariff but not the
    consumption tax; worth flagging as a specific tax structure
  suggestion: Confirm the exemption structure
- id: accelerated_depreciation_exceeds_allowable
  condition: accelerated_depreciation_factor > 1.0 and investment_allowance_rate > 0.0
  severity: warning
  message: Accelerated depreciation and investment allowance stacking is a tax shield the sample's tax
    codes do not allow
  suggestion: Confirm the tax code permits both
- id: load_factor_out_of_band
  condition: load_factor < 0.35 or load_factor > 0.9
  severity: warning
  message: A load factor below 0.35 or above 0.9 is outside the band most power systems operate in. A
    factor below 0.35 is a system with a very sharp peak; above 0.9 is a system with almost no daily variation,
    which usually means the demand profile is wrong.
  suggestion: Check peak_demand_mw against demand_twh
- id: lolp_above_standard
  condition: lolp > 0.01
  severity: error
  message: A loss-of-load probability above 1% is above the reliability standard most regulators set;
    the reserve margin is insufficient for the fleet the scenario builds
  suggestion: Raise reserve_margin_min, or check that firm_capacity_mw is the fleet the optimiser actually
    builds
- id: lole_exceeds_days
  condition: lole_hours_per_year > 24
  severity: error
  message: A loss-of-load expectation above one day per year is a system that fails the standard every
    jurisdiction in the sample has adopted
  suggestion: Reconcile reserve_margin_min with the reliability target
- id: frequency_nadir_below_protection
  condition: frequency_nadir_hz < 48.0
  severity: error
  message: A frequency nadir below 48 Hz on a 50 Hz system is below the first stage of under-frequency
    load shedding in most grids. The system trips before the response engages.
  suggestion: Raise firm_capacity_mw, or lower frequency_response_time_s, or relax the largest_loss_mw
    assumption
- id: composite_governance_out_of_band
  condition: composite_governance_index < 0.15 or composite_governance_index > 0.95
  severity: info
  message: A composite governance index outside [0.15, 0.95] is outside the range the Worldwide Governance
    Indicators produce across the sample. The components may be on different scales.
  suggestion: Check that the five components are normalised to the same [0, 1] scale
- id: fuel_diversity_with_monopoly
  condition: fuel_diversity_index < 0.3 and total_capacity_mw > 1000
  severity: warning
  message: A fuel diversity index below 0.3 with more than 1 GW of capacity is a system dependent on a
    single fuel. The number is what the index reports; the flag is that the scenario is one no diversification
    policy is being applied to.
  suggestion: Confirm the scenario is intended as a single-fuel case
- id: reserve_margin_below_requirement
  condition: reserve_margin_actual < reserve_margin_min
  severity: error
  message: The actual reserve margin is below the required minimum. The fleet the scenario builds does
    not meet the adequacy standard the scenario declares.
  suggestion: Raise firm_capacity_mw, raise vre_capacity_mw, or lower reserve_margin_min
- id: demand_growth_above_macro_implied
  condition: demand_growth > demand_growth_implied
  severity: warning
  message: 'Demand grows faster than the income elasticity''s implication. Electrification programmes
    and special loads do exactly this, so it is a warning with content, not an error: the plan is asserting
    a demand pull the macro driver does not explain, and the reviewer should be able to name the programme
    behind it.'
  suggestion: Name the electrification programme or the industrial load behind it, or lower demand_growth
- id: demand_growth_below_macro_implied
  condition: demand_growth < demand_growth_implied
  severity: warning
  message: Demand grows slower than the income elasticity's implication of the GDP growth the scenario
    also carries. A plan where the economy compounds at 5% and electricity demand lags at a fraction of
    that carries an efficiency or structural story the scenario should also state.
  suggestion: Carry the efficiency or structural story in the plan, or align demand_growth with the macro
    driver
