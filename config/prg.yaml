  gas_eaf_definition:
    name: Gas availability from its outage rates
    description: The gas fleet's energy availability. Gas has its own forced-outage node and shares the
      fleet-level planned-outage rate, because planned outages are scheduled across the fleet together
      while forced outages are a property of the unit type.
    system: reliability
    lhs: gas_eaf
    rhs: 1 - forced_outage_rate_gas - planned_outage_rate
    relation: eq
