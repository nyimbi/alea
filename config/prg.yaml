# SPDX-License-Identifier: MIT
# The Parameter Relationship Graph.
#
# WHAT THIS FILE IS. The couplings between ALEA's parameters, stated as
# equations, so that a scenario which sets two coupled parameters independently
# is refused rather than solved. `docs/params-prg1.md` §1: "the 784 parameters
# are not independent knobs... if ALEA treats parameters as independent, it will
# produce physically impossible, economically inconsistent, or
# self-contradictory scenarios".
#
# WHAT IT DELIBERATELY DOES NOT CONTAIN. No `depends_on` / `affects` list on a
# node. The specification's node model carries them beside the edges, so the
# same relationship is written twice and the two records drift. The edges and
# the equations are the graph; a declared list is a document that lies about it.
# `ParameterGraph.structure_issues()` will check declared lists if anyone adds
# them, and reports nothing while there are none.
#
# SCOPE. This is the kernel's first slice: the cost, emissions, reserve and
# capture-price systems, over the parameters the what-if engine already exposes.
# It is not the 784-parameter graph. The systems it does not yet cover are
# enumerated in `alea.prg.library.SYSTEMS` and reported by
# `alea.prg.library.coverage()`, so an unmodelled system reads as a finding
# rather than as a system nothing violates.

parameters:
  # -- exogenous: what a user or a dataset sets ------------------------

  discount_rate:
    name: "Discount rate"
    description: >
      Real weighted average cost of capital, used to annualise capex. Derived
      from the financing blend: setting the blend and the rate independently is
      setting one quantity twice, which is what this graph exists to refuse.
    category: "Financial"
    type: float
    unit: "1/year"
    range: [0.0, 0.5]
    role: derived
    determinism: policy
    priority: P1
    status: existing

  asset_life:
    name: "Asset life"
    description: "Economic life over which capex is recovered."
    category: "Financial"
    type: float
    unit: "years"
    range: [5.0, 60.0]
    default: 25.0
    role: exogenous
    determinism: physical
    priority: P1
    status: existing

  capex_usd_per_kw:
    name: "Capital cost"
    description: "Installed cost per kilowatt of the reference technology."
    category: "Costs"
    type: float
    unit: "USD/kW"
    range: [100.0, 5000.0]
    default: 1200.0
    role: exogenous
    determinism: fixed
    priority: P1
    status: existing

  capacity_factor:
    name: "Capacity factor"
    description: "Annual energy divided by rated output times 8760 hours."
    category: "Technical"
    type: float
    unit: "1"
    range: [0.05, 0.7]
    default: 0.35
    role: exogenous
    determinism: physical
    priority: P1
    status: existing

  fuel_price_usd_per_mwh:
    name: "Fuel price"
    description: "Delivered fuel cost per megawatt-hour of thermal output."
    category: "Costs"
    type: float
    unit: "USD/MWh"
    range: [0.0, 300.0]
    default: 40.0
    role: exogenous
    determinism: stochastic
    priority: P1
    status: existing

  carbon_price_usd_per_tco2:
    name: "Carbon price"
    description: "Price per tonne of CO2 applied to covered emissions."
    category: "Policy & Regulatory"
    type: float
    unit: "USD/tonne"
    range: [0.0, 1000.0]
    default: 50.0
    role: exogenous
    determinism: policy
    priority: P1
    status: existing

  emission_factor_t_per_mwh:
    name: "Emission factor"
    description: "Tonnes of CO2 per megawatt-hour of the reference technology."
    category: "Emissions"
    type: float
    unit: "tonne/MWh"
    range: [0.0, 1.5]
    default: 0.5
    role: exogenous
    determinism: physical
    priority: P1
    status: existing

  capture_price_sensitivity:
    name: "Capture price sensitivity"
    description: >
      How far the capture price falls per unit of renewable share. This is the
      cannibalisation coefficient, and it is what makes the capture-price loop
      a loop: without it the price a renewable unit receives would not depend on
      how much renewable capacity was built.
    category: "Market"
    type: float
    unit: "1"
    range: [0.0, 3.0]
    default: 1.2
    role: exogenous
    determinism: fixed
    priority: P2
    status: to_build

  total_capacity_mw:
    name: "Total installed capacity"
    description: "Nameplate capacity on the system, all carriers."
    category: "Technical"
    type: float
    unit: "MW"
    range: [1.0, 1000000.0]
    default: 10000.0
    role: exogenous
    determinism: fixed
    priority: P2
    status: existing

  vre_capacity_target_mw:
    name: "Renewable build target"
    description: >
      The capacity investors would build if the capture price equalled the
      marginal cost of the alternative. The loop's forcing term: the fixed
      point is this target discounted by the cannibalisation it causes.
    category: "Technical"
    type: float
    unit: "MW"
    range: [0.0, 1000000.0]
    default: 4000.0
    role: exogenous
    determinism: policy
    priority: P2
    status: to_build

  firm_capacity_mw:
    name: "Firm capacity"
    description: "Dispatchable capacity counted at full nameplate for reserve."
    category: "Technical"
    type: float
    unit: "MW"
    range: [0.0, 1000000.0]
    default: 9000.0
    role: exogenous
    determinism: fixed
    priority: P2
    status: existing

  peak_demand_mw:
    name: "Peak demand"
    description: "Highest hourly demand the system must serve."
    category: "Demand"
    type: float
    unit: "MW"
    range: [1.0, 1000000.0]
    default: 8500.0
    role: exogenous
    determinism: physical
    priority: P1
    status: existing

  reserve_margin_min:
    name: "Minimum reserve margin"
    description: "Firm capacity required above peak demand, as a fraction."
    category: "Technical"
    type: float
    unit: "1"
    range: [0.0, 1.0]
    default: 0.15
    role: exogenous
    determinism: policy
    priority: P1
    status: existing

  # -- derived: what the equations compute -----------------------------

  crf:
    name: "Capital recovery factor"
    description: "The annuity factor that turns capex into an annual charge."
    category: "Financial"
    type: float
    unit: "1/year"
    range: [0.001, 2.0]
    role: derived
    determinism: fixed
    priority: P1
    status: existing

  annualised_capex_usd_per_kw:
    name: "Annualised capital cost"
    description: "Capex recovered per year, per kilowatt."
    category: "Costs"
    type: float
    unit: "USD/kW/year"
    range: [0.0, 5000.0]
    role: derived
    determinism: fixed
    priority: P1
    status: existing

  carbon_cost_usd_per_mwh:
    name: "Carbon cost"
    description: "The carbon price expressed per megawatt-hour generated."
    category: "Emissions"
    type: float
    unit: "USD/MWh"
    range: [0.0, 5000.0]
    role: derived
    determinism: fixed
    priority: P1
    status: existing

  marginal_cost_usd_per_mwh:
    name: "Marginal cost"
    description: "Short-run marginal cost: fuel plus carbon."
    category: "Costs"
    type: float
    unit: "USD/MWh"
    range: [0.0, 5000.0]
    role: derived
    determinism: fixed
    priority: P1
    status: existing

  lcoe_usd_per_mwh:
    name: "Levelised cost"
    description: "Levelised cost of energy over the asset's economic life."
    category: "Costs"
    type: float
    unit: "USD/MWh"
    range: [0.0, 5000.0]
    role: derived
    determinism: fixed
    priority: P1
    status: existing

  capture_price_ratio:
    name: "Capture price ratio"
    description: >
      The capture price as a fraction of marginal cost. One means a renewable
      unit is paid what the alternative costs; below one, the cannibalisation
      has eaten the margin, and that ratio is the loop's answer.
    category: "Market"
    type: float
    unit: "1"
    range: [0.0, 2.0]
    role: derived
    determinism: fixed
    priority: P2
    status: to_build

  # -- the feedback loop's state variables -----------------------------
  #
  # Role `derived` because no user sets them: they are the fixed point. They
  # are excluded from the topological order -- a cycle has none -- and solved
  # by `alea.prg.feedback`. `solution_method: iterative` on their equations is
  # what marks them, and it is also what stops the graph refusing the cycle.

  capture_price_usd_per_mwh:
    name: "Capture price"
    description: "The price a renewable unit actually receives, per MWh."
    category: "Market"
    type: float
    unit: "USD/MWh"
    range: [0.0, 5000.0]
    role: derived
    determinism: fixed
    initial: 60.0
    priority: P2
    status: to_build

  vre_share:
    name: "Renewable share"
    description: "Renewable nameplate capacity as a fraction of the total."
    category: "Technical"
    type: float
    unit: "1"
    range: [0.0, 1.0]
    role: derived
    determinism: fixed
    initial: 0.2
    priority: P2
    status: to_build

  vre_capacity_mw:
    name: "Renewable capacity"
    description: "Renewable nameplate capacity at the loop's fixed point."
    category: "Technical"
    type: float
    unit: "MW"
    range: [0.0, 1000000.0]
    role: derived
    determinism: fixed
    initial: 4000.0
    priority: P2
    status: to_build


  # -- System 1: Energy Balance ----------------------------------------
  # The identity that makes a demand forecast and a generation build the
  # same scenario rather than two documents that disagree.

  base_demand_twh:
    name: "Base-year demand"
    description: "Final demand in the base year, from which growth is compounded."
    category: "Demand"
    type: float
    unit: "TWh"
    range: [1.0, 10000.0]
    default: 33.8
    role: exogenous
    determinism: stochastic
    priority: P1
    status: to_build

  demand_growth:
    name: "Demand growth"
    description: "Compound annual growth in final electricity demand."
    category: "Demand"
    type: float
    unit: "1/year"
    range: [-0.05, 0.15]
    default: 0.04
    role: exogenous
    determinism: stochastic
    priority: P1
    status: existing

  transmission_loss_fraction:
    name: "Transmission loss"
    description: "Share of generated energy lost between the busbar and the meter."
    category: "Technical"
    type: float
    unit: "1"
    range: [0.0, 0.5]
    default: 0.08
    role: exogenous
    determinism: physical
    priority: P1
    status: existing

  net_imports_twh:
    name: "Net imports"
    description: "Imports less exports over the year, which the balance is struck net of."
    category: "Demand"
    type: float
    unit: "TWh"
    range: [-1000.0, 1000.0]
    default: 0.0
    role: exogenous
    determinism: policy
    priority: P2
    status: to_build

  demand_twh:
    name: "Demand"
    description: "Final demand in the horizon year, after growth is compounded."
    category: "Demand"
    type: float
    unit: "TWh"
    range: [1.0, 20000.0]
    role: derived
    determinism: stochastic
    priority: P1
    status: to_build

  generation_twh:
    name: "Generation"
    description: "Energy generated at the busbar, which is what clears the balance."
    category: "Demand"
    type: float
    unit: "TWh"
    range: [0.0, 30000.0]
    role: derived
    determinism: physical
    priority: P1
    status: to_build

  # -- System 4: Demand-Supply Equilibrium -----------------------------

  reference_tariff_usd_per_mwh:
    name: "Reference tariff"
    description: "The tariff at which the reference demand was observed."
    category: "Demand"
    type: float
    unit: "USD/MWh"
    range: [1.0, 2000.0]
    default: 100.0
    role: exogenous
    determinism: policy
    priority: P2
    status: to_build

  price_elasticity:
    name: "Demand price elasticity"
    description: >
      Proportional change in demand per proportional change in price. Negative
      for a normal good, and the reason a tariff rise is not a free fiscal move.
    category: "Demand"
    type: float
    unit: "1"
    range: [-3.0, 0.0]
    default: -0.3
    role: exogenous
    determinism: stochastic
    priority: P2
    status: to_build

  equilibrium_demand_twh:
    name: "Equilibrium demand"
    description: "Demand after the tariff moves, which is what the balance must serve."
    category: "Demand"
    type: float
    unit: "TWh"
    range: [0.0, 20000.0]
    role: derived
    determinism: stochastic
    priority: P2
    status: to_build

  # -- System 5: Financial Identities ----------------------------------
  # The discount rate is *derived* here. It is the weighted average cost of
  # capital; a scenario that sets the blend and the rate independently is
  # setting one quantity twice, which is what this graph exists to refuse.

  debt_fraction:
    name: "Debt share"
    description: "Share of capex financed with debt rather than equity."
    category: "Financial"
    type: float
    unit: "1"
    range: [0.0, 0.95]
    default: 0.7
    role: exogenous
    determinism: policy
    priority: P1
    status: to_build

  cost_of_debt:
    name: "Cost of debt"
    description: "Interest rate on the project's debt."
    category: "Financial"
    type: float
    unit: "1/year"
    range: [0.0, 0.5]
    default: 0.09
    role: exogenous
    determinism: policy
    priority: P1
    status: to_build

  cost_of_equity:
    name: "Cost of equity"
    description: "Return equity holders require for the same project."
    category: "Financial"
    type: float
    unit: "1/year"
    range: [0.0, 0.6]
    default: 0.16
    role: exogenous
    determinism: policy
    priority: P1
    status: to_build

  tax_rate:
    name: "Tax rate"
    description: "Corporate tax rate, which shields part of the interest."
    category: "Financial"
    type: float
    unit: "1"
    range: [0.0, 0.6]
    default: 0.3
    role: exogenous
    determinism: policy
    priority: P2
    status: to_build

  dscr_min:
    name: "Minimum DSCR"
    description: "The coverage a lender will accept before it declines the financing."
    category: "Financial"
    type: float
    unit: "1"
    range: [1.0, 3.0]
    default: 1.3
    role: exogenous
    determinism: policy
    priority: P1
    status: to_build

  cfads_usd_per_kw_year:
    name: "Cash available for debt service"
    description: >
      Tariff less marginal cost, over the energy one kilowatt sells in a year.
      A stated simplification: the tariff is the single buyer's whole revenue,
      not the generator's share of it. Negative is a real and important value:
      it is a plant whose revenue does not cover its own fuel, and the range
      admits it so that the DSCR floor can report it rather than the solver
      refusing to compute it.
    category: "Financial"
    type: float
    unit: "USD/kW/year"
    range: [-5000.0, 5000.0]
    role: derived
    determinism: policy
    priority: P2
    status: to_build

  debt_service_usd_per_kw_year:
    name: "Debt service"
    description: "The annuity a lender is repaid per kilowatt, at the debt rate over the asset life."
    category: "Financial"
    type: float
    unit: "USD/kW/year"
    range: [0.0, 5000.0]
    role: derived
    determinism: policy
    priority: P2
    status: to_build

  project_gearing_dscr:
    name: "Debt service coverage ratio"
    description: >
      Cash available against the debt service a lender requires. Negative when
      the tariff does not cover operating cost, which the floor below then
      reports as the financing failure it is.
    category: "Financial"
    type: float
    unit: "1"
    range: [-20.0, 20.0]
    role: derived
    determinism: policy
    priority: P2
    status: to_build

  # -- System 6: Learning Curves ---------------------------------------

  learning_rate:
    name: "Learning rate"
    description: "Cost reduction per doubling of cumulative deployment."
    category: "Costs"
    type: float
    unit: "1"
    range: [0.0, 0.4]
    default: 0.18
    role: exogenous
    determinism: stochastic
    priority: P1
    status: to_build

  cumulative_capacity_mw:
    name: "Cumulative capacity"
    description: "Capacity ever installed, which is what the learning curve is a function of."
    category: "Technical"
    type: float
    unit: "MW"
    range: [1.0, 10000000.0]
    default: 50000.0
    role: exogenous
    determinism: stochastic
    priority: P2
    status: to_build

  cumulative_capacity_reference_mw:
    name: "Reference cumulative capacity"
    description: "The cumulative deployment at which the reference capex was observed."
    category: "Technical"
    type: float
    unit: "MW"
    range: [1.0, 10000000.0]
    default: 25000.0
    role: exogenous
    determinism: fixed
    priority: P2
    status: to_build

  capex_learning_usd_per_kw:
    name: "Learning-adjusted capital cost"
    description: "Capex after the learning curve, which is what a build programme actually pays."
    category: "Costs"
    type: float
    unit: "USD/kW"
    range: [0.0, 5000.0]
    role: derived
    determinism: stochastic
    priority: P1
    status: to_build

  lcoe_learning_usd_per_mwh:
    name: "LCOE at learning-adjusted capex"
    description: >
      What a build programme at this cumulative deployment actually pays. The
      reference-capex LCOE is the counterfactual it is measured against.
    category: "Costs"
    type: float
    unit: "USD/MWh"
    range: [0.0, 5000.0]
    role: derived
    determinism: stochastic
    priority: P2
    status: to_build

  # -- System 8: System Inertia ----------------------------------------

  system_inertia_mws:
    name: "System inertia"
    description: "Kinetic energy stored in online synchronous machines at nominal frequency."
    category: "Technical"
    type: float
    unit: "MW.s"
    range: [0.0, 10000000.0]
    default: 30000.0
    role: exogenous
    determinism: physical
    priority: P1
    status: to_build

  largest_loss_mw:
    name: "Largest credible loss"
    description: "The largest single infeed whose loss the system must ride through."
    category: "Technical"
    type: float
    unit: "MW"
    range: [1.0, 20000.0]
    default: 1000.0
    role: exogenous
    determinism: physical
    priority: P1
    status: to_build

  rocof_limit_hz_per_s:
    name: "RoCoF limit"
    description: "The frequency slope the protection settings tolerate before tripping."
    category: "Technical"
    type: float
    unit: "Hz/s"
    range: [0.05, 5.0]
    default: 1.0
    role: exogenous
    determinism: policy
    priority: P1
    status: to_build

  rocof_df_dt_hz_per_s:
    name: "Rate of change of frequency"
    description: "The frequency slope after the largest loss, before any response."
    category: "Technical"
    type: float
    unit: "Hz/s"
    range: [0.0, 10.0]
    role: derived
    determinism: physical
    priority: P1
    status: to_build

  # -- System 10: Reliability ------------------------------------------

  expected_unserved_fraction:
    name: "Expected unserved fraction"
    description: "Share of demand the system is expected to fail to serve."
    category: "Reliability"
    type: float
    unit: "1"
    range: [0.0, 0.2]
    default: 0.001
    role: exogenous
    determinism: stochastic
    priority: P2
    status: to_build

  voll_usd_per_mwh:
    name: "Value of lost load"
    description: "What an unserved megawatt-hour is worth, which is what prices reliability."
    category: "Reliability"
    type: float
    unit: "USD/MWh"
    range: [100.0, 100000.0]
    default: 5000.0
    role: exogenous
    determinism: policy
    priority: P2
    status: to_build

  unserved_energy_gwh:
    name: "Unserved energy"
    description: "Expected energy not served over the year."
    category: "Reliability"
    type: float
    unit: "GWh"
    range: [0.0, 100000.0]
    role: derived
    determinism: stochastic
    priority: P2
    status: to_build

  reliability_cost_usd:
    name: "Reliability cost"
    description: "The value of the energy the system fails to serve."
    category: "Reliability"
    type: float
    unit: "USD"
    range: [0.0, 1000000000000.0]
    role: derived
    determinism: stochastic
    priority: P2
    status: to_build

  # -- System 11: Carbon Trajectory ------------------------------------

  carbon_budget_mtco2:
    name: "Carbon budget"
    description: "The cumulative emissions the horizon is allowed."
    category: "Emissions"
    type: float
    unit: "MtCO2"
    range: [0.0, 100000.0]
    default: 500.0
    role: exogenous
    determinism: policy
    priority: P1
    status: to_build

  horizon_years:
    name: "Horizon"
    description: "The number of years the carbon budget is spent over."
    category: "Emissions"
    type: float
    unit: "years"
    range: [1.0, 50.0]
    default: 10.0
    role: exogenous
    determinism: policy
    priority: P2
    status: to_build

  emissions_mtco2_per_year:
    name: "Annual emissions"
    description: "Generation times an emission factor, in megatonnes."
    category: "Emissions"
    type: float
    unit: "MtCO2/year"
    range: [0.0, 10000.0]
    role: derived
    determinism: physical
    priority: P1
    status: to_build

  carbon_budget_ratio:
    name: "Budget ratio"
    description: "Emissions over the horizon against the budget. Above one, the trajectory misses."
    category: "Emissions"
    type: float
    unit: "1"
    range: [0.0, 100.0]
    role: derived
    determinism: policy
    priority: P2
    status: to_build

  # -- System 12: Affordability ----------------------------------------

  tariff_usd_per_mwh:
    name: "Retail tariff"
    description: "What a customer pays per megawatt-hour, including network and retail costs."
    category: "Affordability"
    type: float
    unit: "USD/MWh"
    range: [0.0, 2000.0]
    default: 135.0
    role: exogenous
    determinism: policy
    priority: P1
    status: to_build

  household_income_usd_per_year:
    name: "Household income"
    description: "Mean annual household income, the denominator of the affordability test."
    category: "Affordability"
    type: float
    unit: "USD/year"
    range: [100.0, 1000000.0]
    default: 4000.0
    role: exogenous
    determinism: stochastic
    priority: P1
    status: to_build

  household_consumption_mwh_per_year:
    name: "Household consumption"
    description: "Mean annual household electricity consumption."
    category: "Affordability"
    type: float
    unit: "MWh/year"
    range: [0.1, 50.0]
    default: 1.5
    role: exogenous
    determinism: stochastic
    priority: P2
    status: to_build

  energy_burden_limit:
    name: "Affordability limit"
    description: >
      The burden above which a tariff is politically impossible, whatever its
      LCOE. The system that stops a scenario being cost-optimal and socially
      impossible at once.
    category: "Affordability"
    type: float
    unit: "1"
    range: [0.01, 0.5]
    default: 0.1
    role: exogenous
    determinism: policy
    priority: P1
    status: to_build

  energy_burden:
    name: "Energy burden"
    description: "The share of household income spent on electricity."
    category: "Affordability"
    type: float
    unit: "1"
    range: [0.0, 1.0]
    role: derived
    determinism: policy
    priority: P1
    status: to_build

  # -- System 9: Water-Energy Nexus ------------------------------------

  cooling_water_m3_per_mwh:
    name: "Cooling water intensity"
    description: "Water withdrawn per megawatt-hour generated by the thermal fleet."
    category: "Water"
    type: float
    unit: "m3/MWh"
    range: [0.0, 10.0]
    default: 1.8
    role: exogenous
    determinism: physical
    priority: P2
    status: to_build

  hydrogen_water_m3_per_kg:
    name: "Water intensity of hydrogen"
    description: "Water consumed per kilogram of hydrogen produced."
    category: "Water"
    type: float
    unit: "m3/kg"
    range: [0.0, 0.1]
    default: 0.009
    role: exogenous
    determinism: physical
    priority: P2
    status: to_build

  hydrogen_production_kt_per_year:
    name: "Hydrogen production"
    description: "Annual hydrogen output, which is the other draw on the catchment."
    category: "Water"
    type: float
    unit: "kt/year"
    range: [0.0, 10000.0]
    default: 50.0
    role: exogenous
    determinism: policy
    priority: P2
    status: to_build

  water_availability_m3:
    name: "Water availability"
    description: "Water the catchment makes available to the energy sector over the year."
    category: "Water"
    type: float
    unit: "m3"
    range: [0.0, 100000000000.0]
    default: 200000000.0
    role: exogenous
    determinism: physical
    priority: P2
    status: to_build

  cooling_water_demand_m3:
    name: "Cooling water demand"
    description: "Water the thermal fleet withdraws over the year."
    category: "Water"
    type: float
    unit: "m3"
    range: [0.0, 100000000000.0]
    role: derived
    determinism: physical
    priority: P2
    status: to_build

  hydrogen_water_demand_m3:
    name: "Hydrogen water demand"
    description: "Water the hydrogen programme consumes over the year."
    category: "Water"
    type: float
    unit: "m3"
    range: [0.0, 100000000000.0]
    role: derived
    determinism: physical
    priority: P2
    status: to_build

  # -- System 12: Employment -------------------------------------------

  construction_jobs_per_mw:
    name: "Construction jobs"
    description: "Direct construction jobs per megawatt installed."
    category: "Social"
    type: float
    unit: "jobs/MW"
    range: [0.0, 50.0]
    default: 4.0
    role: exogenous
    determinism: fixed
    priority: P2
    status: to_build

  om_jobs_per_mw:
    name: "O&M jobs"
    description: "Direct operation and maintenance jobs per megawatt installed."
    category: "Social"
    type: float
    unit: "jobs/MW"
    range: [0.0, 10.0]
    default: 0.3
    role: exogenous
    determinism: fixed
    priority: P2
    status: to_build

  indirect_jobs_multiplier:
    name: "Indirect jobs multiplier"
    description: "Indirect jobs in the supply chain per direct job."
    category: "Social"
    type: float
    unit: "1"
    range: [0.0, 5.0]
    default: 1.4
    role: exogenous
    determinism: fixed
    priority: P2
    status: to_build

  induced_jobs_multiplier:
    name: "Induced jobs multiplier"
    description: "Jobs induced by the spending of direct employees, per direct job."
    category: "Social"
    type: float
    unit: "1"
    range: [0.0, 5.0]
    default: 0.8
    role: exogenous
    determinism: fixed
    priority: P2
    status: to_build

  direct_jobs:
    name: "Direct jobs"
    description: "Construction and O&M jobs the installed fleet supports."
    category: "Social"
    type: float
    unit: "jobs"
    range: [0.0, 10000000.0]
    role: derived
    determinism: fixed
    priority: P2
    status: to_build

  total_jobs:
    name: "Total jobs"
    description: "Direct, indirect and induced employment. The number a build programme is argued on."
    category: "Social"
    type: float
    unit: "jobs"
    range: [0.0, 50000000.0]
    role: derived
    determinism: fixed
    priority: P2
    status: to_build

  # -- System 13: Health Impact ----------------------------------------

  pm25_kt_per_year:
    name: "PM2.5 emissions"
    description: "Fine particulate emissions, which is what the health impact is a function of."
    category: "Health"
    type: float
    unit: "kt/year"
    range: [0.0, 1000.0]
    default: 20.0
    role: exogenous
    determinism: physical
    priority: P2
    status: to_build

  exposed_population:
    name: "Exposed population"
    description: "People within the dispersion range of the emitting fleet."
    category: "Health"
    type: float
    unit: "people"
    range: [0.0, 1000000000.0]
    default: 5000000.0
    role: exogenous
    determinism: stochastic
    priority: P2
    status: to_build

  baseline_mortality_rate:
    name: "Baseline mortality rate"
    description: "Annual all-cause mortality in the exposed population, before any air quality effect."
    category: "Health"
    type: float
    unit: "1/year"
    range: [0.0, 0.1]
    default: 0.008
    role: exogenous
    determinism: stochastic
    priority: P2
    status: to_build

  pm25_relative_risk_per_kt:
    name: "Relative risk per kt"
    description: >
      Proportional rise in mortality per kilotonne of PM2.5. A linearised
      concentration-response function, which is what a health impact assessment
      uses when it has no dispersion model to hand.
    category: "Health"
    type: float
    unit: "1/kt"
    range: [0.0, 0.1]
    default: 0.006
    role: exogenous
    determinism: stochastic
    priority: P2
    status: to_build

  years_of_life_lost:
    name: "Years of life lost"
    description: "Mean years lost per premature death, the YLL half of a DALY."
    category: "Health"
    type: float
    unit: "years"
    range: [0.0, 50.0]
    default: 12.0
    role: exogenous
    determinism: stochastic
    priority: P2
    status: to_build

  premature_deaths_per_year:
    name: "Premature deaths"
    description: "Deaths attributable to the fleet's PM2.5, over the year."
    category: "Health"
    type: float
    unit: "deaths/year"
    range: [0.0, 10000000.0]
    role: derived
    determinism: stochastic
    priority: P2
    status: to_build

  dalys_per_year:
    name: "DALYs"
    description: "Disability-adjusted life years lost, which is the burden the emissions cost in health."
    category: "Health"
    type: float
    unit: "DALY/year"
    range: [0.0, 100000000.0]
    role: derived
    determinism: stochastic
    priority: P2
    status: to_build

  # -- System 20: PPA Pricing ------------------------------------------

  offtake_risk_premium:
    name: "Offtake risk premium"
    description: "Return the offtaker demands for bearing volume and price risk."
    category: "Contracts"
    type: float
    unit: "1"
    range: [0.0, 0.5]
    default: 0.05
    role: exogenous
    determinism: policy
    priority: P2
    status: to_build

  equity_return_target:
    name: "Equity return target"
    description: "Return the sponsor requires on the contract, above the cost of capital."
    category: "Contracts"
    type: float
    unit: "1"
    range: [0.0, 0.5]
    default: 0.04
    role: exogenous
    determinism: policy
    priority: P2
    status: to_build

  ppa_availability:
    name: "PPA availability"
    description: "Share of hours the plant is contractually available, which is what the price is divided by."
    category: "Contracts"
    type: float
    unit: "1"
    range: [0.5, 1.0]
    default: 0.95
    role: exogenous
    determinism: policy
    priority: P2
    status: to_build

  ppa_price_usd_per_mwh:
    name: "PPA price"
    description: >
      The price a project actually signs at. Not its LCOE: cost plus the risk
      and return the offtaker and sponsor demand, divided by availability.
    category: "Contracts"
    type: float
    unit: "USD/MWh"
    range: [0.0, 5000.0]
    role: derived
    determinism: policy
    priority: P2
    status: to_build

equations:
  # -- System 2: Cost Accounting ---------------------------------------

  crf_definition:
    name: "Capital recovery factor"
    description: >
      The annuity factor: the annual charge that repays one unit of capex over
      the asset's life at the discount rate.
    system: cost_accounting
    lhs: "discount_rate * (1 + discount_rate) ** asset_life"
    rhs: "crf * ((1 + discount_rate) ** asset_life - 1)"
    parameters: [crf, discount_rate, asset_life]
    determined_variables: [crf]
    tolerance: 1.0e-9
    reference: "Standard annuity formula; cf. LCOE definitions in IEA/NEA Projected Costs of Generating Electricity"
    linearity: nonlinear
    solution_method: direct
    priority: P1

  annualised_capex:
    name: "Annualised capital cost"
    description: "Capex recovered per year is capex times the recovery factor."
    system: cost_accounting
    lhs: "annualised_capex_usd_per_kw"
    rhs: "capex_usd_per_kw * crf"
    parameters: [annualised_capex_usd_per_kw, capex_usd_per_kw, crf]
    determined_variables: [annualised_capex_usd_per_kw]
    tolerance: 1.0e-9
    linearity: linear
    solution_method: direct
    priority: P1

  marginal_cost:
    name: "Marginal cost"
    description: >
      Short-run marginal cost. The carbon cost enters here rather than as a
      separate term in the objective, so a carbon price and a fuel price cannot
      be double-counted or omitted independently.
    system: cost_accounting
    lhs: "marginal_cost_usd_per_mwh"
    rhs: "fuel_price_usd_per_mwh + carbon_cost_usd_per_mwh"
    parameters: [marginal_cost_usd_per_mwh, fuel_price_usd_per_mwh, carbon_cost_usd_per_mwh]
    determined_variables: [marginal_cost_usd_per_mwh]
    tolerance: 1.0e-9
    linearity: linear
    solution_method: direct
    priority: P1

  lcoe_definition:
    name: "Levelised cost"
    description: >
      Levelised cost: the annualised capital charge spread over the energy the
      asset actually produces, plus marginal cost. The 1000 and 8760 convert
      kW to MW and hours to a year, and they are written here rather than
      folded into a constant so a reader can check the units.
    system: cost_accounting
    lhs: "lcoe_usd_per_mwh"
    rhs: "annualised_capex_usd_per_kw * 1000 / (8760 * capacity_factor) + marginal_cost_usd_per_mwh"
    parameters: [lcoe_usd_per_mwh, annualised_capex_usd_per_kw, capacity_factor, marginal_cost_usd_per_mwh]
    determined_variables: [lcoe_usd_per_mwh]
    tolerance: 1.0e-9
    reference: "IEA/NEA, Projected Costs of Generating Electricity"
    linearity: linear
    solution_method: direct
    priority: P1

  # -- System 3: Emissions Accounting ----------------------------------

  carbon_cost:
    name: "Carbon cost per MWh"
    description: "Carbon price times emission factor: the price, per unit generated."
    system: emissions
    lhs: "carbon_cost_usd_per_mwh"
    rhs: "carbon_price_usd_per_tco2 * emission_factor_t_per_mwh"
    parameters: [carbon_cost_usd_per_mwh, carbon_price_usd_per_tco2, emission_factor_t_per_mwh]
    determined_variables: [carbon_cost_usd_per_mwh]
    tolerance: 1.0e-9
    linearity: linear
    solution_method: direct
    priority: P1

  # -- System 7: Reserve Margin ----------------------------------------

  reserve_margin:
    name: "Reserve margin"
    description: >
      Firm capacity plus the renewable fleet's contribution at its capacity
      factor must cover peak demand with the required margin. An inequality,
      because it bounds a build rather than fixing one.
    system: reserve_margin
    lhs: "firm_capacity_mw + vre_capacity_mw * capacity_factor"
    rhs: "peak_demand_mw * (1 + reserve_margin_min)"
    relation: geq
    parameters: [firm_capacity_mw, vre_capacity_mw, capacity_factor, peak_demand_mw, reserve_margin_min]
    tolerance: 1.0e-6
    reference: "Standard N-1 planning criterion; cf. ENTSO-E adequacy studies"
    linearity: linear
    solution_method: direct
    priority: P1

  # -- System 9: Capture Price (the feedback loop) ----------------------
  #
  # Three equations, each determining one state variable, that together form a
  # single strongly connected component. `solution_method: iterative` is what
  # marks them as a loop rather than a derivation -- without it the graph would
  # refuse the cycle, correctly, because a derivation cycle has no order.

  capture_price_equation:
    name: "Capture price under cannibalisation"
    description: >
      The price a renewable unit receives falls as its own share rises. This is
      `params-prg1.md` §2 class 6: higher VRE lowers the capture price, which
      lowers the return to building more VRE.
    system: capture_price
    lhs: "capture_price_usd_per_mwh"
    rhs: "marginal_cost_usd_per_mwh * (1 - capture_price_sensitivity * vre_share)"
    parameters: [capture_price_usd_per_mwh, marginal_cost_usd_per_mwh, capture_price_sensitivity, vre_share]
    determined_variables: [capture_price_usd_per_mwh]
    tolerance: 1.0e-8
    linearity: linear
    solution_method: iterative
    priority: P2

  vre_share_definition:
    name: "Renewable share"
    description: "Renewable capacity as a fraction of the system's total."
    system: capture_price
    lhs: "vre_share"
    rhs: "vre_capacity_mw / total_capacity_mw"
    parameters: [vre_share, vre_capacity_mw, total_capacity_mw]
    determined_variables: [vre_share]
    tolerance: 1.0e-8
    linearity: linear
    solution_method: iterative
    priority: P2

  vre_build:
    name: "Renewable build response"
    description: >
      Investors build in proportion to the capture price's ratio to the
      alternative's cost. The loop's forcing term, and the reason the fixed
      point is below the target: the build erodes the price that justified it.
    system: capture_price
    lhs: "vre_capacity_mw"
    rhs: "vre_capacity_target_mw * capture_price_usd_per_mwh / marginal_cost_usd_per_mwh"
    parameters: [vre_capacity_mw, vre_capacity_target_mw, capture_price_usd_per_mwh, marginal_cost_usd_per_mwh]
    determined_variables: [vre_capacity_mw]
    tolerance: 1.0e-8
    linearity: linear
    solution_method: iterative
    priority: P2

  capture_price_ratio_definition:
    name: "Capture price ratio"
    description: >
      The loop's answer as a single number: what a renewable unit is paid,
      against what the alternative costs to run.
    system: capture_price
    lhs: "capture_price_ratio"
    rhs: "capture_price_usd_per_mwh / marginal_cost_usd_per_mwh"
    parameters: [capture_price_ratio, capture_price_usd_per_mwh, marginal_cost_usd_per_mwh]
    determined_variables: [capture_price_ratio]
    tolerance: 1.0e-8
    linearity: linear
    solution_method: direct
    priority: P2


  # -- System 1: Energy Balance ----------------------------------------

  energy_demand:
    name: "Demand at the horizon"
    description: >
      Base-year demand compounded to the horizon year. A growth rate with no
      base and a base with no growth rate are the same document twice.
    system: energy_balance
    lhs: "demand_twh"
    rhs: "base_demand_twh * (1 + demand_growth) ** horizon_years"
    parameters: [demand_twh, base_demand_twh, demand_growth, horizon_years]
    determined_variables: [demand_twh]
    tolerance: 1.0e-9
    linearity: nonlinear
    solution_method: direct
    priority: P1

  energy_balance:
    name: "Energy balance"
    description: >
      What is generated, less what the wires lose, plus what is imported, is
      what is served. A scenario that misses this is a scenario that does not
      clear, however cheap it is.
    system: energy_balance
    lhs: "generation_twh * (1 - transmission_loss_fraction) + net_imports_twh"
    rhs: "equilibrium_demand_twh"
    parameters: [generation_twh, transmission_loss_fraction, net_imports_twh, equilibrium_demand_twh]
    determined_variables: [generation_twh]
    tolerance: 1.0e-9
    linearity: linear
    solution_method: direct
    priority: P1

  # -- System 4: Demand-Supply Equilibrium -----------------------------

  equilibrium_demand:
    name: "Demand at the tariff"
    description: >
      Demand after the tariff moves, at a constant elasticity. The reason a
      tariff rise is not a free fiscal move: it is also a demand forecast.
    system: demand_supply
    lhs: "equilibrium_demand_twh"
    rhs: "demand_twh * (tariff_usd_per_mwh / reference_tariff_usd_per_mwh) ** price_elasticity"
    parameters: [equilibrium_demand_twh, demand_twh, tariff_usd_per_mwh, reference_tariff_usd_per_mwh, price_elasticity]
    determined_variables: [equilibrium_demand_twh]
    tolerance: 1.0e-9
    linearity: nonlinear
    solution_method: direct
    priority: P2

  # -- System 5: Financial Identities ----------------------------------

  wacc_definition:
    name: "Weighted average cost of capital"
    description: >
      The blend of debt and equity, with interest shielded by tax. This is why
      the discount rate is derived: the blend and the rate are one quantity.
    system: financial
    lhs: "discount_rate"
    rhs: "debt_fraction * cost_of_debt * (1 - tax_rate) + (1 - debt_fraction) * cost_of_equity"
    parameters: [discount_rate, debt_fraction, cost_of_debt, tax_rate, cost_of_equity]
    determined_variables: [discount_rate]
    tolerance: 1.0e-9
    reference: "Standard WACC with the interest tax shield"
    linearity: linear
    solution_method: direct
    priority: P1

  cfads_definition:
    name: "Cash available for debt service"
    description: >
      Tariff less marginal cost, over the energy one kilowatt sells in a year.
      A stated simplification: the tariff is the single buyer's whole revenue,
      not the generator's share of it.
    system: financial
    lhs: "cfads_usd_per_kw_year"
    rhs: "(tariff_usd_per_mwh - marginal_cost_usd_per_mwh) * 8760 * capacity_factor / 1000"
    parameters: [cfads_usd_per_kw_year, tariff_usd_per_mwh, marginal_cost_usd_per_mwh, capacity_factor]
    determined_variables: [cfads_usd_per_kw_year]
    tolerance: 1.0e-9
    linearity: linear
    solution_method: direct
    priority: P2

  debt_service_definition:
    name: "Debt service"
    description: "The annuity a lender is repaid per kilowatt of debt-financed capex."
    system: financial
    lhs: "debt_service_usd_per_kw_year"
    rhs: "debt_fraction * capex_usd_per_kw * cost_of_debt * (1 + cost_of_debt) ** asset_life / ((1 + cost_of_debt) ** asset_life - 1)"
    parameters: [debt_service_usd_per_kw_year, debt_fraction, capex_usd_per_kw, cost_of_debt, asset_life]
    determined_variables: [debt_service_usd_per_kw_year]
    tolerance: 1.0e-9
    linearity: nonlinear
    solution_method: direct
    priority: P2

  dscr_definition:
    name: "Debt service coverage ratio"
    description: "Cash available against the debt service the gearing implies."
    system: financial
    lhs: "project_gearing_dscr"
    rhs: "cfads_usd_per_kw_year / debt_service_usd_per_kw_year"
    parameters: [project_gearing_dscr, cfads_usd_per_kw_year, debt_service_usd_per_kw_year]
    determined_variables: [project_gearing_dscr]
    tolerance: 1.0e-9
    linearity: nonlinear
    solution_method: direct
    priority: P2

  dscr_requirement:
    name: "DSCR floor"
    description: >
      The coverage a lender requires. A build that clears the physics and the
      cost can still be one no lender will finance, which is what this states.
    system: financial
    lhs: "project_gearing_dscr"
    rhs: "dscr_min"
    relation: geq
    parameters: [project_gearing_dscr, dscr_min]
    tolerance: 1.0e-6
    linearity: linear
    solution_method: numeric
    priority: P1

  # -- System 6: Learning Curves ---------------------------------------

  learning_curve:
    name: "Learning curve"
    description: >
      Cost falls with cumulative deployment at a stated learning rate, as a
      power law in the doubling count. The one system whose equation is
      non-linear in every parameter.
    system: learning
    lhs: "capex_learning_usd_per_kw"
    rhs: "capex_usd_per_kw * (cumulative_capacity_mw / cumulative_capacity_reference_mw) ** (log(1 - learning_rate) / log(2))"
    parameters: [capex_learning_usd_per_kw, capex_usd_per_kw, cumulative_capacity_mw, cumulative_capacity_reference_mw, learning_rate]
    determined_variables: [capex_learning_usd_per_kw]
    tolerance: 1.0e-9
    reference: "Wright's law; cf. IRENA renewable cost statistics"
    linearity: nonlinear
    solution_method: direct
    priority: P1

  lcoe_learning_definition:
    name: "LCOE at learning-adjusted capex"
    description: "The same LCOE identity, over the capex the learning curve leaves."
    system: learning
    lhs: "lcoe_learning_usd_per_mwh"
    rhs: "capex_learning_usd_per_kw * crf * 1000 / (8760 * capacity_factor) + marginal_cost_usd_per_mwh"
    parameters: [lcoe_learning_usd_per_mwh, capex_learning_usd_per_kw, crf, capacity_factor, marginal_cost_usd_per_mwh]
    determined_variables: [lcoe_learning_usd_per_mwh]
    tolerance: 1.0e-9
    linearity: nonlinear
    solution_method: direct
    priority: P2

  # -- System 8: System Inertia ----------------------------------------

  rocof_definition:
    name: "Rate of change of frequency"
    description: >
      The swing equation's first instant: the largest credible loss divided by
      twice the stored kinetic energy. Bounds the instantaneous renewable
      share, because inverters store no kinetic energy.
    system: inertia
    lhs: "rocof_df_dt_hz_per_s"
    rhs: "largest_loss_mw / (2 * system_inertia_mws)"
    parameters: [rocof_df_dt_hz_per_s, largest_loss_mw, system_inertia_mws]
    determined_variables: [rocof_df_dt_hz_per_s]
    tolerance: 1.0e-9
    reference: "Swing equation at t=0, df/dt = -P_loss / (2 H S)"
    linearity: linear
    solution_method: direct
    priority: P1

  inertia_requirement:
    name: "RoCoF limit"
    description: "The frequency slope the protection settings tolerate before tripping."
    system: inertia
    lhs: "rocof_limit_hz_per_s"
    rhs: "rocof_df_dt_hz_per_s"
    relation: geq
    parameters: [rocof_limit_hz_per_s, rocof_df_dt_hz_per_s]
    tolerance: 1.0e-6
    linearity: linear
    solution_method: numeric
    priority: P1

  # -- System 10: Reliability ------------------------------------------

  unserved_definition:
    name: "Expected unserved energy"
    description: "Demand times the fraction the system is expected to fail to serve."
    system: reliability
    lhs: "unserved_energy_gwh"
    rhs: "equilibrium_demand_twh * expected_unserved_fraction * 1000"
    parameters: [unserved_energy_gwh, equilibrium_demand_twh, expected_unserved_fraction]
    determined_variables: [unserved_energy_gwh]
    tolerance: 1.0e-9
    linearity: linear
    solution_method: direct
    priority: P2

  reliability_cost_definition:
    name: "Reliability cost"
    description: >
      The value of the energy the system fails to serve. A reliability standard
      is a purchase, and this is its price.
    system: reliability
    lhs: "reliability_cost_usd"
    rhs: "unserved_energy_gwh * 1000 * voll_usd_per_mwh"
    parameters: [reliability_cost_usd, unserved_energy_gwh, voll_usd_per_mwh]
    determined_variables: [reliability_cost_usd]
    tolerance: 1.0e-9
    linearity: linear
    solution_method: direct
    priority: P2

  # -- System 11: Carbon Trajectory ------------------------------------

  emissions_definition:
    name: "Annual emissions"
    description: "Generation times an emission factor. One terawatt-hour is one million megawatt-hours, so this reads directly in megatonnes."
    system: carbon_trajectory
    lhs: "emissions_mtco2_per_year"
    rhs: "generation_twh * emission_factor_t_per_mwh"
    parameters: [emissions_mtco2_per_year, generation_twh, emission_factor_t_per_mwh]
    determined_variables: [emissions_mtco2_per_year]
    tolerance: 1.0e-9
    linearity: linear
    solution_method: direct
    priority: P1

  carbon_budget_ratio_definition:
    name: "Budget ratio"
    description: "Emissions over the horizon against the budget. Above one, the trajectory misses."
    system: carbon_trajectory
    lhs: "carbon_budget_ratio"
    rhs: "emissions_mtco2_per_year * horizon_years / carbon_budget_mtco2"
    parameters: [carbon_budget_ratio, emissions_mtco2_per_year, horizon_years, carbon_budget_mtco2]
    determined_variables: [carbon_budget_ratio]
    tolerance: 1.0e-9
    linearity: linear
    solution_method: direct
    priority: P2

  carbon_budget_constraint:
    name: "Carbon budget"
    description: >
      A cumulative budget over a horizon is a constraint on the whole path, not
      on any one year, which is why it is an inequality and not a derivation.
    system: carbon_trajectory
    lhs: "carbon_budget_mtco2"
    rhs: "emissions_mtco2_per_year * horizon_years"
    relation: geq
    parameters: [carbon_budget_mtco2, emissions_mtco2_per_year, horizon_years]
    tolerance: 1.0e-6
    linearity: linear
    solution_method: numeric
    priority: P1

  # -- System 12: Affordability ----------------------------------------

  energy_burden_definition:
    name: "Energy burden"
    description: >
      The share of household income spent on electricity. The system that stops
      a scenario being cost-optimal and socially impossible at once.
    system: affordability
    lhs: "energy_burden"
    rhs: "tariff_usd_per_mwh * household_consumption_mwh_per_year / household_income_usd_per_year"
    parameters: [energy_burden, tariff_usd_per_mwh, household_consumption_mwh_per_year, household_income_usd_per_year]
    determined_variables: [energy_burden]
    tolerance: 1.0e-9
    linearity: linear
    solution_method: direct
    priority: P1

  affordability_constraint:
    name: "Affordability limit"
    description: "The burden above which a tariff is politically impossible, whatever its LCOE."
    system: affordability
    lhs: "energy_burden_limit"
    rhs: "energy_burden"
    relation: geq
    parameters: [energy_burden_limit, energy_burden]
    tolerance: 1.0e-6
    linearity: linear
    solution_method: numeric
    priority: P1

  # -- System 9: Water-Energy Nexus ------------------------------------

  cooling_water_definition:
    name: "Cooling water demand"
    description: "Water the thermal fleet withdraws, per megawatt-hour generated."
    system: water_energy
    lhs: "cooling_water_demand_m3"
    rhs: "generation_twh * 1000000 * cooling_water_m3_per_mwh"
    parameters: [cooling_water_demand_m3, generation_twh, cooling_water_m3_per_mwh]
    determined_variables: [cooling_water_demand_m3]
    tolerance: 1.0e-9
    linearity: linear
    solution_method: direct
    priority: P2

  hydrogen_water_definition:
    name: "Hydrogen water demand"
    description: "Water the hydrogen programme consumes over the year."
    system: water_energy
    lhs: "hydrogen_water_demand_m3"
    rhs: "hydrogen_production_kt_per_year * 1000000 * hydrogen_water_m3_per_kg"
    parameters: [hydrogen_water_demand_m3, hydrogen_production_kt_per_year, hydrogen_water_m3_per_kg]
    determined_variables: [hydrogen_water_demand_m3]
    tolerance: 1.0e-9
    linearity: linear
    solution_method: direct
    priority: P2

  water_availability_constraint:
    name: "Water availability"
    description: >
      Cooling and hydrogen demand together against what the catchment makes
      available. A build that clears on cost can still be one the catchment
      cannot supply.
    system: water_energy
    lhs: "water_availability_m3"
    rhs: "cooling_water_demand_m3 + hydrogen_water_demand_m3"
    relation: geq
    parameters: [water_availability_m3, cooling_water_demand_m3, hydrogen_water_demand_m3]
    tolerance: 1.0e-6
    linearity: linear
    solution_method: numeric
    priority: P2

  # -- System 12: Employment -------------------------------------------

  direct_jobs_definition:
    name: "Direct jobs"
    description: "Construction and O&M jobs the installed fleet supports."
    system: employment
    lhs: "direct_jobs"
    rhs: "total_capacity_mw * (construction_jobs_per_mw + om_jobs_per_mw)"
    parameters: [direct_jobs, total_capacity_mw, construction_jobs_per_mw, om_jobs_per_mw]
    determined_variables: [direct_jobs]
    tolerance: 1.0e-9
    linearity: linear
    solution_method: direct
    priority: P2

  total_jobs_definition:
    name: "Total jobs"
    description: "Direct employment plus what the supply chain and the wage bill support."
    system: employment
    lhs: "total_jobs"
    rhs: "direct_jobs * (1 + indirect_jobs_multiplier + induced_jobs_multiplier)"
    parameters: [total_jobs, direct_jobs, indirect_jobs_multiplier, induced_jobs_multiplier]
    determined_variables: [total_jobs]
    tolerance: 1.0e-9
    linearity: linear
    solution_method: direct
    priority: P2

  # -- System 13: Health Impact ----------------------------------------

  premature_deaths_definition:
    name: "Premature deaths"
    description: >
      Exposed population times baseline mortality times the relative risk the
      particulate burden adds. The concentration-response function, linearised.
    system: health
    lhs: "premature_deaths_per_year"
    rhs: "exposed_population * baseline_mortality_rate * pm25_kt_per_year * pm25_relative_risk_per_kt"
    parameters: [premature_deaths_per_year, exposed_population, baseline_mortality_rate, pm25_kt_per_year, pm25_relative_risk_per_kt]
    determined_variables: [premature_deaths_per_year]
    tolerance: 1.0e-9
    reference: "Linearised concentration-response; cf. WHO AirQ+ methodology"
    linearity: linear
    solution_method: direct
    priority: P2

  dalys_definition:
    name: "DALYs"
    description: "Years of life lost per premature death, which is the burden the emissions cost in health."
    system: health
    lhs: "dalys_per_year"
    rhs: "premature_deaths_per_year * years_of_life_lost"
    parameters: [dalys_per_year, premature_deaths_per_year, years_of_life_lost]
    determined_variables: [dalys_per_year]
    tolerance: 1.0e-9
    linearity: linear
    solution_method: direct
    priority: P2

  # -- System 20: PPA Pricing ------------------------------------------

  ppa_price_definition:
    name: "PPA price"
    description: >
      Cost plus the risk premium and the sponsor's return, divided by
      availability. The price a project signs at, which is not its LCOE: the
      two differ by exactly the risk the offtaker will not carry.
    system: ppa_pricing
    lhs: "ppa_price_usd_per_mwh"
    rhs: "(lcoe_usd_per_mwh * (1 + offtake_risk_premium + equity_return_target)) / ppa_availability"
    parameters: [ppa_price_usd_per_mwh, lcoe_usd_per_mwh, offtake_risk_premium, equity_return_target, ppa_availability]
    determined_variables: [ppa_price_usd_per_mwh]
    tolerance: 1.0e-9
    linearity: linear
    solution_method: direct
    priority: P2

