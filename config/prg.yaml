  llcr_definition:
    name: Loan life coverage ratio
    description: 'Cash available over the loan life, discounted, against debt outstanding. Dimensional
      check: (USD/kW/year) / (USD/kW) is 1/year, times years is dimensionless -- which is what a coverage
      ratio is. The debt outstanding is the debt-financed share of capex.'
    system: financial
    lhs: llcr_estimate
    rhs: cfads_usd_per_kw_year / (debt_fraction * capex_usd_per_kw) * (1 - (1 + cost_of_debt) ** (0 -
      debt_tenor)) / cost_of_debt
    relation: eq
    parameters:
    - cfads_usd_per_kw_year
    - debt_fraction
    - capex_usd_per_kw
    - cost_of_debt
    - debt_tenor
    free_variables:
    - cfads_usd_per_kw_year
    - debt_fraction
    - capex_usd_per_kw
    - cost_of_debt
    - debt_tenor
    determined_variables:
    - llcr_estimate
    tolerance: 1.0e-08
    unit_check: false
    reference: null
    priority: P2
    solution_method: direct
    linearity: nonlinear
    latex: null
  lng_price_per_mwh_definition:
    name: lng price per mwh (computed)
    description: 'LNG trades on the same Btu basis as pipeline gas; the MWh conversion multiplies by the
      Btu content per MWh (the inverse of 0.29307 MWh/MMBtu). The conversion is dimensional: a price over
      an energy basis scales by the unit''s own MWh content.'
    system: cost_accounting
    lhs: lng_price_per_mwh
    rhs: lng_price * mwh_per_lng_unit
    relation: eq
    parameters:
    - lng_price_per_mwh
    - lng_price
    - mwh_per_lng_unit
    free_variables:
    - lng_price
    - mwh_per_lng_unit
    determined_variables:
    - lng_price_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    reference: 'Physical constant: 1 MMBtu = 0.29307 MWh (HHV)'
    priority: P1
    solution_method: direct
    linearity: linear
    latex: \mathrm{lng}_{price\_per\_mwh} = \mathrm{lng}_{price} \mathrm{mwh}_{per\_lng\_unit}
  load_factor_definition:
    name: Load factor
    description: 'Annual demand divided by peak demand times 8760. Dimensional check: TWh times 1e6 is
      MWh/year, divided by (MW times hours/year) is dimensionless. The 1e6 converts TWh to MWh.'
    system: energy_balance
    lhs: load_factor
    rhs: (demand_twh * 1000000) / (peak_demand_mw * 8760)
    relation: eq
    parameters:
    - demand_twh
    - peak_demand_mw
    free_variables:
    - demand_twh
    - peak_demand_mw
    determined_variables:
    - load_factor
    tolerance: 1.0e-09
    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: nonlinear
    latex: null
  local_employment_targets_bound:
    name: Local, women and youth employment shares are bounded together
    description: 'The three employment shares are overlapping measures over one workforce: a woman employed
      locally who is also young is counted in all three. Their sum is therefore bounded at 2.0 rather
      than at 1.0 -- two overlaps are expected and a third is not, so a scenario above the bound has counted
      someone in more categories than the workforce has.'
    system: employment
    lhs: local_employment_share + women_employment_share + youth_employment_share
    rhs: '2.0'
    relation: leq
    parameters:
    - local_employment_share
    - women_employment_share
    - youth_employment_share
    free_variables: []
    determined_variables: []
    tolerance: 1.0e-06
    unit_check: true
    reference: null
    priority: P2
    solution_method: numeric
    linearity: linear
    latex: \mathrm{local}_{employment\_share} + \mathrm{women}_{employment\_share} + \mathrm{youth}_{employment\_share}
      \leq 2
  local_jobs_definition:
    name: Local jobs
    description: 'Direct employment at the local-content share. Dimensional check: jobs times a dimensionless
      share is jobs.'
    system: employment
    lhs: local_jobs
    rhs: direct_jobs * local_content_requirement
    relation: eq
    parameters:
    - direct_jobs
    - local_content_requirement
    free_variables:
    - direct_jobs
    - local_content_requirement
