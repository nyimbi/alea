# ALEA default configuration.
#
# Every key here is also a model default in src/alea/config/models.py. This file
# exists so that a deployment can see, in one place, what it is running with —
# and so that a scenario overlay has something to overlay.
#
# Precedence, lowest to highest: model defaults, this file, the environment file
# named by --config, the scenario overlay named by --scenario, --set overrides.

scenario:
  # ISO 3166-1 alpha-2. The registry refuses an unregistered code.
  countries: [KE]
  # Spatial clusters per horizon. Ascending.
  clusters: [55]
  planning_horizons: [2030, 2040, 2050, 2060]
  base_year: 2025

predictive:
  # Layer 4a. Every parameter an outage-detection number is a function of is
  # here, because 07-layer4 §2.5 is explicit: an AUC without its VZA bin size,
  # quantile and threshold is not reproducible.
  viirs:
    # Viewing-zenith-angle bin width, the specification's 5 deg to 70 deg.
    bin_size_deg: 5.0
    # First quartile, not the mean: robust to lunar reflection and fires while
    # keeping sensitivity to darkening.
    baseline_quantile: 0.25
    # A pixel is flagged when radiance < threshold x baseline.
    detection_threshold: 0.6
    # QF_Cloud_Mask bits 0-1 ceiling. 0 keeps confident-clear only; anything
    # wider admits probably-cloudy pixels, which read as "no outage".
    max_cloud_confidence: 0
  weather:
    # cyclical = sin/cos of the month, no hemisphere assumption. `integer` is
    # the specification's form and is backwards south of the equator.
    month_encoding: cyclical
    # Lagged by one hour, never zero: an unshifted feature contains the hour it
    # predicts.
    outage_history_window_hours: 720
    scale_pos_weight: 10.0
  maintenance:
    # Refuse to fit without dissolved-gas columns, so a maintenance number is
    # not transformer age wearing a maintenance label.
    require_dga: true

losses:
  # Value of a lost MWh. Mitigation payback divides by it, and the plan's §7 is
  # explicit that a single-snapshot payback is "a number with no error bar that
  # will be believed" -- so the price it is computed from must be settable.
  # 0.0 means a payback is reported as NaN with a note, never as `inf`.
  price_usd_per_mwh: 0.0
  # Hours each snapshot represents. A DC solve returns a loss in MW for one
  # snapshot; every `*_mwh` field is that MW summed over snapshots, which is MWh
  # only when a snapshot is one hour. Any other resolution must be stated here
  # or every loss is silently scaled.
  snapshot_hours: 1.0

resilience:
  # §8: "The threshold is config, recorded, and reported with the metric." A
  # 30-second reclosure is not an interruption, and two SAIDI figures at
  # different thresholds are different quantities sharing a name.
  interruption_threshold_minutes: 5.0
  # Persons per household, for the WorldPop customer derivation. A proxy, and
  # labelled as one wherever the derived count is published.
  average_household_size: 4.5
  # Fraction of households connected. Below 1 the customer count is a fraction
  # of the population-derived households, which is itself a proxy.
  electrification_rate: 1.0

market:
  # What a MWh of unserved energy is worth. `market.clearing` prices a
  # shortfall at this rate, so it *is* the clearing price of every hour the
  # system sheds load, and it is the one market parameter no layer produces.
  # 2000.0 is the figure `tests/determinism/run.py` has used since the
  # determinism job was written.
  value_of_lost_load_usd_per_mwh: 2000.0
  # Where the rate came from. A VoLL is an assumption, not a measurement:
  # survey-based and production-function estimates differ by an order of
  # magnitude, so a reader has to be able to tell a defaulted rate from a
  # sourced one. Move the rate and this must move with it.
  value_of_lost_load_basis: config.market.value_of_lost_load_usd_per_mwh

solve:
  solver: highs
  # Losses are on. The PyPSA-Eur benchmark (neglecting losses overestimates
  # optimal expansion by ~20%) is [UNVERIFIED] for African networks and is
  # confirmed at M1 by solving Kenya both ways.
  transmission_losses: true
  linearized_unit_commitment: false
  multi_investment_periods: true
  # 1 means full hourly resolution. Any value above 1 requires a passing
  # aggregation validation artefact for the network (AD-9).
  time_aggregation: 1
  solver_options: {}
  solver_timeout_s: 3600

sector:
  enabled: false
  hydrogen_enabled: false
  electrolyser_efficiency_lhv: 0.65
  # Required whenever hydrogen_enabled. An efficiency nobody can trace is how a
  # hydrogen result becomes indefensible.
  electrolyser_efficiency_source: ""
  hydrogen_export_twh_per_year: 0.0
  heat_pumps_enabled: false
  heat_pump_cop: 3.0
  heat_pump_cop_source: ""
  ev_smart_charging: false
  v2g_enabled: false
  # Required > 0 whenever v2g_enabled: free storage is not a modelling result.
  v2g_degradation_usd_per_mwh: 0.0
  industry_steel: false
  industry_cement: false
  industry_chemicals: false

costs:
  base_currency: USD
  # A rate without its date is not a rate. Both or neither.
  eur_usd: null
  eur_usd_date: null
  kes_usd: null
  kes_usd_date: null

scanning:
  enabled: false
  raw_text_retention_days: 90
  dedup_threshold: 0.7
  dedup_num_perm: 128
  # Required. Python's hash() is randomised per process, so an unseeded MinHash
  # gives a different dedup result on every run.
  dedup_seed: 0
  llm_model: claude-sonnet-5-5
  llm_temperature: 0.0
  llm_cache: true
  # null means every signal is reviewed by a human. A threshold is introduced
  # only after a measured precision justifies it, per signal type.
  auto_accept_threshold: null

reporting:
  enabled: false
  timezone: UTC
  email_enabled: false
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  email_from: ""
  daily_hour: 6
  weekly_day: mon
  pdf_enabled: true

api:
  enabled: false
  title: ALEA API
  version: 0.1.0
  rate_limit_per_minute: 60
  job_store_path: results/jobs.sqlite
  cache_ttl_seconds: 3600

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  resources: resources
  results: results
  reports: reports
  models: models

logging:
  level: INFO
  json_output: false

renewables: {}
