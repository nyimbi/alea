  industrial_demand_twh:
    name: industrial demand
    description: 'Sector demand at the bottom-up synthesis the catalog states: the sector''s share of
      the fleet-served demand, over the total. The share is a policy and settlement dial; the demand is
      what the sector''s own metering would report.'
    category: Demand-Side
    type: float
    unit: TWh
    range:
    - 0.0
    - 20000.0
    role: derived
    determinism: fixed
