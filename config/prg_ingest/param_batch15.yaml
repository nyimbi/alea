    users:
    - Planners
    - Utilities
  agricultural_demand_twh:
    name: agricultural demand
    description: 'Sector demand at the bottom-up synthesis the catalog states: the sector''s share of
      the fleet-served demand, over the total. The share is a policy and settlement dial; the demand is
      what the sector''s own metering would report.'
    category: Demand-Side
    type: float
    unit: TWh
    range:
    - 0.0
    - 20000.0
    role: derived
    determinism: fixed
    priority: P1
    status: existing
    source: Bottom-up load synthesis (the catalog's own method cell)
    users:
    - Planners
    - Utilities
  gdp_growth:
    name: GDP growth rate
    description: Annual real GDP growth the scenario carries. Bounded to refuse a value that would compound
      to a nonsense economy over a 30-year horizon; 0.05 is the East-African reference decade.
    category: Macro
    type: float
    unit: 1/year
    range:
    - 0.0
    - 0.15
    default: 0.05
    role: free
    determinism: policy
    priority: P1
    status: existing
    source: World Bank national accounts; the reference decade
    users:
    - Planners
    - Investors
  income_elasticity:
    name: Income elasticity of electricity demand
    description: 'The rate electricity demand grows with income. Empirical range: 0.59 average across
      reviewed countries (EIA/Stanford EMF), 0.85 for China (Hou & Tan 2008), 0.88-0.95 for the electricity-specific
      long run (Burke & Csereklyei 2016); electrifying economies land at or above 1 and converge down.
      The default is the reviewed cross-country average; the range is the literature band.'
    category: Macro
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.9
    default: 0.65
    role: free
    determinism: policy
    priority: P1
    status: existing
    source: Burke & Csereklyei 2016; EIA/Stanford EMF demand elasticities; Hou & Tan 2008
    users:
    - Planners
  demand_growth_implied:
    name: Demand growth implied by the macro driver
    description: 'Log-linear implication of the income elasticity on GDP growth: (1 + g_D) = (1 + g_Y)
      ^ eps. What electricity demand grows at if it grows with income and nothing else; the dial the planner
      sets is checked against it, not replaced by it.'
    category: Macro
    type: float
    unit: 1/year
    range:
    - 0.0
    - 0.3
    role: derived
    determinism: fixed
    priority: P1
    status: existing
    source: Burke & Csereklyei 2016; EIA/Stanford EMF demand elasticities
    users:
    - Planners
equations:
  wacc_alias:
    id: wacc_alias
    name: WACC is the discount rate
    description: The catalog's WACC row and the financial block's discount rate are one quantity, so the
      duplicate derives from the computed one and the graph keeps a single blend. An equality between
      two ids for one number is the closure that keeps a scenario setting either name consistent; the
      alternative -- deprecating the id -- loses the label a report may cite.
    system: financial
    lhs: weighted_average_cost_of_capital
    rhs: discount_rate
    relation: eq
    parameters:
    - weighted_average_cost_of_capital
    - discount_rate
    free_variables:
    - discount_rate
    determined_variables:
    - weighted_average_cost_of_capital
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: Standard WACC with the interest tax shield
    latex: \mathrm{WACC} = \mathrm{discount\_rate}
  regulatory_asset_base_definition:
    id: regulatory_asset_base_definition
    name: Regulated asset base from the fleet
    description: Gross fleet capital less what the books have written down. The gross capital is the capacity-weighted
      capex; the 1000 converts kW-per-MW and the million converts USD. A fraction the regulator's roll-forward
      states, not one the model invents.
    system: financial
    lhs: regulatory_asset_base
    rhs: capex_usd_per_kw * total_capacity_mw * (1 - accumulated_depreciation_fraction) / 1000
    relation: eq
    parameters:
    - regulatory_asset_base
    - capex_usd_per_kw
    - total_capacity_mw
    - accumulated_depreciation_fraction
    free_variables:
    - capex_usd_per_kw
    - total_capacity_mw
    - accumulated_depreciation_fraction
    determined_variables:
    - regulatory_asset_base
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: Ofwat PR24 Appendix 11, allowed return on capital
    latex: \mathrm{RAB} = \mathrm{capex} \cdot C_{MW} \cdot 10^3 \cdot (1 - d_{acc}) \, /\, 10^6
  regulatory_depreciation_definition:
    id: regulatory_depreciation_definition
    name: Regulatory depreciation
    description: Straight-line write-down of the asset base over the regulatory asset life. The rate-of-return
      revenue requirement's first term; the second is the return on the base below.
    system: financial
    lhs: regulatory_depreciation
    rhs: regulatory_asset_base / depreciation_life_by_asset
    relation: eq
    parameters:
    - regulatory_depreciation
    - regulatory_asset_base
    - depreciation_life_by_asset
    free_variables:
    - depreciation_life_by_asset
    determined_variables:
    - regulatory_depreciation
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: Ofwat PR24 Appendix 11, allowed return on capital
    latex: D_{reg} = \mathrm{RAB} / L_{reg}
  allowed_revenue_requirement_definition:
    id: allowed_revenue_requirement_definition
    name: Allowed revenue requirement
    description: Depreciation plus the allowed return on the base, with that return taken as the blend
      the financial block computes -- the vanilla regulatory WACC the UKRN guidance builds. A tariff that
      recovers less than this under-recovers the utility; the revenue cap and the applied tariff are the
      instruments around it.
    system: financial
    lhs: allowed_revenue_requirement
    rhs: regulatory_depreciation + regulatory_asset_base * discount_rate
    relation: eq
    parameters:
    - allowed_revenue_requirement
    - regulatory_depreciation
    - regulatory_asset_base
    - discount_rate
    free_variables:
    - regulatory_depreciation
    - regulatory_asset_base
    determined_variables:
    - allowed_revenue_requirement
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: UKRN cost of capital guidance (2023), §allowed returns
    latex: R^* = D_{reg} + \mathrm{RAB} \cdot \mathrm{WACC}
  cost_of_debt_capped:
    id: cost_of_debt_capped
    name: Debt cost within the allowed return
    description: 'The regulator''s debt allowance binds the commercial cost of debt the scenario may assume:
      a component priced above the allowed return is the pass-through the cap regime forbids, so a scenario
      carrying it is inadmissible rather than silently under-recovering.'
    system: financial
    lhs: cost_of_debt
    rhs: allowed_return_on_debt
    relation: leq
    parameters:
    - cost_of_debt
    - allowed_return_on_debt
    free_variables:
    - cost_of_debt
    - allowed_return_on_debt
    tolerance: 1.0e-06
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: UKRN cost of capital guidance (2023), §overall framework
    latex: K_d \le A_d
  cost_of_equity_capped:
    id: cost_of_equity_capped
    name: Equity cost within the allowed return
    description: 'The equity-return allowance binds the cost of equity: the CAPM-estimated return a project
      demands cannot exceed what the regulatory settlement awards.'
    system: financial
    lhs: cost_of_equity
    rhs: allowed_return_on_equity
    relation: leq
    parameters:
    - cost_of_equity
    - allowed_return_on_equity
    free_variables:
    - cost_of_equity
    - allowed_return_on_equity
    tolerance: 1.0e-06
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: Ofwat PR24 Appendix 11, allowed return on capital
    latex: K_e \le A_e
  applied_tariff_definition:
    id: applied_tariff_definition
    name: Applied tariff under the cap
    description: The revenue cap's multiplier applied to the cost-recovery tariff. A cap below 1.0 withholds
      part of the revenue requirement -- the incentive instrument a price-control settlement actually
      sets -- and a cap above 1.0 is a premium the accounts must carry.
    system: price_demand
    lhs: applied_tariff_usd_per_mwh
    rhs: regulated_tariff_usd_per_mwh * revenue_cap
    relation: eq
    parameters:
    - applied_tariff_usd_per_mwh
    - regulated_tariff_usd_per_mwh
    - revenue_cap
    free_variables:
    - revenue_cap
    determined_variables:
    - applied_tariff_usd_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: World Bank Regulation of Utilities handbook, revenue caps
    latex: p_{applied} = p_{cr} \cdot x_{cap}
  residential_demand_definition:
    id: residential_demand_definition
    name: Residential demand
    description: 'The share times the demand it is a share OF. A share with no numerator is a word; with
      the total demand as its base it is a quantity the metering checks the synthesis against. Units:
      a dimensionless share times TWh is TWh.'
    system: demand_supply
    lhs: residential_demand_twh
    rhs: residential_demand_share * base_demand_twh
    relation: eq
    parameters:
    - residential_demand_twh
    - residential_demand_share
    - base_demand_twh
    free_variables:
    - residential_demand_share
    - base_demand_twh
    determined_variables:
    - residential_demand_twh
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: Bottom-up load synthesis (catalog method cell)
    latex: D_{\mathrm{residential}} = s_{\mathrm{residential}} \cdot D_{\mathrm{total}}
  commercial_demand_definition:
    id: commercial_demand_definition
    name: Commercial demand
    description: 'The share times the demand it is a share OF. A share with no numerator is a word; with
      the total demand as its base it is a quantity the metering checks the synthesis against. Units:
      a dimensionless share times TWh is TWh.'
    system: demand_supply
    lhs: commercial_demand_twh
    rhs: commercial_demand_share * base_demand_twh
    relation: eq
    parameters:
    - commercial_demand_twh
    - commercial_demand_share
    - base_demand_twh
    free_variables:
    - commercial_demand_share
    - base_demand_twh
    determined_variables:
    - commercial_demand_twh
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: Bottom-up load synthesis (catalog method cell)
    latex: D_{\mathrm{commercial}} = s_{\mathrm{commercial}} \cdot D_{\mathrm{total}}
  industrial_demand_definition:
    id: industrial_demand_definition
    name: Industrial demand
    description: 'The share times the demand it is a share OF. A share with no numerator is a word; with
      the total demand as its base it is a quantity the metering checks the synthesis against. Units:
      a dimensionless share times TWh is TWh.'
    system: demand_supply
    lhs: industrial_demand_twh
    rhs: industrial_demand_share * base_demand_twh
    relation: eq
    parameters:
    - industrial_demand_twh
    - industrial_demand_share
    - base_demand_twh
    free_variables:
    - industrial_demand_share
    - base_demand_twh
    determined_variables:
    - industrial_demand_twh
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: Bottom-up load synthesis (catalog method cell)
    latex: D_{\mathrm{industrial}} = s_{\mathrm{industrial}} \cdot D_{\mathrm{total}}
  agricultural_demand_definition:
    id: agricultural_demand_definition
    name: Agricultural demand
    description: 'The share times the demand it is a share OF. A share with no numerator is a word; with
      the total demand as its base it is a quantity the metering checks the synthesis against. Units:
      a dimensionless share times TWh is TWh.'
    system: demand_supply
    lhs: agricultural_demand_twh
    rhs: agricultural_demand_share * base_demand_twh
    relation: eq
    parameters:
    - agricultural_demand_twh
    - agricultural_demand_share
    - base_demand_twh
    free_variables:
    - agricultural_demand_share
    - base_demand_twh
    determined_variables:
    - agricultural_demand_twh
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: Bottom-up load synthesis (catalog method cell)
    latex: D_{\mathrm{agricultural}} = s_{\mathrm{agricultural}} \cdot D_{\mathrm{total}}
  demand_growth_implied_definition:
    id: demand_growth_implied_definition
    name: Implied demand growth
    description: 'The elasticity''s own implication: demand grows with income at the income elasticity,
      in the log-linear form the growth literature uses. A dimensionless base to a dimensionless power
      is dimensionless; the 1/year unit is the growth rate''s own.'
    system: demand_supply
    lhs: demand_growth_implied
    rhs: (1 + gdp_growth) ** income_elasticity - 1
    relation: eq
    parameters:
    - demand_growth_implied
    - gdp_growth
    - income_elasticity
    free_variables:
    - gdp_growth
    - income_elasticity
    determined_variables:
    - demand_growth_implied
    tolerance: 1.0e-09
    unit_check: true
    solution_method: numeric
    linearity: nonlinear
    priority: P1
    reference: Burke & Csereklyei 2016; EIA/Stanford EMF demand elasticities
    latex: (1 + g_D) = (1 + g_Y)^{\varepsilon}
