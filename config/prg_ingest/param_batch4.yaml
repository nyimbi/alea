# Generated from docs/param_batch4.md by the parameter-equation ingestion.
# Merged onto config/prg.yaml by alea.prg.graph.load_ingested().
#
# Repairs applied to the batch as delivered:
#   R16: dropped equation 'mtbf_from_failure_rate_definition' and its two edges,
#        and reverted 'mean_time_between_failures' to `free`. The equation made
#        the derived subgraph CYCLIC -- it computed MTBF from
#        `forced_outage_rate`, which 'availability_definition' computes from
#        MTBF -- so the ingested graph could not propagate at all: every
#        `check_scenario` raised `CycleError ... form a cycle and have no
#        evaluation order`. Its arithmetic was also dimensionally incoherent and
#        said so itself: the description gives the dimensional check "1/(1/hour)
#        is hour", but the divisor is `forced_outage_rate`, unit `1`, so the RHS
#        is dimensionless. The equation the description actually wants divides by
#        a *failure rate* in 1/hour, and the graph carries no such node (only
#        `failure_rate_curve`, a dimensionless shape selector). The tell is that
#        it shipped with `unit_check: false` -- the check was switched off on the
#        one equation that needed it. Dropping it keeps 'availability_definition',
#        whose two inputs (`mean_time_to_repair`, `mean_time_between_failures`)
#        are then both free, and restores the shipped default for MTBF.
#   R17: 'availability_definition' described its result as "the steady-state
#        availability: the fraction of time the asset is up". MTTR/(MTBF+MTTR) is
#        the DOWN fraction, and the node it assigns to is `forced_outage_rate`,
#        an outage rate. The arithmetic is right and the description was its
#        complement; corrected to say unavailability.
#   R15: 17 nodes re-typed float -> bool were given the `default` this batch
#        omitted. `docs/param_ingest.md:78` requires a default on a free node and
#        the loader does not enforce it, so the omission loaded -- and because the
#        shipped graph had declared each of these `float` with `default: 500000.0`
#        on the `(0, 1e6)` placeholder, re-typing them to `bool` *removed* the
#        only value they had. `check_scenario` over a defaults-built set then
#        raised `the parameter set is missing [...]` for all 26 such nodes across
#        batches 4 and 7. The values are the ones `docs/what-if.md` documents for
#        each parameter, so nothing here is invented.
#   R11: dropped equation 'mtbf_from_history_definition' -- its own description declares it a placeholder that cannot load
#   R11: dropped equation 'saifi_from_outage_frequency_definition' -- it determines 'system_saifi_events_per_year', which 'saifi_definition' already determines
#   R11: dropped equation 'saidi_from_reliability_definition' -- it determines 'system_saidi_hours_per_year', which 'saidi_definition' already determines
#   R13: forced_outage_rate is determined by 'availability_definition'; role set to 'derived' and its default removed
#   R13: mean_time_between_failures is determined by 'mtbf_from_failure_rate_definition'; role set to 'derived' and its default removed
#   R13: remaining_useful_life is determined by 'remaining_life_from_condition_definition'; role set to 'derived' and its default removed
#   R7: forced_outage_rate is claimed by ['param_batch0.md', 'param_batch4.md']; this entry kept
#   R7: unit_commitment is claimed by ['param_batch4.md', 'param_batch7.md']; this entry kept
#   R4: dropped edge outage_frequency -> system_saifi_events_per_year -- cites 'saifi_from_outage_frequency_definition', which no equation declares
#   R4: dropped edge outage_duration -> system_saidi_hours_per_year -- cites 'saidi_from_reliability_definition', which no equation declares
#   R4: dropped edge outage_frequency -> system_saidi_hours_per_year -- cites 'saidi_from_reliability_definition', which no equation declares
#   R4: dropped edge mean_time_to_repair -> mean_time_between_failures -- cites 'mtbf_from_history_definition', which no equation declares
#   R9: dropped edge crew_availability -> mean_time_to_repair -- 'availability_definition' does not hold both endpoints (gate 6)
#   R9: dropped edge spare_parts_availability -> mean_time_to_repair -- 'availability_definition' does not hold both endpoints (gate 6)
#   R9: dropped edge maintenance_frequency -> planned_outage_rate -- 'availability_definition' does not hold both endpoints (gate 6)
#   R9: dropped edge regulatory_period_length -> regulatory_lag -- 'availability_definition' does not hold both endpoints (gate 6)
#   R9: dropped edge ppa_duration -> ppa_availability -- 'ppa_price_definition' does not hold both endpoints (gate 6)
#   R9: dropped edge regulatory_period_length -> revenue_cap -- 'tariff_cost_recovery' does not hold both endpoints (gate 6)
#   R9: dropped edge market_structure -> market_model -- 'tariff_cost_recovery' does not hold both endpoints (gate 6)
#   R3: dropped rule 'mtbf_mttr_inconsistent_with_availability' -- its condition needs a function call, which the cross-validation grammar refuses: abs(forced_outage_rate - mean_time_to_repair / (mean_time_between_failures + mean_time_to_repair)) > 0.05
parameters:
  mean_time_between_failures:
    name: Mean time between failures
    description: Expected operating hours between forced outages for a unit of the class the parameter
      describes. Range spans distribution equipment at the low end to transmission transformers at the
      high end. The shipped [0, 1e6] admitted a value that would imply a unit running for 114 years between
      failures, which for most equipment classes is a claim no asset register supports.
    category: Asset Condition & Lifecycle
    type: float
    unit: hours
    range:
    - 500.0
    - 500000.0
    default: 500000.0
    role: free
    determinism: stochastic
    priority: P1
    status: integrate
    source: IEEE Std 493 (Gold Book), CIGRE TB 509
    users:
    - Utilities
  mean_time_to_repair:
    name: Mean time to repair
    description: Expected hours from failure to restoration, for the class the parameter describes. The
      range spans a distribution fuse at the low end to a transmission transformer replacement at the
      high end.
    category: Asset Condition & Lifecycle
    type: float
    unit: hours
    range:
    - 1.0
    - 1000.0
    default: 24.0
    role: free
    determinism: stochastic
    priority: P1
    status: integrate
    source: IEEE Std 493 (Gold Book)
    users:
    - Utilities
  failure_rate_curve:
    name: Failure rate curve
    description: A scalar index of the failure-rate curve's shape — 0 for a flat exponential, 1 for a
      bathtub, 2 for wear-out dominated. Not the curve itself, which is a function and cannot be a scalar;
      this is the shape selector that a Weibull fit reduces to.
    category: Asset Condition & Lifecycle
    type: float
    unit: '1'
    range:
    - 0.0
    - 3.0
    default: 1.0
    role: free
    determinism: physical
    priority: P2
    status: integrate
    source: IEEE Std 493, Weibull shape parameter convention
    users:
    - Utilities
  remaining_useful_life:
    name: Remaining useful life
    description: Expected remaining years of service for the class of asset the parameter describes. Bounded
      above by the longest asset life in the sample and below by zero.
    category: Asset Condition & Lifecycle
    type: float
    unit: years
    range:
    - 0.0
    - 60.0
    role: derived
    determinism: physical
    priority: P1
    status: integrate
    source: Standard asset-management practice; cf. ISO 55000
    users:
    - Utilities
  asset_condition_index:
    name: Asset condition index
    description: A composite condition score, normalised to [0, 1] where 1 is as-new and 0 is end-of-life.
      The shipped [0, 1e6] admitted a value of 500,000, which is the index on a scale no methodology uses.
    category: Asset Condition & Lifecycle
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.7
    role: free
    determinism: physical
    priority: P1
    status: to_build
    source: Composite of condition monitoring, age and loading; normalised per ISO 55000 practice
    users:
    - Utilities
  forced_outage_rate_coal:
    name: Coal forced outage rate
    description: Fraction of hours the coal fleet is unavailable due to forced outage. A share; the shipped
      [0, 1e6] admitted a value 500,000 times the maximum.
    category: Supply-Side
    type: float
    unit: '1'
    range:
    - 0.0
    - 0.4
    default: 0.1
    role: free
    determinism: stochastic
    priority: P1
    status: to_build
    source: NERC Generating Availability Data System
    users:
    - Utilities
  forced_outage_rate_gas:
    name: Gas forced outage rate
    description: Fraction of hours the gas fleet is unavailable due to forced outage. Same shape as coal,
      lower central value because gas plants are simpler.
    category: Supply-Side
    type: float
    unit: '1'
    range:
    - 0.0
    - 0.3
    default: 0.06
    role: free
    determinism: stochastic
    priority: P1
    status: to_build
    source: NERC Generating Availability Data System
    users:
    - Utilities
  outage_duration:
    name: Average outage duration
    description: Mean hours per interruption event, at the system level. Distinct from the MTTR, which
      is per asset class; this is the customer's experience aggregated over the mix of causes.
    category: Outage
    type: float
    unit: hours
    range:
    - 0.5
    - 72.0
    default: 8.0
    role: free
    determinism: stochastic
    priority: P1
    status: to_build
    source: IEEE Std 1366 (distribution reliability)
    users:
    - Utilities
  outage_frequency:
    name: Outage frequency
    description: Average interruptions per year, at the system level. The shipped [0, 1e6] admitted 500,000
      interruptions a year.
    category: Outage
    type: float
    unit: events/year
    range:
    - 0.0
    - 100.0
    default: 12.0
    role: free
    determinism: stochastic
    priority: P1
    status: to_build
    source: IEEE Std 1366
    users:
    - Utilities
  outage_cause_distribution:
    name: Weather share of outages
    description: Share of interruption events attributable to weather. The graph carries one scalar and
      the sample contains four cause classes; this is the weather share, and a future batch should split
      it into weather, equipment, human and other.
    category: Outage
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.35
    role: free
    determinism: stochastic
    priority: P2
    status: to_build
    source: IEEE Std 1366, cause classification
    users:
    - Utilities
  maintenance_duration:
    name: Maintenance duration
    description: Mean hours per planned maintenance event. The high end is a major inspection; the low
      end is routine servicing.
    category: Operational
    type: float
    unit: hours
    range:
    - 2.0
    - 720.0
    default: 48.0
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: Standard utility maintenance practice
    users:
    - Utilities
  maintenance_frequency:
    name: Maintenance frequency
    description: Planned maintenance events per year, per unit or per asset class. The high end is a monthly
      cycle for critical equipment; the low end is annual.
    category: Operational
    type: float
    unit: events/year
    range:
    - 0.5
    - 12.0
    default: 2.0
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: Standard utility maintenance practice
    users:
    - Utilities
  crew_availability:
    name: Crew availability
    description: Share of hours a maintenance crew is available to the fleet. A share; the shipped [0,
      1e6] admitted a crew 500,000 times overstaffed.
    category: Outage
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.85
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: Utility operational data
    users:
    - Utilities
  spare_parts_availability:
    name: Spare parts availability
    description: Share of required spares available at the time they are needed. A share.
    category: Outage
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.8
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: Utility inventory data
    users:
    - Utilities
  regulatory_period_length:
    name: Regulatory period length
    description: Years between tariff reviews. Bounded below at 1 (annual review) and above at 10 (long-term
      concession). Four to five is the mode in the sample.
    category: Regulatory Finance
    type: float
    unit: years
    range:
    - 1.0
    - 10.0
    default: 5.0
    role: free
    determinism: policy
    priority: P1
    status: to_build
    source: World Bank Regulation of Utilities handbook
    users:
    - Regulators
  regulatory_lag:
    name: Regulatory lag
    description: Years between cost incurrence and its recovery in tariff. Bounded below at zero and above
      at the period length. A lag of 0 is contemporaneous recovery; the sample's central value is 1.
    category: Regulatory Finance
    type: float
    unit: years
    range:
    - 0.0
    - 5.0
    default: 1.0
    role: free
    determinism: policy
    priority: P2
    status: to_build
    source: World Bank Regulation of Utilities handbook
    users:
    - Regulators
  regulatory_asset_base:
    name: Regulatory asset base
    description: The stock of capital on which the regulated return is earned, at time zero. The unit
      is the same as capex — USD millions — because the RAB is a stock of capex, not a rate.
    category: Regulatory Finance
    type: float
    unit: USD million
    range:
    - 0.0
    - 500000.0
    default: 5000.0
    role: free
    determinism: policy
    priority: P1
    status: to_build
    source: Regulator's determination
    users:
    - Regulators
  regulatory_depreciation:
    name: Regulatory depreciation
    description: Annual depreciation charge the regulator allows, per year. The unit is USD million per
      year, not a rate; the depreciation rate is a separate parameter that a future batch should add.
    category: Regulatory Finance
    type: float
    unit: USD million/year
    range:
    - 0.0
    - 50000.0
    default: 250.0
    role: free
    determinism: policy
    priority: P1
    status: to_build
    source: Regulator's determination
    users:
    - Regulators
  allowed_return_on_equity:
    name: Allowed return on equity
    description: The regulatory cost of equity the tariff is allowed to recover. Bounded at the low end
      by the sovereign real yield and at the high end by the sovereign yield plus a country-risk premium
      plus an equity premium.
    category: Regulatory Finance
    type: float
    unit: 1/year
    range:
    - 0.03
    - 0.3
    default: 0.14
    role: free
    determinism: policy
    priority: P1
    status: to_build
    source: Regulator's determination; cf. AER Rate of Return Instrument
    users:
    - Regulators
  allowed_return_on_debt:
    name: Allowed return on debt
    description: The regulatory cost of debt the tariff is allowed to recover. Bounded by the sovereign
      yield plus a spread.
    category: Regulatory Finance
    type: float
    unit: 1/year
    range:
    - 0.02
    - 0.2
    default: 0.08
    role: free
    determinism: policy
    priority: P1
    status: to_build
    source: Regulator's determination
    users:
    - Regulators
  working_capital_allowance:
    name: Working capital allowance
    description: The regulator's allowance for working capital, expressed as a share of revenue. A share.
    category: Regulatory Finance
    type: float
    unit: '1'
    range:
    - 0.0
    - 0.25
    default: 0.05
    role: free
    determinism: policy
    priority: P2
    status: to_build
    source: Regulator's determination
    users:
    - Regulators
  revenue_cap:
    name: Revenue cap
    description: The maximum revenue a regulated utility may recover, as a share of the cost-recovery
      revenue. A share above 1.0 is a cap above cost, which is unusual but admissible.
    category: Regulatory Finance
    type: float
    unit: '1'
    range:
    - 0.5
    - 2.0
    default: 1.0
    role: free
    determinism: policy
    priority: P1
    status: to_build
    source: World Bank Regulation of Utilities handbook
    users:
    - Regulators
  price_cap:
    name: Price cap
    description: The maximum average tariff the utility may charge, as a share of the cost-recovery tariff.
      A share above 1.0 is a cap above cost.
    category: Regulatory Finance
    type: float
    unit: '1'
    range:
    - 0.5
    - 2.0
    default: 1.0
    role: free
    determinism: policy
    priority: P1
    status: to_build
    source: World Bank Regulation of Utilities handbook
    users:
    - Regulators
  hybrid_revenue_price_cap:
    name: Hybrid cap weight
    description: In a hybrid revenue-price cap, the weight on the price cap. A share; the revenue cap
      gets the complement.
    category: Regulatory Finance
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.5
    role: free
    determinism: policy
    priority: P2
    status: to_build
    source: World Bank Regulation of Utilities handbook
    users:
    - Regulators
  tariff_rebalancing:
    name: Tariff rebalancing rate
    description: Annual rate at which a tariff class is rebalanced toward cost. Bounded above at 1.0,
      which is immediate rebalancing.
    category: Regulatory Finance
    type: float
    unit: 1/year
    range:
    - 0.0
    - 1.0
    default: 0.2
    role: free
    determinism: policy
    priority: P2
    status: to_build
    source: Regulator's determination
    users:
    - Regulators
  efficiency_benchmarking:
    name: Efficiency benchmarking index
    description: A composite of the utility's efficiency against the frontier or against a peer group,
      normalised to [0, 1]. A share-shaped index.
    category: Regulatory Finance
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.85
    role: free
    determinism: policy
    priority: P2
    status: integrate
    source: Regulator's benchmarking study
    users:
    - Regulators
  service_quality_penalty:
    name: Service quality penalty
    description: Share of allowed revenue forfeited when service quality misses the target. A share.
    category: Regulatory Finance
    type: float
    unit: '1'
    range:
    - 0.0
    - 0.2
    default: 0.02
    role: free
    determinism: policy
    priority: P2
    status: to_build
    source: Regulator's determination
    users:
    - Regulators
  service_quality_reward:
    name: Service quality reward
    description: Share of allowed revenue added when service quality exceeds the target. A share.
    category: Regulatory Finance
    type: float
    unit: '1'
    range:
    - 0.0
    - 0.1
    default: 0.01
    role: free
    determinism: policy
    priority: P2
    status: to_build
    source: Regulator's determination
    users:
    - Regulators
  depreciation_life_by_asset:
    name: Depreciation life by asset
    description: The depreciation life the regulator allows for the reference asset class. Bounded by
      the asset-life parameter's own range.
    category: Regulatory Finance
    type: float
    unit: years
    range:
    - 5.0
    - 60.0
    default: 25.0
    role: free
    determinism: policy
    priority: P2
    status: to_build
    source: Regulator's determination
    users:
    - Regulators
  regulatory_asset_valuation_method:
    name: Regulatory asset valuation method
    description: Which valuation method the regulator uses — 0 for historical cost, 1 for indexed historical,
      2 for current-cost. A categorical value smuggled into a float; the type correction in Part D is
      the substantive fix, and this range is a stopgap that keeps the value meaningful until that fix
      lands.
    category: Regulatory Finance
    type: float
    unit: '1'
    range:
    - 0.0
    - 2.0
    default: 0.0
    role: free
    determinism: policy
    priority: P2
    status: to_build
    source: Regulator's determination
    users:
    - Regulators
  ring_fencing_rules:
    name: Ring-fencing strength
    description: Share of the regulator's ring-fencing provisions that are legally binding rather than
      best-practice. A share.
    category: Regulatory Finance
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.5
    role: free
    determinism: policy
    priority: P2
    status: to_build
    source: Regulator's determination
    users:
    - Regulators
  regulatory_audit_requirements:
    name: Regulatory audit stringency
    description: Share of the audited accounts the regulator requires to be independently verified. A
      share.
    category: Regulatory Finance
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.75
    role: free
    determinism: policy
    priority: P3
    status: to_build
    source: Regulator's determination
    users:
    - Regulators
  ppa_duration:
    name: PPA duration
    description: Contract length in years. Bounded below at 5 (short merchant-equivalent) and above at
      30 (asset life).
    category: Contract & Legal
    type: float
    unit: years
    range:
    - 5.0
    - 30.0
    default: 20.0
    role: free
    determinism: policy
    priority: P1
    status: to_build
    source: IRENA PPA market review
    users:
    - Developers
  concession_duration:
    name: Concession duration
    description: Concession term in years. Same shape as PPA duration.
    category: Contract & Legal
    type: float
    unit: years
    range:
    - 5.0
    - 40.0
    default: 25.0
    role: free
    determinism: policy
    priority: P2
    status: to_build
    source: World Bank concession agreements repository
    users:
    - Developers
  licence_duration:
    name: Licence duration
    description: Operating licence term in years. Same shape as PPA duration.
    category: Contract & Legal
    type: float
    unit: years
    range:
    - 5.0
    - 40.0
    default: 25.0
    role: free
    determinism: policy
    priority: P1
    status: to_build
    source: Regulator's practice
    users:
    - Developers
  fit_duration:
    name: FiT contract duration
    description: Feed-in-tariff contract term in years. Same shape as PPA duration; typically shorter
      in the sample.
    category: Contract & Legal
    type: float
    unit: years
    range:
    - 5.0
    - 25.0
    default: 20.0
    role: free
    determinism: policy
    priority: P2
    status: to_build
    source: Regulator's practice
    users:
    - Regulators
  performance_bond:
    name: Performance bond
    description: Bond posted as a share of capex. A share.
    category: Contract & Legal
    type: float
    unit: '1'
    range:
    - 0.0
    - 0.2
    default: 0.05
    role: free
    determinism: policy
    priority: P2
    status: to_build
    source: Standard project-finance practice
    users:
    - Developers
  remedy_periods:
    name: Remedy period
    description: Days a defaulting party has to cure before the lender may step in. Bounded below at one
      day and above at one year.
    category: Contract & Legal
    type: float
    unit: days
    range:
    - 1.0
    - 365.0
    default: 60.0
    role: free
    determinism: policy
    priority: P2
    status: to_build
    source: Standard project-finance practice
    users:
    - Banks
  ppa_availability:
    name: PPA availability
    description: Share of hours the plant is contractually available. Already shipped correctly at [0.5,
      1.0]; retained for consistency of the register.
    category: Contract & Legal
    type: float
    unit: '1'
    range:
    - 0.5
    - 1.0
    default: 0.95
    role: free
    determinism: policy
    priority: P2
    status: to_build
    source: Standard PPA practice
    users:
    - Developers
  licence_fees:
    name: Licence fees
    description: Annual licence fee per megawatt of licensed capacity, in USD per MW-year.
    category: Contract & Legal
    type: float
    unit: USD/MW/year
    range:
    - 0.0
    - 5000.0
    default: 500.0
    role: free
    determinism: policy
    priority: P1
    status: to_build
    source: Regulator's fee schedule
    users:
    - Developers
  tax_holiday_duration:
    name: Tax holiday duration
    description: Years of income-tax exemption from the first year of commercial operation. Bounded above
      at the asset's useful life.
    category: Contract & Legal
    type: float
    unit: years
    range:
    - 0.0
    - 15.0
    default: 5.0
    role: free
    determinism: policy
    priority: P2
    status: to_build
    source: Jurisdiction's investment code
    users:
    - Developers
  loss_carryforward_years:
    name: Loss carry-forward years
    description: Years a tax loss may be carried forward against future profit. Bounded above at the concession
      term.
    category: Contract & Legal
    type: float
    unit: years
    range:
    - 0.0
    - 20.0
    default: 5.0
    role: free
    determinism: policy
    priority: P2
    status: to_build
    source: Jurisdiction's tax code
    users:
    - Developers
  loss_carryback_years:
    name: Loss carry-back years
    description: Years a tax loss may be carried back against prior profit. Zero is the common case; the
      sample admits up to three years in the jurisdictions that allow it.
    category: Contract & Legal
    type: float
    unit: years
    range:
    - 0.0
    - 3.0
    default: 0.0
