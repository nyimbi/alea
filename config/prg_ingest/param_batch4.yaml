equations:
  availability_definition:
    name: Availability from MTBF and MTTR
    description: 'The steady-state UNAVAILABILITY: the fraction of time the asset is down, which is what
      `forced_outage_rate` means. MTTR / (MTBF + MTTR) is the down fraction, not the up fraction -- the
      batch described this result as "availability, the fraction of time the asset is up", which is its
      complement, 1 - MTTR/(MTBF+MTTR). The arithmetic is unchanged; only the description was inverted.
      Dimensional check: hours / (hours + hours) is dimensionless.'
    system: reliability
    lhs: forced_outage_rate
    rhs: mean_time_to_repair / (mean_time_between_failures + mean_time_to_repair)
    relation: eq
    parameters:
    - forced_outage_rate
    - mean_time_between_failures
    - mean_time_to_repair
    free_variables:
    - mean_time_between_failures
    - mean_time_to_repair
    determined_variables:
    - forced_outage_rate
    tolerance: 1.0e-06
    unit_check: true
    solution_method: direct
    linearity: nonlinear
    priority: P1
  remaining_life_from_condition_definition:
    name: Remaining useful life from condition
    description: 'A linear approximation of the remaining life: an asset that is end-of-life has zero
      years left, and an asset at peak condition has the full asset life. The graph does not carry a condition-to-life
      curve, and this linear form is the simplest one consistent with the two endpoints. A future batch
      should replace it with the curve the utility''s asset register supports. Dimensional check: years
      times a dimensionless factor is years.'
    system: reliability
    lhs: remaining_useful_life
    rhs: asset_life * asset_condition_index
    relation: eq
    parameters:
    - asset_life
    - asset_condition_index
    free_variables:
    - asset_life
    - asset_condition_index
    determined_variables:
    - remaining_useful_life
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
relationships:
- source: mean_time_to_repair
  target: forced_outage_rate
  equation_id: availability_definition
  relationship: functional
  direction: forward
  strength: hard
  description: A longer repair duration is a lower availability.
  priority: P1
- source: mean_time_between_failures
  target: forced_outage_rate
  equation_id: availability_definition
  relationship: functional
  direction: forward
  strength: hard
  description: A longer time between failures is a higher availability.
  priority: P1
- source: asset_life
  target: remaining_useful_life
  equation_id: remaining_life_from_condition_definition
  relationship: functional
  direction: forward
  strength: hard
  description: The remaining life scales with the asset's design life.
  priority: P1
- source: asset_condition_index
  target: remaining_useful_life
  equation_id: remaining_life_from_condition_definition
  relationship: functional
  direction: forward
  strength: hard
  description: The condition index is the fraction of design life remaining in the linear approximation.
  priority: P1
cross_validation:
- id: mtbf_below_repair_time
  condition: mean_time_between_failures < mean_time_to_repair
  severity: warning
  message: MTBF below MTTR is possible for equipment that fails more often than it is repaired, but unusual
    for any equipment class the sample contains
  suggestion: Check the unit — MTBF is in hours and MTTR is in hours
- id: regulatory_lag_exceeds_period
  condition: regulatory_lag > regulatory_period_length
  severity: error
  message: The regulatory lag is longer than the regulatory period. A tariff review that occurs less often
    than the cost is recovered is a review the tariff never catches up to.
  suggestion: Lower regulatory_lag, or raise regulatory_period_length
- id: allowed_return_below_sovereign
  condition: allowed_return_on_debt < interest_rate
  severity: warning
  message: The regulator's allowed return on debt is below the sovereign policy rate. That is not a market-clearing
    cost of debt.
  suggestion: Reconcile allowed_return_on_debt with interest_rate and the sovereign risk premium
- id: allowed_equity_below_debt
  condition: allowed_return_on_equity < allowed_return_on_debt
  severity: warning
  message: The allowed return on equity is below the allowed return on debt. Equity holders bear more
    risk than debt holders, and a regulator that sets the two the wrong way round is setting a capital
    structure no investor will fund.
  suggestion: Raise allowed_return_on_equity above allowed_return_on_debt
- id: revenue_cap_below_cost
  condition: revenue_cap < 0.5
  severity: warning
  message: A revenue cap below 50% of cost-recovery revenue is a cap that forces a loss in every period.
    This is possible under a political directive, but it is worth flagging.
  suggestion: Confirm the cap is the intended policy
- id: ppa_duration_beyond_asset_life
  condition: ppa_duration > asset_life
  severity: error
  message: The PPA extends beyond the asset's economic life. Either the duration is wrong, or the asset
    life should be extended.
  suggestion: Lower ppa_duration, or raise asset_life
- id: market_structure_without_model
  condition: market_structure == 1 and market_model == 0
  severity: warning
  message: A single-buyer market structure with a regulated market model is a coherent pairing but the
    graph's categorical encoding is ambiguous. A scenario reading these as floats would silently get a
    value of 500,000 and no error.
  suggestion: Confirm the categorical encoding, and if the corrected type is not yet deployed, set the
    value to the categorical's numeric index
- id: contract_for_difference_without_guarantees
  condition: contract_for_difference == 1 and ppa_guarantees == 0
  severity: info
  message: A CfD without a government PPA guarantee is a private contract with no sovereign backstop —
    possible but unusual
  suggestion: Confirm the pairing
- id: loss_carryback_exceeds_forward
  condition: loss_carryback_years > loss_carryforward_years
  severity: info
  message: Carry-back longer than carry-forward is possible in principle but unknown in the sample. Worth
    flagging as a scenario the graph's own evidence does not support.
  suggestion: Check the tax code
