equations:
  wacc_alias:
    id: wacc_alias
    name: WACC is the discount rate
    description: The catalog's WACC row and the financial block's discount rate are one quantity, so the
      duplicate derives from the computed one and the graph keeps a single blend. An equality between
      two ids for one number is the closure that keeps a scenario setting either name consistent; the
      alternative -- deprecating the id -- loses the label a report may cite.
    system: financial
    lhs: weighted_average_cost_of_capital
    rhs: discount_rate
    relation: eq
    parameters:
    - weighted_average_cost_of_capital
    - discount_rate
    free_variables:
    - discount_rate
    determined_variables:
    - weighted_average_cost_of_capital
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: Standard WACC with the interest tax shield
    latex: \mathrm{WACC} = \mathrm{discount\_rate}
  regulatory_asset_base_definition:
    id: regulatory_asset_base_definition
    name: Regulated asset base from the fleet
    description: Gross fleet capital less what the books have written down. The gross capital is the capacity-weighted
      capex; the 1000 converts kW-per-MW and the million converts USD. A fraction the regulator's roll-forward
      states, not one the model invents.
    system: financial
    lhs: regulatory_asset_base
    rhs: capex_usd_per_kw * total_capacity_mw * (1 - accumulated_depreciation_fraction) / 1000
    relation: eq
    parameters:
    - regulatory_asset_base
    - capex_usd_per_kw
    - total_capacity_mw
    - accumulated_depreciation_fraction
    free_variables:
    - capex_usd_per_kw
    - total_capacity_mw
    - accumulated_depreciation_fraction
    determined_variables:
    - regulatory_asset_base
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: Ofwat PR24 Appendix 11, allowed return on capital
    latex: \mathrm{RAB} = \mathrm{capex} \cdot C_{MW} \cdot 10^3 \cdot (1 - d_{acc}) \, /\, 10^6
  regulatory_depreciation_definition:
    id: regulatory_depreciation_definition
    name: Regulatory depreciation
    description: Straight-line write-down of the asset base over the regulatory asset life. The rate-of-return
      revenue requirement's first term; the second is the return on the base below.
    system: financial
    lhs: regulatory_depreciation
    rhs: regulatory_asset_base / depreciation_life_by_asset
    relation: eq
    parameters:
    - regulatory_depreciation
    - regulatory_asset_base
    - depreciation_life_by_asset
    free_variables:
    - depreciation_life_by_asset
    determined_variables:
    - regulatory_depreciation
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: Ofwat PR24 Appendix 11, allowed return on capital
    latex: D_{reg} = \mathrm{RAB} / L_{reg}
  allowed_revenue_requirement_definition:
    id: allowed_revenue_requirement_definition
    name: Allowed revenue requirement
    description: Depreciation plus the allowed return on the base, with that return taken as the blend
      the financial block computes -- the vanilla regulatory WACC the UKRN guidance builds. A tariff that
      recovers less than this under-recovers the utility; the revenue cap and the applied tariff are the
      instruments around it.
    system: financial
    lhs: allowed_revenue_requirement
    rhs: regulatory_depreciation + regulatory_asset_base * discount_rate
    relation: eq
    parameters:
    - allowed_revenue_requirement
    - regulatory_depreciation
    - regulatory_asset_base
    - discount_rate
    free_variables:
    - regulatory_depreciation
    - regulatory_asset_base
    determined_variables:
    - allowed_revenue_requirement
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: UKRN cost of capital guidance (2023), §allowed returns
    latex: R^* = D_{reg} + \mathrm{RAB} \cdot \mathrm{WACC}
  cost_of_debt_capped:
    id: cost_of_debt_capped
    name: Debt cost within the allowed return
    description: 'The regulator''s debt allowance binds the commercial cost of debt the scenario may assume:
      a component priced above the allowed return is the pass-through the cap regime forbids, so a scenario
      carrying it is inadmissible rather than silently under-recovering.'
    system: financial
    lhs: cost_of_debt
    rhs: allowed_return_on_debt
    relation: leq
    parameters:
    - cost_of_debt
    - allowed_return_on_debt
    free_variables:
    - cost_of_debt
    - allowed_return_on_debt
    tolerance: 1.0e-06
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: UKRN cost of capital guidance (2023), §overall framework
    latex: K_d \le A_d
  cost_of_equity_capped:
    id: cost_of_equity_capped
    name: Equity cost within the allowed return
    description: 'The equity-return allowance binds the cost of equity: the CAPM-estimated return a project
      demands cannot exceed what the regulatory settlement awards.'
    system: financial
    lhs: cost_of_equity
    rhs: allowed_return_on_equity
    relation: leq
    parameters:
    - cost_of_equity
    - allowed_return_on_equity
    free_variables:
    - cost_of_equity
    - allowed_return_on_equity
    tolerance: 1.0e-06
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: Ofwat PR24 Appendix 11, allowed return on capital
    latex: K_e \le A_e
