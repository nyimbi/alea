    id: property_tax_definition
    name: Property tax (computed)
    description: 'The rate times its base: property tax is the annual charge on the regulated asset base;
      the investment allowance is the fiscal credit against capital expenditure. Both are rates with no
      arithmetic beyond the product, so the definition is the whole of the coupling.'
    system: financial
