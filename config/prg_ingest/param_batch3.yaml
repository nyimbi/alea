    category: Cost
    type: float
    unit: USD/kW
    range:
    - 5000.0
    - 20000.0
    default: 10000.0
    role: free
    determinism: fixed
    priority: P3
    status: to_build
    source: IRENA, Ocean Energy 2023
    users:
    - Developers
  wave_energy_converter_cost:
    name: Wave energy converter cost
    description: Installed cost of a wave energy converter per kilowatt of rated capacity. Same technology
