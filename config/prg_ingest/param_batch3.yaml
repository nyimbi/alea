#
# Repairs applied to the batch as delivered:
#   R7: biogas_cost is claimed by ['param_batch3.md', 'param_batch7.md']; this entry kept
#   R7: compressed_air_cost is claimed by ['param_batch3.md', 'param_batch7.md']; this entry kept
#   R7: digital_divide_metrics is claimed by ['param_batch1.md', 'param_batch3.md']; this entry kept
#   R7: flywheel_cost is claimed by ['param_batch3.md', 'param_batch7.md']; this entry kept
#   R7: fusion_cost is claimed by ['param_batch3.md', 'param_batch7.md']; this entry kept
#   R7: gasification_cost is claimed by ['param_batch3.md', 'param_batch7.md']; this entry kept
#   R7: hydrogen_fuel_cell_cost is claimed by ['param_batch3.md', 'param_batch7.md']; this entry kept
#   R7: landfill_gas_cost is claimed by ['param_batch3.md', 'param_batch7.md']; this entry kept
#   R7: pyrolysis_cost is claimed by ['param_batch3.md', 'param_batch7.md']; this entry kept
#   R7: salinity_gradient_cost is claimed by ['param_batch3.md', 'param_batch7.md']; this entry kept
#   R7: small_modular_reactor_cost is claimed by ['param_batch3.md', 'param_batch7.md']; this entry kept
#   R7: tidal_range_cost is claimed by ['param_batch3.md', 'param_batch7.md']; this entry kept
#   R7: waste_to_energy_cost is claimed by ['param_batch3.md', 'param_batch7.md']; this entry kept
#   R7: wave_energy_converter_cost is claimed by ['param_batch3.md', 'param_batch7.md']; this entry kept
#   R3: dropped rule 'capex_duplicates_still_drift' -- its condition needs a function call, which the cross-validation grammar refuses: abs(capex_marine_wave - wave_energy_converter_cost) > 1.0 or abs(capex_smr - small_modular_reactor_cost) > 1.0 or abs(capex_fusion - fusion_cost) > 1.0 or abs(capex_caes - compressed_air_cost) > 1.0 or abs(capex_flywheel - flywheel_cost) > 1.0
parameters:
  capex_marine_wave:
    name: Wave energy capital cost
    description: Installed cost of wave energy conversion. The range spans the current first-of-a-kind
      cost at the high end and the projected nth-of-a-kind at the low end. The industry has not yet reached
      either, so the parameter is a projection, not an observation.
    category: Cost
    type: float
    unit: USD/kW
    range:
    - 2000.0
    - 12000.0
    default: 6000.0
    role: free
    determinism: stochastic
    priority: P3
    status: to_build
    source: IRENA, Ocean Energy 2023
    users:
    - Developers
  capex_marine_tidal:
    name: Tidal energy capital cost
    description: Installed cost of tidal stream and tidal range. The range is wide because tidal range
      with civil works is not the same technology as a tidal stream turbine; the graph does not distinguish
      them and the parameter therefore admits both.
    category: Cost
    type: float
    unit: USD/kW
    range:
    - 2500.0
    - 15000.0
    default: 7000.0
    role: free
    determinism: stochastic
    priority: P3
    status: to_build
    source: IRENA, Ocean Energy 2023
    users:
    - Developers
  capex_marine_otec:
    name: OTEC capital cost
    description: Installed cost of ocean thermal energy conversion. No commercial OTEC plant exists; the
      range is derived from the pilot projects and the thermodynamic cycle's own scaling, and the parameter
      is a speculative number that should be treated as such.
    category: Cost
    type: float
    unit: USD/kW
    range:
    - 5000.0
    - 25000.0
    default: 12000.0
    role: free
    determinism: stochastic
    priority: P3
    status: to_build
    source: IRENA, Ocean Energy 2023
    users:
    - Developers
  capex_gravity_storage:
    name: Gravity storage capital cost
    description: Installed cost of gravity-based energy storage. The technology is deployed at small scale;
      the range is inferred from the pilot installations, not from a cost curve.
    category: Cost
    type: float
    unit: USD/kWh
    range:
    - 200.0
    - 2000.0
    default: 800.0
    role: free
    determinism: stochastic
    priority: P3
    status: to_build
    source: Vendor and pilot data, aggregated
    users:
    - Developers
  capex_caes:
    name: Compressed air storage capital cost
    description: Installed cost of compressed air energy storage. The range spans diabatic at the low
      end to adiabatic at the high end; adiabatic is materially more expensive per unit of energy capacity.
    category: Cost
    type: float
    unit: USD/kWh
    range:
    - 50.0
    - 800.0
    default: 200.0
    role: free
    determinism: stochastic
    priority: P3
    status: to_build
    source: IEA Energy Storage Outlook
    users:
    - Developers
  capex_flywheel:
    name: Flywheel storage capital cost
    description: Installed cost of flywheel storage per unit of power capacity. Flywheels are power-limited,
      not energy-limited, so the unit is kW not kWh.
    category: Cost
    type: float
    unit: USD/kW
    range:
    - 200.0
    - 2000.0
    default: 700.0
    role: free
    determinism: stochastic
    priority: P3
    status: to_build
    source: NREL ATB 2024
    users:
    - Developers
  capex_smr:
    name: Small modular reactor capital cost
    description: Overnight installed cost of a small modular reactor. The technology is pre-commercial;
      the range is the projected nth-of-a-kind cost and is a claim about learning that has not yet occurred.
    category: Cost
    type: float
    unit: USD/kW
    range:
    - 3000.0
    - 12000.0
    default: 6000.0
    role: free
    determinism: stochastic
    priority: P3
    status: to_build
    source: IEA Nuclear Power and Secure Energy Transitions
    users:
    - Planners
  capex_fusion:
    name: Fusion capital cost
    description: Installed cost of fusion generation. No commercial plant exists; the range is speculative
      and is carried so that a scenario can express the possibility, not because the parameter is a number
      a planner can use.
    category: Cost
    type: float
    unit: USD/kW
    range:
    - 5000.0
    - 25000.0
    default: 10000.0
    role: free
    determinism: stochastic
    priority: P3
    status: to_build
    source: Projected from ITER cost extrapolation, marked speculative
    users:
    - Planners
  capex_biogas:
    name: Biogas plant capital cost
    description: Installed cost of an anaerobic digestion plant per kilowatt of electrical capacity. The
      range depends on feedstock and on whether the plant is a waste treatment facility first and an energy
      plant second.
    category: Cost
    type: float
    unit: USD/kW
    range:
    - 1500.0
    - 6000.0
    default: 3000.0
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: IRENA bioenergy cost data
    users:
    - Agriculture
  capex_landfill_gas:
    name: Landfill gas plant capital cost
    description: Installed cost of landfill gas capture and generation. Lower than dedicated biogas because
      the landfill itself is a waste disposal asset and the marginal cost is capture.
    category: Cost
    type: float
    unit: USD/kW
    range:
    - 1000.0
    - 4000.0
    default: 2000.0
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: IRENA bioenergy cost data
    users:
    - Cities
  capex_waste_to_energy:
    name: Waste-to-energy plant capital cost
    description: Installed cost of municipal waste combustion with energy recovery. The high end includes
      flue gas treatment to the standards a modern city requires.
    category: Cost
    type: float
    unit: USD/kW
    range:
    - 3000.0
    - 10000.0
    default: 5500.0
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: IRENA bioenergy cost data
    users:
    - Cities
  capex_pyrolysis:
    name: Pyrolysis plant capital cost
    description: Installed cost of pyrolysis capacity. Lower than gasification because pyrolysis runs
      at lower temperature and requires less process equipment.
    category: Cost
    type: float
    unit: USD/kW
    range:
    - 800.0
    - 4000.0
    default: 1800.0
    role: free
    determinism: fixed
    priority: P3
    status: to_build
    source: IRENA bioenergy cost data
    users:
    - Industry
  capex_gasification:
    name: Gasification plant capital cost
    description: Installed cost of biomass gasification. Higher than pyrolysis because syngas cleanup
      is the expensive part.
    category: Cost
    type: float
    unit: USD/kW
    range:
    - 1500.0
    - 6000.0
    default: 2800.0
    role: free
    determinism: fixed
    priority: P3
    status: to_build
    source: IRENA bioenergy cost data
    users:
    - Industry
  capex_hydrogen_fuel_cell:
    name: Hydrogen fuel cell capital cost
    description: Installed cost of a stationary hydrogen fuel cell per kilowatt of electrical output.
      The range spans the current small-scale deployment at the high end to the projected mass-manufactured
      cost at the low end.
    category: Cost
    type: float
    unit: USD/kW
    range:
    - 500.0
    - 5000.0
    default: 1500.0
    role: free
    determinism: stochastic
    priority: P2
    status: to_build
    source: IEA Global Hydrogen Review 2024
    users:
    - Industry
  capex_tidal_range:
    name: Tidal range capital cost
    description: Installed cost of tidal range (barrage or lagoon) generation. The civil works dominate;
      the range spans a lagoon at the low end to a barrage with locks at the high end.
    category: Cost
    type: float
    unit: USD/kW
    range:
    - 3000.0
    - 15000.0
    default: 7000.0
    role: free
    determinism: fixed
    priority: P3
    status: to_build
    source: IRENA, Ocean Energy 2023
    users:
    - Developers
  capex_salinity_gradient:
    name: Salinity gradient capital cost
    description: Installed cost of salinity gradient energy conversion. Pre-commercial; the range is projected
