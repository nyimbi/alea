  grid_connection_cost:
    name: Grid connection cost
    description: Cost to connect a generator to the transmission or distribution network, per kilowatt
      of capacity. The high end is a long spur line to a remote site; the low end is a connection at an
      existing substation.
    category: Transmission & Grid
    type: float
    unit: USD/kW
    range:
    - 20.0
    - 800.0
    default: 100.0
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: World Bank Africa Grid Map costing annex
    users:
    - Developers
  mini_grid_cost:
    name: Mini-grid cost per connection
    description: Installed cost of a mini-grid per connection served. The unit is USD per connection,
      not per kW, because a mini-grid's cost is dominated by the distribution network and the customer
      service drop.
    category: Transmission & Grid
    type: float
    unit: USD/connection
    range:
    - 200.0
    - 5000.0
    default: 1500.0
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: ESMAP Mini Grids for Half a Billion People
    users:
    - Developers
  shs_cost:
    name: Solar home system cost
    description: Delivered cost of a solar home system to the customer, in USD. The range spans a basic
      lighting kit at the low end to a system with a fridge and a television at the high end.
    category: Transmission & Grid
    type: float
    unit: USD/unit
    range:
    - 50.0
    - 2000.0
    default: 400.0
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: ESMAP Solar Home System Market Trends
    users:
    - Households
  distribution_capex_per_connection:
    name: Distribution cost per connection
    description: Installed cost of the distribution network per new connection. The unit is USD per connection;
      the shipped [0, 1e6] admitted a value of a million per connection, which is a country's entire grid
      budget for one house.
    category: Transmission & Grid
    type: float
    unit: USD/connection
    range:
    - 100.0
    - 4000.0
    default: 600.0
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: World Bank Africa Grid Map costing annex
    users:
    - Utilities
  digital_divide_metrics:
    name: Digital divide index
    description: A composite index of connectivity, price and skill, normalised to [0, 1]. The shipped
      [0, 1e6] admitted values the index's own construction cannot produce. The range is set by the index's
      normalisation, not by observation.
    category: Digital
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.5
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: ITU Digital Development Dashboard, methodology section
    users:
    - Policymakers
  energy_security_index:
    name: Energy security index
    description: Composite index of import dependency, fuel diversity and infrastructure adequacy, normalised
      to [0, 1]. Range is the index's construction, not a policy range.
    category: Geopolitical & Strategic
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.5
    role: free
    determinism: fixed
    priority: P1
    status: to_build
    source: IEA Energy Security Index, methodology
    users:
    - Policymakers
  geopolitical_risk_index:
    name: Geopolitical risk index
    description: Composite index of political, security and diplomatic risk, normalised to [0, 1]. Higher
      is riskier. Range is the index's construction.
    category: Geopolitical & Strategic
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.5
    role: free
    determinism: fixed
    priority: P1
    status: to_build
    source: World Bank Worldwide Governance Indicators, normalised
    users:
    - Investors
  rule_of_law_index:
    name: Rule of law index
    description: Composite index of legal predictability and enforcement, normalised to [0, 1]. Higher
