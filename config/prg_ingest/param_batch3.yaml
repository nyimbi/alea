    determinism: fixed
    priority: P2
    status: to_build
    source: HHI as defined in the Horizontal Merger Guidelines
    users:
    - Regulators
  risk_of_maladaptation:
    name: Maladaptation risk
    description: Probability that an adaptation measure makes the outcome worse, normalised to [0, 1].
      Range is the index's construction.
    category: Climate Adaptation
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.2
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: IPCC AR6 WGII, maladaptation framework
    users:
    - DFIs
  biodiversity_intactness_index:
    name: Biodiversity intactness index
    description: Biodiversity Intactness Index, normalised to [0, 1] where 1 is intact and 0 is devoid
      of its original species. Range is the index's construction.
    category: Environmental & Social Impact
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.7
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: Natural History Museum Biodiversity Intactness Index
    users:
    - DFIs
  ecosystem_services_index:
    name: Ecosystem services index
    description: Composite index of ecosystem service provision, normalised to [0, 1]. Range is the index's
      construction.
    category: Environmental & Social Impact
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.7
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: Natural Capital Project InVEST, ecosystem services valuation framework
    users:
    - DFIs
  water_stress_index:
    name: Water stress index
    description: Ratio of water withdrawal to renewable freshwater supply, expressed as a share. Higher
      is more stressed. Range is the index's construction.
    category: Water-Energy Nexus
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.4
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: WRI Aqueduct Water Risk Atlas, baseline water stress
    users:
    - Utilities
  resilience_score:
    name: Resilience score
    description: Composite score of a system's resilience to shocks, normalised to [0, 1]. Range is the
      index's construction.
    category: Climate Adaptation
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.5
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: Composite of ND-GAIN and World Risk Index, normalised
    users:
    - DFIs
cross_validation:
- id: index_above_unity
  condition: digital_divide_metrics > 1.0 or energy_security_index > 1.0 or geopolitical_risk_index >
    1.0 or rule_of_law_index > 1.0 or corruption_perception > 1.0 or political_stability > 1.0 or regulatory_predictability
    > 1.0 or contract_enforceability > 1.0 or adaptive_capacity > 1.0 or vulnerability_index > 1.0 or
    exposure_index > 1.0
  severity: error
  message: A composite index with a [0, 1] construction has been set above 1. The value is on a different
    scale than the equations that consume it assume.
  suggestion: Rescale the index to its documented range
- id: concentration_above_hhi_max
  condition: supply_chain_concentration > 10000 or market_concentration > 10000
  severity: error
  message: An HHI above 10,000 is impossible by construction. The value is on a different scale (a share,
    a percentage) than the index the parameter represents.
  suggestion: Rescale to the 0–10,000 HHI scale
- id: geothermal_cost_below_drilling
  condition: geothermal_cost < 1500 and geothermal_drilling_success < 0.7
  severity: warning
  message: A geothermal capex below 1500 USD/kW with a drilling success rate below 70% implies a resource-risk
    premium the capex does not carry
  suggestion: Raise geothermal_cost, or raise the assumed drilling success rate
- id: wave_capex_below_offshore_wind
  condition: capex_marine_wave < capex_wind_offshore and capex_marine_wave > 0
  severity: info
  message: Wave energy priced below offshore wind is below any observed wave project. The parameter is
    on a projection, not an observation.
  suggestion: Confirm whether the value is a projected nth-of-a-kind or an observed first-of-a-kind
- id: mini_grid_cost_below_distribution
  condition: mini_grid_cost < distribution_capex_per_connection and mini_grid_cost > 0
  severity: info
  message: A mini-grid connection cheaper than a distribution connection is possible only if the mini-grid
    serves dense settlements the distribution network has not reached; otherwise the two are on different
    scopes
  suggestion: Confirm the scopes of the two parameters
- id: shs_cost_above_mini_grid
  condition: shs_cost > mini_grid_cost and mini_grid_cost > 0
  severity: info
  message: A solar home system priced above a mini-grid connection is unusual but possible where the home
    system includes a large appliance package and the mini-grid does not
  suggestion: Confirm the scopes
- id: adaptation_index_out_of_band
  condition: adaptive_capacity < 0.1 or adaptive_capacity > 0.95
  severity: warning
  message: An adaptive capacity index below 0.1 or above 0.95 is outside the range the ND-GAIN sample
    produces across all countries
  suggestion: Check whether the value is on a different index's scale
