  lcoe_wind_offshore_definition:
    id: lcoe_wind_offshore_definition
    name: LCOE (wind offshore)
    description: 'Wind offshore levelised cost in the fixed-charge-annuity form the field standardises
      on: the annualised capital charge over the energy the plant actually produces, plus fixed and variable
      O&M, the fuel the fleet''s heat rate prices, and the stack''s carbon at carbon_price. Dimensional
      check: a USD/kW/year rate over an hours/year denominator with a dimensionless capacity factor is
      USD/MWh, and every per-MWh term shares it.'
    system: cost_accounting
    lhs: lcoe_wind_offshore_usd_per_mwh
    rhs: (capex_wind_offshore * crf_wind_offshore + opex_fixed_wind_offshore) * 1000 / (8760 * capacity_factor_wind_offshore)
    relation: eq
    parameters:
    - lcoe_wind_offshore_usd_per_mwh
    - capex_wind_offshore
    - opex_fixed_wind_offshore
    - capacity_factor_wind_offshore
    - crf_wind_offshore
    free_variables:
