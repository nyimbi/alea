    reference: Standard annuity formula
    latex: \mathrm{CRF}_{tech} = r(1+r)^L / ((1+r)^L - 1)
  lcoe_wind_definition:
    id: lcoe_wind_definition
    name: Wind LCOE
    description: 'Onshore wind levelised cost at its own capex and capacity factor. The variable O&M term
      is small for wind; the technology''s own variable O&M, at the level the cost literature states,
      so the solar equation''s variable term is reused as a conservative placeholder and this equation
      is marked `unit_check: true` on the strength of that substitution being dimensional, not physical.
      Corrected from its predecessor, which carried opex_variable_battery in a generation technology''s
      numerator -- a battery cost inside a plant with no battery; the battery''s cost now belongs to the
      battery''s own LCOE.'
    system: cost_accounting
    lhs: lcoe_wind_usd_per_mwh
    rhs: (annualised_capex_usd_per_kw_wind + opex_fixed_wind) * 1000 / (8760 * capacity_factor_wind_onshore)
      + opex_variable_wind
    relation: eq
    parameters:
    - annualised_capex_usd_per_kw_wind
    - capacity_factor_wind_onshore
    - lcoe_wind_usd_per_mwh
    - opex_fixed_wind
    - opex_variable_wind
    free_variables:
    - annualised_capex_usd_per_kw_wind
    - capacity_factor_wind_onshore
    - opex_fixed_wind
    - opex_variable_wind
    determined_variables:
    - lcoe_wind_usd_per_mwh
    tolerance: 1.0e-08
    unit_check: true
    reference: null
    priority: P1
    solution_method: direct
    linearity: nonlinear
    latex: null
