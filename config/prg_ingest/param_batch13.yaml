parameters:
  solar_pv_capacity_factor:
    name: Solar pv capacity factor
    description: 'Utility PV annual net output over rated capacity, at the regional resource level. Was
      a 0.5 placeholder: the midpoint of a range nobody declared, not a capacity factor any plant produces.
      NREL ATB 2025 global baseline is 0.16-0.24 across regions; this setting takes 0.22.'
    category: Supply
    subcategory: null
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.22
    initial: null
    role: exogenous
    determinism: fixed
    categories: []
    source: docs/params.md
    source_url: null
    users:
    - All
    priority: P1
    status: existing
    deprecated_by: null
  asset_life_solar_pv:
    name: Asset life solar pv
    description: Economic life of solar pv assets, over which the capital charge annualises; a longer
      life is a smaller annuity at the same discount rate.
    category: Cost
    type: float
    unit: years
    range:
    - 5.0
    - 80.0
    role: exogenous
    determinism: fixed
    priority: P2
    status: existing
    source: NREL ATB 2025 economic lifetime by technology
    users:
    - Investors
    default: 25.0
  opex_fixed_solar:
    name: Solar PV fixed O&M
    description: 'Fixed operations and maintenance for solar pv: the per-kilowatt annual cost of staff,
      inspection and scheduled overhaul, paid whether or not the plant runs.'
    category: Cost
    subcategory: null
    type: float
    unit: USD/kW/year
    range:
    - 0.0
    - 400.0
    default: 9.0
    initial: null
    role: exogenous
    determinism: physical
    categories: []
    source: NREL ATB 2025; IEA/NEA Projected Costs of Generating Electricity 2020; IRENA Renewable Power
      Generation Costs in 2022
    source_url: null
    users:
    - Operators
    priority: P1
    status: existing
    deprecated_by: null
  opex_variable_solar:
    name: Opex variable solar
    description: 'Variable O&M for solar pv: wear and consumables paid per megawatt-hour produced, the
      cost that runs with the energy.'
    category: Cost
    type: float
    unit: USD/MWh
    range:
    - 0.0
    - 20.0
    role: exogenous
    determinism: physical
    priority: P2
    status: existing
    source: NREL ATB 2025; IEA/NEA Projected Costs of Generating Electricity 2020; IRENA Renewable Power
      Generation Costs in 2022
    users:
    - Operators
    default: 0.5
  capacity_factor_solar_pv:
    name: Capacity factor solar pv
    description: 'Annual net output over rated capacity for solar pv, in the single-country setting: solar
      and wind carry the regional climate and resource levels, thermal carries the plant''s own duty.'
    category: Technology
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    role: exogenous
    determinism: physical
    priority: P1
    status: existing
    source: NREL ATB 2025 capacity factors, adjusted to the regional resource
    users:
    - Planners
    default: 0.22
  crf_solar_pv:
    name: Crf solar pv
    description: 'Capital recovery factor at the fleet discount rate over the solar pv asset life: the
      annual charge per unit of capital. Same formula as the kernel''s fleet crf, per technology, because
      a 60-year nuclear life and a 25-year PV life discount differently.'
    category: Cost
    type: float
    unit: 1/year
    range:
    - 0.001
    - 1.0
    role: derived
    determinism: fixed
    priority: P2
    status: existing
    source: Standard annuity formula
    users:
    - Investors
