  fleet_build_balance:
    id: fleet_build_balance
    name: The build set within the fleet
    description: The optimiser's per-technology builds must not exceed the fleet size the plan declares
      for them. This is a *constraint* coupling -- the equation the LP carries, not an identity the evaluator
      solves -- because the builds are decision variables with no single value until the solve settles
      them.
    system: reserve_margin
    lhs: battery_capacity + biomass_capacity + coal_capacity + csp_capacity + gas_capacity + geothermal_capacity
      + hydro_capacity + hydrogen_storage_capacity + nuclear_capacity + oil_capacity + phs_capacity +
      thermal_storage_capacity + wind_offshore_capacity + wind_onshore_capacity
    rhs: total_capacity_mw + storage_headroom_mw
    relation: leq
    parameters:
    - battery_capacity
    - biomass_capacity
    - coal_capacity
    - csp_capacity
    - gas_capacity
    - geothermal_capacity
    - hydro_capacity
    - hydrogen_storage_capacity
    - nuclear_capacity
    - oil_capacity
    - phs_capacity
    - thermal_storage_capacity
    - wind_offshore_capacity
    - wind_onshore_capacity
    - total_capacity_mw
    - storage_headroom_mw
    free_variables:
    - total_capacity_mw
    - storage_headroom_mw
    tolerance: 1.0e-06
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
    reference: 'Least-cost generation expansion: Koltsaklis & Dagoumas (2018), Applied Energy 230:563-589'
    latex: \\sum_t C_t \\le C_{total} + H_{storage}
