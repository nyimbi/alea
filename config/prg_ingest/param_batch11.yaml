# The five arithmetic rules the cross-validation grammar refused, stated as
# bound equations instead.
#
# Merged onto config/prg.yaml by alea.prg.graph.load_ingested().
#
# WHY THESE ARE EQUATIONS AND NOT RULES. The cross-validation grammar has no
# `ast.BinOp`, deliberately: `alea.prg.crossval`'s own allowlist comment says
# "an expression like `a * b > c` is an equation the graph should state, not a
# rule buried in a condition where nothing checks it dimensionally". So a rule
# of the form `a + b > 1.0` is refused at parse, and the refusal names the right
# home for it. Five such rules were dropped from the batch set for want of that
# home. This batch is where they land.
#
# WHAT MADE THEM WRITABLE. Until now the graph could not state them either: the
# loader read each side's symbols with `dsl.parse`, which refuses any expression
# naming no parameter, and the right-hand side of a bound is a constant by
# definition. So `sum(shares) <= 1.0` was refused by the very check that would
# have guarded it, while the residual the solver builds -- `(lhs) - (rhs)` --
# parsed and evaluated correctly all along. `dsl.parse_side` is the door that
# closed the gap, and the vacuity guard moved to the combined arithmetic rather
# than being dropped.
#
# WHAT EACH ONE BUYS. Twelve nodes that no equation reached now carry a bound,
# which is the difference between "a knob with a declared range" and "a knob
# whose value is constrained by the rest of the system". Every operand is
# already declared, already carries unit `1`, and is `role: free` -- nothing
# here is determined by another equation, so each bound is a new claim rather
# than a second one about a value the graph already computes.
#
# WHY EVERY EQUATION CARRIES A `latex`. The DSL renders LaTeX on demand and
# folds constants while doing it. A bound's whole content is the ceiling, so a
# rendering that erased or moved it would be a rendering of a different claim.
# `alea.prg.service.check_latex` holds each declared rendering to the operand
# set of its arithmetic.
#
# WHY `leq` AND NOT `lt`. The relations are stated as ceilings, and a scenario
# that sits exactly on one is at the boundary rather than outside it. The
# residual comparison carries the equation's own tolerance, so equality passes.
parameters: {}
equations:
  demand_shares_bound:
    name: Sector demand shares sum to at most one
    description: 'The four sector shares are a decomposition of total demand, so they
      cannot sum above one: a set summing higher describes more demand than the total
      it is a decomposition of. A ceiling rather than an equality, because a scenario
      may leave a residual unallocated -- the shares need not exhaust the total.'
    system: demand_supply
    lhs: residential_demand_share + commercial_demand_share + industrial_demand_share + agricultural_demand_share
    rhs: '1.0'
    relation: leq
    parameters:
    - residential_demand_share
    - commercial_demand_share
    - industrial_demand_share
    - agricultural_demand_share
    tolerance: 1.0e-06
    unit_check: true
    solution_method: numeric
    linearity: linear
    priority: P2
    latex: '\mathrm{residential}_{demand\_share} + \mathrm{commercial}_{demand\_share} + \mathrm{industrial}_{demand\_share} + \mathrm{agricultural}_{demand\_share} \leq 1'
  fuel_ccs_adoption_bound:
    name: CCS adoption shares sum to at most one
    description: 'Coal and gas carbon capture are competing claims on the same capture
      capability, so their adoption shares cannot together exceed one. A ceiling rather
      than an equality because a fleet may retrofit neither.'
    system: emissions
    lhs: coal_ccs_adoption + gas_ccs_adoption
    rhs: '1.0'
    relation: leq
    parameters:
    - coal_ccs_adoption
    - gas_ccs_adoption
    tolerance: 1.0e-06
    unit_check: true
    solution_method: numeric
    linearity: linear
    priority: P2
    latex: '\mathrm{coal}_{ccs\_adoption} + \mathrm{gas}_{ccs\_adoption} \leq 1'
  industrial_electrification_bound:
    name: Industrial electrification and heat electrification are bounded together
    description: 'Direct electrification and heat electrification are two routes to the
      same decarbonised industrial load, and a scenario that took both to their maximum
      would electrify more of industry than industry has. Bounded at 1.5 rather than 1.0
      because the two measures overlap partially -- a process counted in both is
      electrified once -- so the sum is allowed above unity and not without limit.'
    system: demand_supply
    lhs: industrial_electrification + industrial_heat_electrification
    rhs: '1.5'
    relation: leq
    parameters:
    - industrial_electrification
    - industrial_heat_electrification
    tolerance: 1.0e-06
    unit_check: true
    solution_method: numeric
    linearity: linear
    priority: P2
    latex: '\mathrm{industrial}_{electrification} + \mathrm{industrial}_{heat\_electrification} \leq 1.5'
  retention_and_deductible_bound:
    name: Retention and deductible shares sum to at most one
    description: 'A risk-retention share and a deductible share are both fractions of
      the same insured loss kept by the insured party, so together they cannot exceed the
      whole loss. A ceiling because a policy may leave a layer to the insurer between
      the two.'
    system: financial
    lhs: retention_share + deductible_share
    rhs: '1.0'
    relation: leq
    parameters:
    - retention_share
    - deductible_share
    tolerance: 1.0e-06
    unit_check: true
    solution_method: numeric
    linearity: linear
    priority: P2
    latex: '\mathrm{retention}_{share} + \mathrm{deductible}_{share} \leq 1'
  local_employment_targets_bound:
    name: Local, women and youth employment shares are bounded together
    description: 'The three employment shares are overlapping measures over one workforce:
      a woman employed locally who is also young is counted in all three. Their sum is
      therefore bounded at 2.0 rather than at 1.0 -- two overlaps are expected and a third
      is not, so a scenario above the bound has counted someone in more categories than
      the workforce has.'
    system: employment
    lhs: local_employment_share + women_employment_share + youth_employment_share
    rhs: '2.0'
    relation: leq
    parameters:
    - local_employment_share
    - women_employment_share
    - youth_employment_share
    tolerance: 1.0e-06
    unit_check: true
    solution_method: numeric
    linearity: linear
    priority: P2
    latex: '\mathrm{local}_{employment\_share} + \mathrm{women}_{employment\_share} + \mathrm{youth}_{employment\_share} \leq 2'
relationships: []
cross_validation: []
