cross_validation:
- id: learning_rates_out_of_range
  condition: solar_pv_learning_rate > 0.40 or battery_learning_rate > 0.40 or electrolyser_learning_rate
    > 0.40
  severity: warning
  message: A learning rate above 40% per doubling is outside the range the empirical literature reports
    for any energy technology
  suggestion: Use a rate from the empirical range, or record that this is a deliberately aggressive scenario
