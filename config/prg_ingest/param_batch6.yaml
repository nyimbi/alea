# Generated from docs/param_batch6.md by the parameter-equation ingestion.
# Merged onto config/prg.yaml by alea.prg.graph.load_ingested().
#
# Repairs applied to the batch as delivered:
#   R3: dropped rule 'ppa_indexed_price_doubles' -- its condition needs arithmetic, which the cross-validation grammar refuses: ppa_indexed_price_usd_per_mwh > 3 * ppa_price_usd_per_mwh
#   R19: 'lolp_definition' recalibrated. It read `exp(-10 * m)`, and at the default
#        `reserve_margin_min = 0.15` that returns lolp = 0.2231 -- a loss-of-load of
#        one hour in 4.5 -- which puts LOLE at 1954.6 h/yr, 81x the 24 h/yr ceiling
#        this same batch's `lole_exceeds_days` rule enforces and outside the node's
#        own declared range [0, 500]. The batch's prose claimed the decay constant
#        was "set so a margin equal to the required minimum gives a LOLP near the
#        regulatory ceiling of 1 in 100 hours"; 10 does not do that, and nothing
#        compared the claim to the curve it describes. Recalibrated to the graph's
#        own reliability rule instead: `(24 / 8760) ** (m / 0.15)` is pinned to
#        lolp = 24/8760 at m = 0.15, so LOLE = 24 h/yr exactly at the required
#        minimum margin. A base in [0, 1] to a non-negative power is in [0, 1], so
#        the node's range is now a property of the form for every value set.
#   R20: 'fuel_diversity_definition' denominator corrected from `total_capacity_mw`
#        to the sum of the seven fuels it indexes. An HHI divides by the total of
#        the shares it is taken over, and the two are different parameters free to
#        disagree: at the shipped defaults the seven sum to 63000 MW while
#        `total_capacity_mw` is 10000 MW, so the index returned 1 - 8.39 = -7.39
#        against a declared range of [0, 1]. With the seven's own total the shares
#        sum to 1 by construction and Cauchy-Schwarz bounds the index in [0, 1] for
#        every value set. The `total_capacity_mw -> fuel_diversity_index` edge was
#        dropped with it: the equation no longer holds that endpoint (gate 6).
parameters:
  system_inertia_mws:
    name: System inertia
    description: 'Kinetic energy stored in online synchronous machines at nominal frequency. Corrected
      from `exogenous` to `derived`: the inertia is not something a scenario declares, it is a consequence
      of the fleet the scenario builds. The shipped default of 30000 MWs is removed because a derived
      parameter must not carry one.'
    category: Technical
    type: float
    unit: MW.s
    range:
    - 0.0
    - 10000000.0
    role: derived
    determinism: physical
    priority: P1
    status: to_build
    source: Swing equation; cf. ENTSO-E inertia studies
    users:
    - Utilities
  load_factor:
    name: Load factor
    description: Annual demand divided by peak demand times the hours in a year. The complement of the
      peak-to-average ratio; the parameter a distribution-planning study reports.
    category: Demand-Side
    type: float
    unit: '1'
    range:
    - 0.3
    - 0.9
    role: derived
    determinism: physical
    priority: P1
    status: to_build
    source: Standard utility load characterisation
    users:
    - Utilities
  lolp:
    name: Loss of load probability
    description: The probability that available generation is insufficient to meet demand in a given hour,
      as a share. A dimensionless probability; the shipped graph carries no such parameter and this is
      the reliability-engineering equivalent of the DSCR floor.
    category: Reliability
    type: float
    unit: '1'
    range:
    - 0.0
    - 0.3
    role: derived
    determinism: stochastic
    priority: P1
    status: to_build
    source: IEEE Std 493; NERC reliability standards
    users:
    - Utilities
    - Regulators
  lole_hours_per_year:
    name: Loss of load expectation
    description: Expected hours per year the system fails to meet demand. The LOLP annualised; the number
      a reliability standard is written against.
    category: Reliability
    type: float
    unit: hours/year
    range:
    - 0.0
    - 500.0
    role: derived
    determinism: stochastic
    priority: P1
    status: to_build
    source: IEEE Std 493
    users:
    - Utilities
    - Regulators
  ppa_annual_revenue_usd_per_kw_year:
    name: PPA annual revenue
    description: The annual revenue a contracted plant earns per kilowatt of capacity. The other side
      of the DSCR's cash-flow numerator; the quantity a lender actually reads off the PPA.
    category: Contract & Legal
    type: float
    unit: USD/kW/year
    range:
    - 0.0
    - 5000.0
    role: derived
    determinism: policy
    priority: P2
    status: to_build
    source: Standard PPA cash-flow structure
    users:
    - Banks
    - Developers
  ppa_indexed_price_usd_per_mwh:
    name: PPA indexed price
    description: The PPA price compounded to the contract's end at the indexation rate. The price the
      last year of the contract pays; the number a sponsor's revenue forecast is built on.
    category: Contract & Legal
    type: float
    unit: USD/MWh
    range:
    - 0.0
    - 5000.0
    role: derived
    determinism: policy
    priority: P2
    status: to_build
    source: Standard PPA indexation
    users:
    - Developers
  frequency_nadir_hz:
    name: Frequency nadir
    description: The lowest frequency the system reaches after the largest credible loss, before any primary
      response. The quantity the under-frequency load-shedding relays are set against.
    category: Technical
    type: float
    unit: Hz
    range:
    - 45.0
    - 50.0
    role: derived
    determinism: physical
    priority: P1
    status: to_build
    source: Swing equation with a stated response time
    users:
    - Utilities
  composite_governance_index:
    name: Composite governance index
    description: The unweighted average of the five governance indicators the graph already carries. A
      single number for the jurisdictional quality a scenario assumes, so the country-risk parameter has
      a documented basis rather than a free value.
    category: Geopolitical & Strategic
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    role: derived
    determinism: fixed
    priority: P2
    status: to_build
    source: Composite of World Bank Worldwide Governance Indicators
    users:
    - Investors
    - DFIs
  fuel_diversity_index:
    name: Fuel diversity index
    description: The complement of the Herfindahl-Hirschman Index over the fleet's fuel capacities, normalised
      to [0, 1]. Higher is more diverse. A scenario with a single fuel has 0; a scenario with an even
      split across many fuels approaches 1.
    category: Geopolitical & Strategic
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    role: derived
    determinism: physical
    priority: P2
    status: to_build
    source: Standard HHI complement
    users:
    - Policymakers
  reserve_margin_actual:
    name: Actual reserve margin
    description: The reserve margin the built fleet actually delivers, distinct from the requirement.
      The two are compared by a cross-validation rule, not by an equation; the number is what the capacity-adequacy
      report prints.
    category: Technical
    type: float
    unit: '1'
    range:
    - -1.0
    - 5.0
    role: derived
    determinism: physical
    priority: P1
    status: to_build
    source: Standard capacity-adequacy accounting
    users:
    - Planners
    - Regulators
  total_revenue_usd_per_year:
    name: Total revenue
    description: The annual revenue the fleet earns at the PPA price. The single-buyer's whole revenue
      in the shipped graph's simplification; the number a subsidy or a surplus is measured against.
    category: Financial
    type: float
    unit: USD/year
    range:
    - 0.0
    - 1000000000000.0
    role: derived
    determinism: policy
    priority: P2
    status: to_build
    source: Standard revenue identity
    users:
    - Investors
    - Regulators
  inertia_constant_s:
    name: Inertia constant
    description: The inertia constant H, in seconds. The ratio of stored kinetic energy at rated speed
      to the machine's MVA rating. A property of the technology, not of the fleet; the graph carries no
      per-technology inertia and this is the fleet-level weighted average.
    category: Technical
    type: float
    unit: s
    range:
    - 0.5
    - 10.0
    default: 4.0
    role: exogenous
    determinism: physical
    priority: P1
    status: to_build
    source: Standard machine constants; cf. ENTSO-E inertia studies
    users:
    - Utilities
  nominal_frequency_hz:
    name: Nominal frequency
    description: The system's nominal frequency. A property of the interconnection, not of the scenario.
    category: Technical
    type: float
    unit: Hz
    range:
    - 50.0
    - 60.0
    default: 50.0
    role: exogenous
    determinism: physical
    priority: P2
    status: to_build
    source: Interconnection's own standard
    users:
    - Utilities
  frequency_response_time_s:
    name: Frequency response time
    description: The time between the loss of generation and the start of primary frequency response.
      The interval over which the inertia alone holds the frequency up.
    category: Technical
    type: float
    unit: s
    range:
    - 1.0
    - 30.0
    default: 10.0
    role: exogenous
    determinism: physical
    priority: P2
    status: to_build
    source: Grid-code primary response requirement
    users:
    - Utilities
equations:
  load_factor_definition:
    name: Load factor
    description: 'Annual demand divided by peak demand times 8760. Dimensional check: TWh times 1e6 is
      MWh/year, divided by (MW times hours/year) is dimensionless. The 1e6 converts TWh to MWh.'
    system: energy_balance
    lhs: load_factor
    rhs: (demand_twh * 1000000) / (peak_demand_mw * 8760)
    relation: eq
    parameters:
    - demand_twh
    - peak_demand_mw
    free_variables:
    - demand_twh
    - peak_demand_mw
    determined_variables:
    - load_factor
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: nonlinear
    priority: P1
  lolp_definition:
    name: Loss of load probability
    description: 'The LOLP as an exponential in the reserve margin. A standard first-order approximation
      when the graph carries no forced-outage distribution: the LOLP falls off exponentially with margin.
      The decay is CALIBRATED to this graph''s own reliability rules, not chosen: `lole_exceeds_days`
      (Batch 6) flags a loss-of-load expectation above one day per year, and 24 hours / 8760 hours
      is a LOLP of 24/8760, so the curve is pinned to pass through `lolp = 24/8760` at the required
      minimum margin `reserve_margin_min = 0.15`. Written as `(24/8760) ** (m / 0.15)` that is exact
      at the pin and stays inside [0, 1] for every m >= 0, because a base in [0, 1] raised to a non-negative
      power is in [0, 1] — the range is a property of the form. The previous form, `exp(-10 * m)`,
      was the same family with an uncalibrated constant: at the default m = 0.15 it returned 0.2231,
      a LOLP of 1 hour in 4.5, which put LOLE at 1954.6 h/yr — 81x the batch''s own 24 h/yr ceiling
      and outside the node''s declared range of [0, 500]. The batch''s prose said the constant was
      "set so a margin equal to the required minimum gives a LOLP near the regulatory ceiling of 1
      in 100 hours"; 10 does not do that (it gives 0.2231, not 0.01), and the arithmetic never named
      `reserve_margin_min`''s default, so the claim was never checked against the curve it describes.
      Dimensional check: dimensionless raised to a dimensionless power is dimensionless.'
    system: reliability
    lhs: lolp
    rhs: (24 / 8760) ** (reserve_margin_min / 0.15)
    relation: eq
    parameters:
    - reserve_margin_min
    free_variables:
    - reserve_margin_min
    determined_variables:
    - lolp
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: nonlinear
    priority: P1
  lole_definition:
    name: Loss of load expectation
    description: 'The LOLP annualised: the probability times the hours in a year. Dimensional check: dimensionless
      times hours/year is hours/year.'
    system: reliability
    lhs: lole_hours_per_year
    rhs: lolp * 8760
    relation: eq
    parameters:
    - lolp
    free_variables:
    - lolp
    determined_variables:
    - lole_hours_per_year
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
  ppa_annual_revenue_definition:
    name: PPA annual revenue
    description: 'The annual revenue per kilowatt of contracted capacity. Dimensional check: USD/MWh times
      hours/year times dimensionless / 1000 is USD/kW/year. The 1000 converts kW to MW. The capacity factor
      is the proxy for the plant''s actual output, which the graph does not carry hour by hour.'
    system: ppa_pricing
    lhs: ppa_annual_revenue_usd_per_kw_year
    rhs: ppa_price_usd_per_mwh * capacity_factor * 8760 / 1000
    relation: eq
    parameters:
    - ppa_price_usd_per_mwh
    - capacity_factor
    free_variables:
    - ppa_price_usd_per_mwh
    - capacity_factor
    determined_variables:
    - ppa_annual_revenue_usd_per_kw_year
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P2
  ppa_indexed_price_definition:
    name: PPA indexed price
    description: 'The contract price compounded to the end of the contract. Dimensional check: USD/MWh
      times a dimensionless factor is USD/MWh.'
    system: ppa_pricing
    lhs: ppa_indexed_price_usd_per_mwh
    rhs: ppa_price_usd_per_mwh * (1 + tariff_indexation) ** ppa_duration
    relation: eq
    parameters:
    - ppa_price_usd_per_mwh
    - tariff_indexation
    - ppa_duration
    free_variables:
    - ppa_price_usd_per_mwh
    - tariff_indexation
    - ppa_duration
    determined_variables:
    - ppa_indexed_price_usd_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: nonlinear
    priority: P2
  inertia_from_capacity_definition:
    name: System inertia from capacity
    description: 'The fleet''s stored kinetic energy: firm capacity times the inertia constant. Dimensional
      check: MW times seconds is MW·s. The inertia constant H is the ratio of stored energy to rated power;
      the graph carries the fleet-level weighted average, not a per-technology value, which is a stated
      simplification.'
    system: inertia
    lhs: system_inertia_mws
    rhs: firm_capacity_mw * inertia_constant_s
    relation: eq
    parameters:
    - firm_capacity_mw
    - inertia_constant_s
    free_variables:
    - firm_capacity_mw
    - inertia_constant_s
    determined_variables:
    - system_inertia_mws
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
  frequency_nadir_definition:
    name: Frequency nadir
    description: 'The frequency after the response time, at the constant initial slope. Dimensional check:
      Hz minus (Hz/s) times s is Hz. A first-order approximation: the actual trajectory curves as the
      response engages, and the linear form is a lower bound on the nadir, i.e. more conservative than
      the truth.'
    system: inertia
    lhs: frequency_nadir_hz
    rhs: nominal_frequency_hz - rocof_df_dt_hz_per_s * frequency_response_time_s
    relation: eq
    parameters:
    - nominal_frequency_hz
    - rocof_df_dt_hz_per_s
    - frequency_response_time_s
    free_variables:
    - nominal_frequency_hz
    - rocof_df_dt_hz_per_s
    - frequency_response_time_s
    determined_variables:
    - frequency_nadir_hz
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
  composite_governance_index_definition:
    name: Composite governance index
    description: 'The unweighted average of the five governance indicators. Dimensional check: the sum
      of five dimensionless quantities divided by five is dimensionless. The unweighted average is a stated
      simplification: a weighted composite needs weights the graph does not carry, and the unweighted
      form is what a reader can check from the components.'
    system: demand_supply
    lhs: composite_governance_index
    rhs: (rule_of_law_index + political_stability + corruption_perception + regulatory_predictability
      + contract_enforceability) / 5
    relation: eq
    parameters:
    - rule_of_law_index
    - political_stability
    - corruption_perception
    - regulatory_predictability
    - contract_enforceability
    free_variables:
    - rule_of_law_index
    - political_stability
    - corruption_perception
    - regulatory_predictability
    - contract_enforceability
    determined_variables:
    - composite_governance_index
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P2
  fuel_diversity_definition:
    name: Fuel diversity index
    description: 'One minus the Herfindahl-Hirschman Index over the fleet''s fuel capacities, expressed
      as a fraction. Dimensional check: MW squared over MW squared is dimensionless, and one minus it
      is dimensionless. Seven fuels are named explicitly; a technology the graph carries but does not
      list here (marine, hydrogen fuel cell, SMR) is excluded from the sum and the index overstates diversity
      by its own omission — a finding rather than a mathematical error. The denominator is the SUM OF
      THE SEVEN, not `total_capacity_mw`: an HHI divides by the total of the shares it is taken over,
      and the two totals are different parameters that are free to disagree. At the shipped defaults
      the seven sum to 63000 MW while `total_capacity_mw` is 10000 MW, so dividing by the latter gave
      1 - 8.39 = -7.39, outside the index''s own [0, 1]. Dividing by the seven''s own total makes the
      sum of the shares exactly 1 by construction, so Cauchy-Schwarz bounds the index in [0, 1] for
      every value set — the range is then a property of the formula, not a coincidence of the defaults.'
    system: demand_supply
    lhs: fuel_diversity_index
    rhs: 1 - (coal_capacity ** 2 + gas_capacity ** 2 + oil_capacity ** 2 + nuclear_capacity ** 2 + hydro_capacity
      ** 2 + solar_pv_capacity ** 2 + wind_onshore_capacity ** 2) / ((coal_capacity + gas_capacity
      + oil_capacity + nuclear_capacity + hydro_capacity + solar_pv_capacity + wind_onshore_capacity)
      ** 2)
    relation: eq
    parameters:
    - coal_capacity
    - gas_capacity
    - oil_capacity
    - nuclear_capacity
    - hydro_capacity
    - solar_pv_capacity
    - wind_onshore_capacity
    free_variables:
    - coal_capacity
    - gas_capacity
    - oil_capacity
    - nuclear_capacity
    - hydro_capacity
    - solar_pv_capacity
    - wind_onshore_capacity
    determined_variables:
    - fuel_diversity_index
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: nonlinear
    priority: P2
  reserve_margin_actual_definition:
    name: Actual reserve margin
    description: 'The reserve margin the built fleet delivers: firm capacity plus the firm contribution
      from VRE, less peak demand, over peak demand. Dimensional check: MW over MW is dimensionless. The
      VRE contribution enters at its capacity factor; the same credit the reserve-margin constraint uses,
      so the actual margin and the requirement are on the same basis.'
    system: reserve_margin
    lhs: reserve_margin_actual
    rhs: (firm_capacity_mw + vre_capacity_mw * capacity_factor - peak_demand_mw) / peak_demand_mw
    relation: eq
    parameters:
    - firm_capacity_mw
    - vre_capacity_mw
    - capacity_factor
    - peak_demand_mw
    free_variables:
    - firm_capacity_mw
    - vre_capacity_mw
    - capacity_factor
    - peak_demand_mw
    determined_variables:
    - reserve_margin_actual
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: nonlinear
    priority: P1
  total_revenue_definition:
    name: Total revenue
    description: 'The fleet''s annual revenue at the PPA price. Dimensional check: TWh times 1e6 is MWh/year,
      times USD/MWh is USD/year. Uses the PPA price rather than a market price because the graph''s single-buyer
      simplification is what the revenue identity is written against.'
    system: financial
    lhs: total_revenue_usd_per_year
    rhs: generation_twh * 1000000 * ppa_price_usd_per_mwh
    relation: eq
    parameters:
    - generation_twh
    - ppa_price_usd_per_mwh
    free_variables:
    - generation_twh
    - ppa_price_usd_per_mwh
    determined_variables:
    - total_revenue_usd_per_year
    tolerance: 1.0e-06
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P2
