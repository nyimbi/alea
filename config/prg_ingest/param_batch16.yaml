    - Planners
    - Traders
  mwh_per_ammonia_unit:
    name: MWh per ammonia unit
    description: Ammonia's lower heating value is 18.6 GJ per tonne; at 3.6 GJ per MWh that is 5.167 MWh
      delivered per tonne.
    category: Cost
    type: float
    unit: '1'
    range:
    - 0.005
    - 40.0
    default: 0.19353590090961875
    role: exogenous
    determinism: physical
    priority: P2
    status: existing
    source: 'LHV of NH3: 18.6 GJ/t (standard fuel tables)'
