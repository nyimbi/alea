    name: MWh per hydrogen unit
    description: Hydrogen's lower heating value is 33.33 kWh per kg; the delivered MWh basis is the LHV.
    category: Cost
    type: float
    unit: '1'
    range:
    - 0.005
    - 40.0
    default: 30.003000300030003
    role: exogenous
    determinism: physical
    priority: P2
    status: existing
    source: 'LHV of H2: 33.33 kWh/kg (standard fuel tables)'
