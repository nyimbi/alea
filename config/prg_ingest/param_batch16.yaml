    - Planners
  ammonia_price_per_mwh:
    name: Ammonia price per mwh
    description: The commodity price delivered per MWh, from the market quote (USD/tonne). The conversion's
      constant is a node named beside it, so a reviewer checks the basis rather than trusting a folded
      number.
    category: Cost
    type: float
    unit: USD/MWh
    range:
    - 0.0
    - 1000.0
    role: derived
    determinism: physical
    priority: P1
    status: existing
