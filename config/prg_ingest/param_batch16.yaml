parameters:
  mwh_per_oil_unit:
    name: MWh per oil unit
    description: A barrel of crude is, on the EIA distillate average, 5.8 MMBtu; at 0.29307 MWh per MMBtu
      that is 1.699 MWh delivered. The factor is a node so a reviewer can check the basis.
    category: Cost
    type: float
    unit: '1'
    range:
    - 0.005
    - 40.0
    default: 1.699
    role: exogenous
    determinism: physical
    priority: P2
    status: existing
    source: EIA conversion basis (5.8 MMBtu/barrel); physical constant 0.29307 MWh/MMBtu
    users:
    - Planners
  oil_price_per_mwh:
    name: Oil price per mwh
    description: The commodity price delivered per MWh, from the market quote (USD/barrel). The conversion's
      constant is a node named beside it, so a reviewer checks the basis rather than trusting a folded
      number.
    category: Cost
    type: float
    unit: USD/MWh
    range:
    - 0.0
    - 1000.0
    role: derived
    determinism: physical
    priority: P1
    status: existing
    source: EIA conversion basis (5.8 MMBtu/barrel); physical constant 0.29307 MWh/MMBtu
    users:
    - Planners
    - Traders
  mwh_per_lng_unit:
    name: MWh per lng unit
    description: LNG trades on the same Btu basis as pipeline gas; the MWh conversion is the inverse of
      the Btu content.
    category: Cost
    type: float
    unit: '1'
    range:
    - 0.005
    - 40.0
    default: 3.4121540928788345
    role: exogenous
    determinism: physical
    priority: P2
    status: existing
    source: 'Physical constant: 1 MMBtu = 0.29307 MWh (HHV)'
    users:
    - Planners
  lng_price_per_mwh:
    name: Lng price per mwh
    description: The commodity price delivered per MWh, from the market quote (USD/MMBtu). The conversion's
      constant is a node named beside it, so a reviewer checks the basis rather than trusting a folded
      number.
    category: Cost
    type: float
    unit: USD/MWh
    range:
    - 0.0
    - 1000.0
    role: derived
    determinism: physical
    priority: P1
    status: existing
    source: 'Physical constant: 1 MMBtu = 0.29307 MWh (HHV)'
