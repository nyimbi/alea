cross_validation:
- id: lcoe_reference_sanity
  condition: lcoe_usd_per_mwh < 10 or lcoe_usd_per_mwh > 500
  severity: warning
  message: The reference-technology LCOE is outside the range any 2020s technology exhibits. Either the
    capex is wrong, the capacity factor is wrong, or the discount rate is wrong.
  suggestion: Check capex_usd_per_kw, capacity_factor and discount_rate against their own ranges
- id: fuel_cost_escalation_overtakes_carbon
  condition: fuel_price_escalation > carbon_price_escalation and carbon_price_usd_per_tco2 > 0
  severity: info
  message: A fuel price rising faster than the carbon price is a scenario in which the carbon policy is
    losing ground to the fuel market. Worth recording, not necessarily worth changing.
  suggestion: Confirm the escalation pair is the intended scenario
- id: delivered_fuel_below_commodity
  condition: fuel_cost_coal < coal_price_per_mwh and coal_price > 0
  severity: warning
  message: The delivered coal cost is below the commodity-derived thermal cost, which would require the
    transport to be free or negative
  suggestion: Reconcile the two parameters, or check the calorific value used
- id: delivered_gas_below_commodity
  condition: fuel_cost_gas < gas_price_per_mwh and gas_price > 0
  severity: warning
  message: Same reconciliation for gas
  suggestion: Reconcile the two parameters, or check the MMBtu conversion
- id: capex_battery_units_consistent
  condition: capex_battery > 5000
  severity: info
  message: A battery capex above 5000 USD/kWh is above any observed value for a complete grid-scale system
  suggestion: Check the unit — the shipped parameter is USD/kWh, not USD/kW
- id: capex_transmission_out_of_band
  condition: capex_transmission < 20 or capex_transmission > 8000
  severity: warning
  message: A transmission line cost per MW-km outside 20–8000 is at the edge of what any documented African
    project has cost
  suggestion: Confirm the unit is USD/MW-km and not USD/km
- id: discount_rate_gearing_interaction
  condition: discount_rate > 0.20 and gearing_ratio > 4.0
  severity: warning
  message: A discount rate above 20% with gearing above 4.0 (a debt fraction above 80%) is a financing
    structure that prices equity as if it were mezzanine debt
  suggestion: Reconcile discount_rate with the WACC identity in wacc_definition
- id: carbon_tax_rate_units
  condition: carbon_tax_rate > 5 and carbon_tax_rate < 0.5
  severity: warning
  message: A carbon tax rate between 0.5 and 5 is outside the USD-per-tonne range every jurisdiction has
    adopted — the value is likely in a local currency or in cents
  suggestion: Convert to USD/tonne before setting
