equations:
  annualised_capex_solar_definition:
    name: Annualised solar capex
    description: 'Solar capex recovered per year, at the system discount rate. Dimensional check: USD/kW
      times a dimensionless factor is USD/kW/year.'
    system: cost_accounting
    lhs: annualised_capex_usd_per_kw_solar
    rhs: capex_solar_pv * crf
    relation: eq
    parameters:
    - capex_solar_pv
    - crf
    free_variables:
    - capex_solar_pv
    - crf
    determined_variables:
    - annualised_capex_usd_per_kw_solar
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P2
  annualised_capex_wind_definition:
    name: Annualised wind capex
    description: 'Onshore wind capex recovered per year, at the same discount rate. Dimensional check:
      USD/kW times a dimensionless factor is USD/kW/year.'
    system: cost_accounting
    lhs: annualised_capex_usd_per_kw_wind
    rhs: capex_wind_onshore * crf
    relation: eq
    parameters:
    - capex_wind_onshore
    - crf
    free_variables:
    - capex_wind_onshore
    - crf
    determined_variables:
    - annualised_capex_usd_per_kw_wind
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P2
  lcoe_solar_definition:
    name: Solar LCOE
    description: 'Solar PV levelised cost at its own capex, capacity factor and O&M. Dimensional check:
      USD/kW/year divided by (hours/year times dimensionless) is USD/MWh, plus USD/MWh is USD/MWh. The
      1000 converts kW to MW.'
    system: cost_accounting
    lhs: lcoe_solar_usd_per_mwh
    rhs: (annualised_capex_usd_per_kw_solar + opex_fixed_solar) * 1000 / (8760 * solar_pv_capacity_factor)
      + opex_variable_battery
    relation: eq
    parameters:
    - annualised_capex_usd_per_kw_solar
    - opex_fixed_solar
    - solar_pv_capacity_factor
    - opex_variable_battery
    free_variables:
    - annualised_capex_usd_per_kw_solar
    - opex_fixed_solar
    - solar_pv_capacity_factor
    - opex_variable_battery
    determined_variables:
    - lcoe_solar_usd_per_mwh
    tolerance: 1.0e-08
    unit_check: true
    solution_method: direct
    linearity: nonlinear
    priority: P1
  lcoe_wind_definition:
    name: Wind LCOE
    description: 'Onshore wind levelised cost at its own capex and capacity factor. The variable O&M term
      is small for wind; the shipped graph does not carry one, so the solar equation''s variable term
      is reused as a conservative placeholder and this equation is marked `unit_check: true` on the strength
      of that substitution being dimensional, not physical.'
    system: cost_accounting
    lhs: lcoe_wind_usd_per_mwh
    rhs: (annualised_capex_usd_per_kw_wind + opex_fixed_wind) * 1000 / (8760 * capacity_factor) + opex_variable_battery
    relation: eq
    parameters:
    - annualised_capex_usd_per_kw_wind
    - opex_fixed_wind
    - capacity_factor
    - opex_variable_battery
    free_variables:
    - annualised_capex_usd_per_kw_wind
    - opex_fixed_wind
    - capacity_factor
    - opex_variable_battery
    determined_variables:
    - lcoe_wind_usd_per_mwh
    tolerance: 1.0e-08
    unit_check: true
    solution_method: direct
    linearity: nonlinear
    priority: P1
  fuel_cost_escalated_coal_definition:
    name: Escalated coal fuel cost
    description: 'The delivered coal cost compounded to the horizon. Dimensional check: USD/MWh times
      a dimensionless factor is USD/MWh.'
    system: cost_accounting
    lhs: fuel_cost_escalated_coal_usd_per_mwh
    rhs: fuel_cost_coal * (1 + fuel_price_escalation) ** horizon_years
    relation: eq
    parameters:
    - fuel_cost_coal
    - fuel_price_escalation
    - horizon_years
    free_variables:
    - fuel_cost_coal
    - fuel_price_escalation
    - horizon_years
    determined_variables:
    - fuel_cost_escalated_coal_usd_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: nonlinear
    priority: P2
  fuel_cost_escalated_gas_definition:
    name: Escalated gas fuel cost
    description: The delivered gas cost compounded to the horizon. Same shape as the coal equation.
    system: cost_accounting
    lhs: fuel_cost_escalated_gas_usd_per_mwh
    rhs: fuel_cost_gas * (1 + fuel_price_escalation) ** horizon_years
    relation: eq
    parameters:
    - fuel_cost_gas
    - fuel_price_escalation
    - horizon_years
    free_variables:
    - fuel_cost_gas
    - fuel_price_escalation
    - horizon_years
    determined_variables:
    - fuel_cost_escalated_gas_usd_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: nonlinear
    priority: P2
  coal_price_per_mwh_definition:
    name: Coal price per MWh thermal
    description: 'Commodity coal price converted to a thermal basis. Dimensional check: USD/tonne divided
      by (GJ/tonne times MWh/GJ) is USD/MWh. The 3.6 is MWh per GJ; the 25 is GJ per tonne. Both are written
      so a reader can check the conversion, because the conversion is where a unit error would hide.'
    system: cost_accounting
    lhs: coal_price_per_mwh
    rhs: coal_price / (25 * 3.6)
    relation: eq
    parameters:
    - coal_price
    free_variables:
    - coal_price
    determined_variables:
    - coal_price_per_mwh
    tolerance: 1.0e-09
    unit_check: false
    solution_method: direct
    linearity: linear
    priority: P2
  gas_price_per_mwh_definition:
    name: Gas price per MWh thermal
    description: 'Commodity gas price converted to a thermal basis. Dimensional check: USD/MMBtu times
      MMBtu/MWh is USD/MWh; 1 MMBtu is 0.293 MWh, so MMBtu/MWh is 1/0.293. The conversion is written so
      the unit error has nowhere to hide. `unit_check: false` because the graph does not carry `MMBtu`
      as a Pint-compatible unit string.'
    system: cost_accounting
    lhs: gas_price_per_mwh
    rhs: gas_price / 0.293
    relation: eq
    parameters:
    - gas_price
    free_variables:
    - gas_price
    determined_variables:
    - gas_price_per_mwh
    tolerance: 1.0e-09
    unit_check: false
    solution_method: direct
    linearity: linear
    priority: P2
