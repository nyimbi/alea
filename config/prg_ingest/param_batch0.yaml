# Generated from docs/param_batch0.md by the parameter-equation ingestion.
# Merged onto config/prg.yaml by alea.prg.graph.load_ingested().
#
# Repairs applied to the batch as delivered:
#   R7: combined_ratio also appears in param_batch5.md; that entry is kept and this one dropped
#   R7: forced_outage_rate also appears in param_batch4.md; that entry is kept and this one dropped
#   R7: loss_ratio also appears in param_batch5.md; that entry is kept and this one dropped
#   R8: health_cost_usd_per_year -> reliability_cost_usd declared relationship='informational', which is a Strength value not a Relationship class; set to 'functional' (its strength is 'informational')
#   R8: local_jobs -> total_jobs declared relationship='informational', which is a Strength value not a Relationship class; set to 'functional' (its strength is 'informational')
#   R8: carbon_revenue_usd_per_year -> carbon_budget_ratio declared relationship='informational', which is a Strength value not a Relationship class; set to 'functional' (its strength is 'informational')
#   R4: dropped edge consumer_surplus_usd_per_year -> energy_poverty_rate -- cites 'energy_poverty_rate_definition', which no equation declares
#   R9: dropped edge carbon_price_escalated_usd_per_tco2 -> carbon_budget_ratio -- 'carbon_budget_ratio_definition' does not hold both endpoints (gate 6)
#   R9: dropped edge fuel_price_escalated_usd_per_mwh -> marginal_cost_usd_per_mwh -- 'marginal_cost' does not hold both endpoints (gate 6)
#   R9: dropped edge fleet_emission_intensity_t_per_mwh -> emissions_mtco2_per_year -- 'emissions_definition' does not hold both endpoints (gate 6)
#   R9: dropped edge total_water_demand_m3 -> water_availability_m3 -- 'water_availability_constraint' does not hold both endpoints (gate 6)
#   R9: dropped edge health_cost_usd_per_year -> reliability_cost_usd -- 'reliability_cost_definition' does not hold both endpoints (gate 6)
#   R9: dropped edge local_jobs -> total_jobs -- 'total_jobs_definition' does not hold both endpoints (gate 6)
#   R9: dropped edge carbon_revenue_usd_per_year -> carbon_budget_ratio -- 'carbon_budget_ratio_definition' does not hold both endpoints (gate 6)
#   R9: dropped edge system_saidi_hours_per_year -> grid_reliability_target -- 'saidi_definition' does not hold both endpoints (gate 6)
#   R9: dropped edge system_saifi_events_per_year -> grid_reliability_saifi -- 'saifi_definition' does not hold both endpoints (gate 6)
#   R21: 'gearing_ratio' range corrected from [0, 0.95] to [0, 19]. The node is
#        `debt_fraction / (1 - debt_fraction)`, a multiple of equity, and [0, 0.95]
#        is `debt_fraction`'s bound, not this node's -- the same confusion the
#        description above records for the prose, left standing in the range. The
#        image of the driver's own range [0, 0.95] is [0, 19], and at the default
#        debt_fraction = 0.7 the ratio is 2.3333, which the old range refused: the
#        node was declared out of range at its own default. The bound is derived
#        from the definition, so it moves if `debt_fraction`'s range moves.
parameters:
  gdp_growth_rate:
    name: GDP growth rate
    description: Annual real GDP growth. Bounded to reject a value that would compound to a nonsense economy
      over a 30-year horizon.
    category: Macroeconomic
    type: float
    unit: 1/year
    range:
    - -0.1
    - 0.15
    default: 0.04
    role: free
    determinism: fixed
    priority: P1
    status: existing
    source: docs/params.md#9.1
    users:
    - Planners
  inflation_rate:
    name: Inflation rate
    description: Annual consumer price inflation. Bounded below at deflation and above at hyperinflation.
    category: Macroeconomic
    type: float
    unit: 1/year
    range:
    - -0.05
    - 0.5
    default: 0.05
    role: free
    determinism: fixed
    priority: P1
    status: existing
    source: docs/params.md#9.8
    users:
    - Investors
  interest_rate:
    name: Central bank policy rate
    description: Policy rate, bounded to reject a nominal rate below deflation or above the levels seen
      in the sample.
    category: Macroeconomic
    type: float
    unit: 1/year
    range:
    - 0.0
    - 0.3
    default: 0.07
    role: free
    determinism: fixed
    priority: P2
    status: existing
    source: docs/params.md#9.9
    users:
    - Investors
  population_growth_rate:
    name: Population growth rate
    description: Annual population growth. Below the sample's observed range, the horizon compounds to
      a nonsense population.
    category: Macroeconomic
    type: float
    unit: 1/year
    range:
    - -0.02
    - 0.05
    default: 0.02
    role: free
    determinism: fixed
    priority: P1
    status: existing
    source: docs/params.md#9.3
    users:
    - Planners
  urbanisation_rate:
    name: Urbanisation rate
    description: Annual change in the urban share of population. Bounded because the share is itself bounded.
    category: Macroeconomic
    type: float
    unit: 1/year
    range:
    - 0.0
    - 0.1
    default: 0.01
    role: free
    determinism: fixed
    priority: P2
    status: existing
    source: docs/params.md#9.4
    users:
    - Planners
  industrialisation_rate:
    name: Industrialisation rate
    description: Annual growth in industrial value added. Bounded above by the fastest transformation
      the sample supports.
    category: Macroeconomic
    type: float
    unit: 1/year
    range:
    - 0.0
    - 0.1
    default: 0.02
    role: free
    determinism: fixed
    priority: P2
    status: existing
    source: docs/params.md#9.5
    users:
    - Planners
  carbon_price_escalation:
    name: Carbon price escalation
    description: Annual escalation of the carbon price. The price compounds; a value of 0.05 is a doubling
      in 14 years.
    category: Policy
    type: float
    unit: 1/year
    range:
    - 0.0
    - 0.3
    default: 0.05
    role: free
    determinism: policy
    priority: P2
    status: integrate
    source: docs/params.md#3.40
    users:
    - Policymakers
  fuel_price_escalation:
    name: Fuel price escalation
    description: 'Annual escalation of fuel prices. Negative values are admitted: the sample includes
      decade-long declines in real terms.'
    category: Cost
    type: float
    unit: 1/year
    range:
    - -0.05
    - 0.15
    default: 0.02
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: docs/params.md#3.32
    users:
    - All
  carbon_tax_rate:
    name: Carbon tax rate
    description: Carbon tax, in USD per tonne of CO2. Shipped with unit "1" and range [0, 1], which is
      a category error — a tax rate is per-tonne, and the admissible set is the sample's tax schedules.
    category: Policy
    type: float
    unit: USD/tonne
    range:
    - 0.0
    - 500.0
    default: 0.0
    role: free
    determinism: policy
    priority: P1
    status: existing
    source: docs/params.md#4.1
    users:
    - Policymakers
  gearing_ratio:
    name: Gearing ratio
    description: 'Debt as a multiple of equity, the complement of the debt fraction. Determined by
      gearing_ratio_definition. The description here previously read "debt as a fraction of total
      capitalisation", which is the debt fraction and not the gearing ratio -- the two differ by the
      factor 1/(1 - debt_fraction), so a scenario reading one for the other was out by 3.3x at the
      default. The range was corrected for the same reason and is the larger half of the same error:
      it read [0, 0.95], which is `debt_fraction`''s bound and not this node''s. A multiple of equity
      is unbounded above as the debt fraction approaches 1, and over the driver''s own range [0, 0.95]
      the image is [0, 19]. At the default debt_fraction = 0.7 the ratio is 2.3333, which the old
      range refused -- the node was declared out of range at its own default. The bound is the image
      of `debt_fraction`''s range under the definition, so it is derived rather than chosen; if that
      range moves, this one moves with it.'
    category: Investment & Finance
    type: float
    unit: '1'
    range:
    - 0.0
    - 19.0
    role: derived
    determinism: fixed
    priority: P1
    status: to_build
    source: docs/params.md#9.24
    users:
    - Investors
  debt_service_coverage_ratio:
    name: Minimum DSCR
    description: Debt service coverage floor a lender will accept. Bounded at the low end by 1.0, which
      is the boundary below which a loan defaults in expectation.
    category: Investment & Finance
    type: float
    unit: '1'
    range:
    - 1.0
    - 3.0
    default: 1.3
    role: free
    determinism: fixed
    priority: P1
    status: integrate
    source: docs/params.md#9.22
    users:
    - Banks
  loan_life_coverage_ratio:
    name: Minimum LLCR
    description: Loan life coverage floor. Same shape as the DSCR floor.
    category: Investment & Finance
    type: float
    unit: '1'
    range:
    - 1.0
    - 3.0
    default: 1.4
    role: free
    determinism: fixed
    priority: P1
    status: to_build
    source: docs/params.md#9.23
    users:
    - Banks
  x_factor:
    name: X factor
    description: The regulatory efficiency factor. Bounded to the range regulators actually set; a value
      near 1 would require a utility to become free.
    category: Regulatory Finance
    type: float
    unit: '1'
    range:
    - 0.0
    - 0.1
    default: 0.02
    role: free
    determinism: policy
    priority: P1
    status: to_build
    source: docs/params.md#16.4
    users:
    - Regulators
  battery_learning_rate:
    name: Battery learning rate
    description: Cost reduction per doubling of cumulative battery deployment. Bounded at 0.4, above which
      the parameter would imply a technology that becomes free.
    category: Supply-Side
    type: float
    unit: '1'
    range:
    - 0.0
    - 0.4
    default: 0.15
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: docs/params.md#2.46
    users:
    - Planners
  solar_pv_learning_rate:
    name: Solar PV learning rate
    description: Cost reduction per doubling of cumulative solar deployment. Same bound as the battery
      rate.
    category: Supply-Side
    type: float
    unit: '1'
    range:
    - 0.0
    - 0.4
    default: 0.2
    role: free
    determinism: fixed
    priority: P2
    status: to_build
    source: docs/params.md#2.19
    users:
    - Planners
  electrolyser_learning_rate:
    name: Electrolyser learning rate
    description: Cost reduction per doubling of cumulative electrolyser deployment.
    category: Sector Coupling
    type: float
    unit: '1'
    range:
    - 0.0
    - 0.4
    default: 0.12
    role: free
    determinism: fixed
    priority: P3
    status: to_build
    source: docs/params.md#6.7
    users:
    - Industry
  debt_equity_ratio:
    name: Debt-to-equity ratio
    description: Debt divided by equity, as a ratio (not a share). Bounded above at 3.0, the ceiling thin-capitalisation
      rules usually set.
    category: Investment & Finance
    type: float
    unit: '1'
    range:
    - 0.0
    - 3.0
    default: 2.33
    role: free
    determinism: fixed
    priority: P1
    status: to_build
    source: docs/params.md#3.38
    users:
    - Investors
  carbon_price_coverage:
    name: Carbon price coverage
    description: Share of emissions the carbon price applies to. A share, so bounded in [0, 1]; the shipped
      [0, 1e6] would admit a value 200,000 times the maximum.
    category: Cost
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.5
    role: free
    determinism: policy
    priority: P2
    status: to_build
    source: docs/params.md#3.41
    users:
    - Policymakers
  energy_poverty_rate:
    name: Energy poverty rate
    description: Share of households whose energy burden exceeds the affordability limit. A share, bounded
      in [0, 1].
    category: Consumer Protection
    type: float
    unit: '1'
    range:
    - 0.0
    - 1.0
    default: 0.5
    role: free
    determinism: fixed
    priority: P1
    status: to_build
    source: docs/params.md#20.2
    users:
    - NGOs
  coal_retirement_rate:
    name: Coal retirement rate
    description: Annual coal retirement, as a fraction of the fleet. A rate, bounded in [0, 1].
    category: Supply-Side
    type: float
    unit: 1/year
    range:
    - 0.0
    - 0.25
    default: 0.03
    role: free
    determinism: fixed
    priority: P1
    status: to_build
    source: docs/params.md#2.4
    users:
    - Planners
  planned_outage_rate:
    name: Planned outage rate
    description: Fraction of hours a unit is on planned outage. Same bound as the forced rate.
    category: Outage
    type: float
    unit: '1'
    range:
    - 0.0
    - 0.2
    default: 0.05
    role: free
    determinism: fixed
    priority: P1
    status: to_build
    source: docs/params.md#8.2
    users:
    - Utilities
  carbon_price_escalated_usd_per_tco2:
    name: Escalated carbon price
    description: The carbon price compounded to the horizon. Distinct from `carbon_price_usd_per_tco2`,
      which is the base-year price; the escalation is what turns a policy dial into a trajectory.
    category: Policy
    type: float
    unit: USD/tonne
    range:
    - 0.0
    - 2000.0
    role: derived
    determinism: policy
    priority: P1
    status: to_build
  fuel_price_escalated_usd_per_mwh:
    name: Escalated fuel price
    description: The delivered fuel price compounded to the horizon. The base-year price and its escalation
      are one quantity split in two, and this is the compound.
    category: Cost
    type: float
    unit: USD/MWh
    range:
    - 0.0
    - 1000.0
    role: derived
    determinism: stochastic
    priority: P1
    status: to_build
  fleet_emission_intensity_t_per_mwh:
    name: Fleet emission intensity
    description: Emissions per unit generated. Distinct from `emission_factor_t_per_mwh`, which is a technology's
      factor; this is the fleet average at the current build.
    category: Emissions
    type: float
    unit: tonne/MWh
    range:
    - 0.0
    - 1.5
    role: derived
    determinism: physical
    priority: P1
    status: to_build
  total_water_demand_m3:
    name: Total water demand
    description: Cooling and hydrogen demand together, against the catchment. The left-hand side of the
      availability constraint.
    category: Water
    type: float
    unit: m3
    range:
    - 0.0
    - 100000000000.0
    role: derived
    determinism: physical
    priority: P2
    status: to_build
  equity_irr_estimate:
    name: Equity IRR
    description: The sponsor's return on equity, approximated from the tariff, the cost and the debt service.
      A full IRR needs a cash-flow schedule; this is the first-year ratio a diligence process reads.
    category: Financial
    type: float
    unit: '1'
    range:
    - -1.0
    - 5.0
    role: derived
    determinism: policy
    priority: P2
    status: to_build
  llcr_estimate:
    name: Loan life coverage ratio
    description: The present value of cash available over the loan's life, against the debt outstanding.
      Built from the same cash available the DSCR uses, with the loan tenor as the horizon.
    category: Financial
    type: float
    unit: '1'
    range:
    - 0.0
    - 5.0
    role: derived
    determinism: policy
    priority: P2
    status: to_build
  health_cost_usd_per_year:
    name: Health cost
    description: The DALY burden priced. What the emissions cost in healthcare, on top of what they cost
      in carbon.
    category: Health
    type: float
    unit: USD/year
    range:
    - 0.0
    - 100000000000.0
    role: derived
    determinism: stochastic
    priority: P2
    status: to_build
  local_jobs:
    name: Local jobs
    description: Direct employment multiplied by the local content share. What a build programme's local-content
      claim actually delivers.
    category: Social
    type: float
    unit: jobs
    range:
    - 0.0
    - 50000000.0
    role: derived
    determinism: fixed
    priority: P2
    status: to_build
  carbon_revenue_usd_per_year:
    name: Carbon revenue
    description: The revenue a carbon price collects on the covered emissions. The other side of the carbon
      cost the fleet pays.
    category: Emissions
    type: float
    unit: USD/year
    range:
    - 0.0
    - 1000000000000.0
    role: derived
    determinism: policy
    priority: P2
    status: to_build
  system_saidi_hours_per_year:
    name: SAIDI
    description: System Average Interruption Duration Index. Expected outage hours per customer served,
      from the fleet's outage rate and the demand it serves.
    category: Reliability
    type: float
    unit: hours/year
    range:
    - 0.0
    - 8760.0
    role: derived
    determinism: stochastic
    priority: P1
    status: to_build
  system_saifi_events_per_year:
    name: SAIFI
    description: System Average Interruption Frequency Index. Expected outage events per customer served.
    category: Reliability
    type: float
    unit: events/year
    range:
    - 0.0
    - 500.0
    role: derived
    determinism: stochastic
    priority: P1
    status: to_build
  consumer_surplus_usd_per_year:
    name: Consumer surplus
    description: The triangle under the demand curve above the price. What a cost-recovery tariff leaves
      the load, and what a below-cost tariff transfers to it.
    category: Market Design
    type: float
    unit: USD/year
    range:
    - -1000000000000.0
    - 1000000000000.0
    role: derived
    determinism: policy
    priority: P2
    status: to_build
equations:
  carbon_price_escalated_definition:
    name: Escalated carbon price
    description: 'The base-year carbon price compounded to the horizon. Dimensional check: USD/tonne times
      a dimensionless factor is USD/tonne.'
    system: carbon_trajectory
    lhs: carbon_price_escalated_usd_per_tco2
    rhs: carbon_price_usd_per_tco2 * (1 + carbon_price_escalation) ** horizon_years
    relation: eq
    parameters:
    - carbon_price_usd_per_tco2
    - carbon_price_escalation
    - horizon_years
    free_variables:
    - carbon_price_usd_per_tco2
    - carbon_price_escalation
    - horizon_years
    determined_variables:
    - carbon_price_escalated_usd_per_tco2
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: nonlinear
    priority: P1
  fuel_price_escalated_definition:
    name: Escalated fuel price
    description: 'The delivered fuel cost compounded to the horizon. Dimensional check: USD/MWh times
      a dimensionless factor is USD/MWh.'
    system: cost_accounting
    lhs: fuel_price_escalated_usd_per_mwh
    rhs: fuel_price_usd_per_mwh * (1 + fuel_price_escalation) ** horizon_years
    relation: eq
    parameters:
    - fuel_price_usd_per_mwh
    - fuel_price_escalation
    - horizon_years
    free_variables:
    - fuel_price_usd_per_mwh
    - fuel_price_escalation
    - horizon_years
    determined_variables:
    - fuel_price_escalated_usd_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: nonlinear
    priority: P1
  fleet_emission_intensity_definition:
    name: Fleet emission intensity
    description: 'The emission factor at the horizon, discounted by the CCS the fleet carries. Dimensional
      check: tonne/MWh times a dimensionless share is tonne/MWh.'
    system: emissions
    lhs: fleet_emission_intensity_t_per_mwh
    rhs: emission_factor_t_per_mwh * (1 - coal_ccs_adoption)
    relation: eq
    parameters:
    - emission_factor_t_per_mwh
    - coal_ccs_adoption
    free_variables:
    - emission_factor_t_per_mwh
    - coal_ccs_adoption
    determined_variables:
    - fleet_emission_intensity_t_per_mwh
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
  total_water_demand_definition:
    name: Total water demand
    description: 'Cooling and hydrogen demand together. Dimensional check: m3 plus m3 is m3.'
    system: water_energy
    lhs: total_water_demand_m3
    rhs: cooling_water_demand_m3 + hydrogen_water_demand_m3
    relation: eq
    parameters:
    - cooling_water_demand_m3
    - hydrogen_water_demand_m3
    free_variables:
    - cooling_water_demand_m3
    - hydrogen_water_demand_m3
    determined_variables:
    - total_water_demand_m3
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P2
  equity_irr_definition:
    name: Equity IRR estimate
    description: 'A first-year ratio: the return the sponsor earns on equity after debt service. Dimensional
      check: (USD/kW/year) / (USD/kW) is 1/year, which is a rate. A full IRR needs a schedule; this is
      the ratio a diligence process reads.'
    system: financial
    lhs: equity_irr_estimate
    rhs: (cfads_usd_per_kw_year - debt_service_usd_per_kw_year) / capex_usd_per_kw / (1 - debt_fraction)
    relation: eq
    parameters:
    - cfads_usd_per_kw_year
    - debt_service_usd_per_kw_year
    - capex_usd_per_kw
    - debt_fraction
    free_variables:
    - cfads_usd_per_kw_year
    - debt_service_usd_per_kw_year
    - capex_usd_per_kw
    - debt_fraction
    determined_variables:
    - equity_irr_estimate
    tolerance: 1.0e-08
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P2
  llcr_definition:
    name: Loan life coverage ratio
    description: 'Cash available over the loan life, discounted, against debt outstanding. Dimensional
      check: (USD/kW/year) / (USD/kW) is 1/year, times years is dimensionless -- which is what a coverage
      ratio is. The debt outstanding is the debt-financed share of capex.'
    system: financial
    lhs: llcr_estimate
    rhs: cfads_usd_per_kw_year / (debt_fraction * capex_usd_per_kw) * (1 - (1 + cost_of_debt) ** (0 -
      debt_tenor)) / cost_of_debt
    relation: eq
    parameters:
    - cfads_usd_per_kw_year
    - debt_fraction
    - capex_usd_per_kw
    - cost_of_debt
    - debt_tenor
    free_variables:
    - cfads_usd_per_kw_year
    - debt_fraction
    - capex_usd_per_kw
    - cost_of_debt
    - debt_tenor
    determined_variables:
    - llcr_estimate
    tolerance: 1.0e-08
    unit_check: false
    solution_method: direct
    linearity: nonlinear
    priority: P2
  health_cost_definition:
    name: Health cost
    description: 'The DALY burden priced at the value of a statistical life year. Dimensional check: DALY/year
      times USD/DALY is USD/year. `healthcare_cost_per_case` is used as the value of a DALY, which is
      the only human-capital price the graph carries; a VSL-based value would need its own parameter,
      and the graph does not hold one.'
    system: health
    lhs: health_cost_usd_per_year
    rhs: dalys_per_year * healthcare_cost_per_case
    relation: eq
    parameters:
    - dalys_per_year
    - healthcare_cost_per_case
    free_variables:
    - dalys_per_year
    - healthcare_cost_per_case
    determined_variables:
    - health_cost_usd_per_year
    tolerance: 1.0e-08
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P2
  local_jobs_definition:
    name: Local jobs
    description: 'Direct employment at the local-content share. Dimensional check: jobs times a dimensionless
      share is jobs.'
    system: employment
    lhs: local_jobs
    rhs: direct_jobs * local_content_requirement
    relation: eq
    parameters:
    - direct_jobs
    - local_content_requirement
    free_variables:
    - direct_jobs
    - local_content_requirement
    determined_variables:
    - local_jobs
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P2
  carbon_revenue_definition:
    name: Carbon revenue
    description: 'Covered emissions times the price. Dimensional check: MtCO2/year times USD/tonne is
      USD-million/year; the 1000000 converts to USD/year. Uses the base-year price, not the escalated
      price: a government does not collect next decade''s revenue today.'
    system: emissions
    lhs: carbon_revenue_usd_per_year
    rhs: emissions_mtco2_per_year * carbon_price_usd_per_tco2 * carbon_price_coverage * 1000000
    relation: eq
    parameters:
    - emissions_mtco2_per_year
    - carbon_price_usd_per_tco2
    - carbon_price_coverage
    free_variables:
    - emissions_mtco2_per_year
    - carbon_price_usd_per_tco2
    - carbon_price_coverage
    determined_variables:
    - carbon_revenue_usd_per_year
    tolerance: 1.0e-06
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P2
  saidi_definition:
    name: SAIDI
    description: 'Outage duration times the frequency, against 8760 hours. Dimensional check: hours/event
      times events/year is hours/year. Uses forced and planned outage rates, which is the graph''s only
      evidence about interruption.'
    system: reliability
    lhs: system_saidi_hours_per_year
    rhs: outage_duration * outage_frequency
    relation: eq
    parameters:
    - outage_duration
    - outage_frequency
    free_variables:
    - outage_duration
    - outage_frequency
    determined_variables:
    - system_saidi_hours_per_year
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
  saifi_definition:
    name: SAIFI
    description: 'Interruption frequency, normalised to the customer base. Dimensional check: events/year.
      The graph carries no customer count, so the frequency is used directly; a per-customer version needs
      the customer count as a parameter, which the graph does not hold.'
    system: reliability
    lhs: system_saifi_events_per_year
    rhs: outage_frequency
    relation: eq
    parameters:
    - outage_frequency
    free_variables:
    - outage_frequency
    determined_variables:
    - system_saifi_events_per_year
    tolerance: 1.0e-09
    unit_check: true
    solution_method: direct
    linearity: linear
    priority: P1
  consumer_surplus_definition:
    name: Consumer surplus
    description: 'A linear approximation of the triangle under the demand curve. Dimensional check: (USD/MWh)
      times (MWh) is USD, times a dimensionless elasticity factor is USD. The 0.5 is the half-base rule
      for a linear demand curve; the shipped graph does not carry a demand-curve slope, so the elasticity
      is used as the shape parameter.'
    system: price_demand
    lhs: consumer_surplus_usd_per_year
    rhs: (reference_tariff_usd_per_mwh - regulated_tariff_usd_per_mwh) * equilibrium_demand_twh * 1000000
      * price_elasticity * 0.5
    relation: eq
    parameters:
    - reference_tariff_usd_per_mwh
    - regulated_tariff_usd_per_mwh
    - equilibrium_demand_twh
    - price_elasticity
    free_variables:
    - reference_tariff_usd_per_mwh
    - regulated_tariff_usd_per_mwh
    - equilibrium_demand_twh
    - price_elasticity
    determined_variables:
    - consumer_surplus_usd_per_year
    tolerance: 1.0e-06
    unit_check: false
    solution_method: direct
    linearity: linear
    priority: P2
