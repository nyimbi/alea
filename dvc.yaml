# SPDX-License-Identifier: MIT
#
# DVC: what the pipeline versioned, and how to reproduce it.
#
# `01-foundations.md` §6 asks for `dvc add data/raw data/processed resources`
# and a `dvc repro` that reproduces the Kenya fixture from a clean clone. This
# file is the second half of that: `dvc add` versions the lake *bodies* (a
# `.dvc` pointer file per directory), and the stages below are what `dvc repro`
# runs to rebuild them.
#
# Two rules for this file:
#
#  1. **Every `cmd` is `uv run --directory <root> alea ...`, exactly as the
#     Snakemake rule for the same stage.** AD-5 says the CLI is the only entry
#     point, and it says so for DVC as much as for Snakemake. A `cmd` that
#     imported a Python function would make `dvc repro` and
#     `snakemake -c1 topology` two implementations of one stage, which is how
#     they come to disagree.
#
#  2. **The deps and outs are the Snakemake rule's inputs and outputs.** DVC
#     decides what is stale from them; a dep missing here is a stage DVC calls
#     up to date against inputs it never read. The pair is asserted equal by
#     `tests/ci/test_orchestration_workflow.py`, because two files that agree
#     today are not one source of truth.
#
# `data/raw` and the manual exports are declared as deps but are not stage
# outputs: they arrive from `alea fetch` or from a human, and `02-data-pipeline`
# §1.1 makes the manual ones a reviewed step rather than a rule.

stages:

  topology:
    desc: "Transmission lines from the World Bank grid map."
    cmd: >-
      uv run --directory . alea build topology
      --out data/processed/topology.parquet
      --config config/config.kenya.yaml
      --set raw_root=data/raw
    deps:
      - data/raw/worldbank_grid_map
    outs:
      - data/processed/topology.parquet
      # Written by the same stage: what a GIS reads. Declared so a change to it
      # is visible to `dvc status` rather than only to the Parquet's reader.
      - data/processed/topology.geojson

  fleet:
    desc: "The generation fleet from the committed powerplantmatching export."
    cmd: >-
      uv run --directory . alea build fleet
      --out data/processed/fleet.parquet
      --config config/config.kenya.yaml
      --set raw_root=data/raw
      --set powerplant_export=data/raw/powerplantmatching/manual/powerplants.parquet
    deps:
      - data/raw/powerplantmatching/manual/powerplants.parquet
    outs:
      - data/processed/fleet.parquet

  demand_national:
    desc: "Annual national demand totals from the committed AFREC export."
    cmd: >-
      uv run --directory . alea build demand_national
      --out data/processed/demand_national.parquet
      --config config/config.kenya.yaml
      --set raw_root=data/raw
      --set afrec_export=data/raw/afrec_demand/manual/afrec_demand.xlsx
    deps:
      - data/raw/afrec_demand/manual/afrec_demand.xlsx
    outs:
      - data/processed/demand_national.parquet

  demand_hourly:
    desc: "National demand split across buses at the §3.1 population/GDP blend."
    cmd: >-
      uv run --directory . alea build demand_hourly
      --out data/processed/demand_hourly.parquet
      --config config/config.kenya.yaml
      --set raw_root=data/raw
      --set demand_national=data/processed/demand_national.parquet
      --set bus_weights=resources/weights/bus_weights.parquet
      --set alpha=0.5
    deps:
      - data/processed/demand_national.parquet
      - resources/weights/bus_weights.parquet
    outs:
      - data/processed/demand_hourly.parquet

  cutout:
    desc: "The ERA5 cutout covering the topology's own extent."
    cmd: >-
      uv run --directory . alea build cutout
      --out data/processed/cutout.nc
      --config config/config.kenya.yaml
      --set raw_root=data/raw
      --set cutout_path=data/processed/cutout.nc
      --set topology=data/processed/topology.parquet
    deps:
      - data/processed/topology.parquet
    outs:
      - data/processed/cutout.nc
      # atlite's sidecar. `02-data-pipeline.md` §1.1: checksumming the `.nc`
      # alone yields a cutout that verifies and fails to open.
      - data/processed/cutout.nc.aux

  renewable_profiles:
    desc: "Capacity factors per bus, from the cutout."
    cmd: >-
      uv run --directory . alea build renewable_profiles
      --out data/processed/renewable_profiles.nc
      --config config/config.kenya.yaml
      --set cutout_path=data/processed/cutout.nc
      --set topology=data/processed/topology.parquet
    deps:
      - data/processed/cutout.nc
      - data/processed/topology.parquet
    outs:
      - data/processed/renewable_profiles.nc

  hydro_profiles:
    desc: "Monthly capacity factors per hydro plant."
    cmd: >-
      uv run --directory . alea build hydro_profiles
      --out data/processed/hydro_profiles.parquet
      --config config/config.kenya.yaml
      --set raw_root=data/raw
      --set hydro_export=data/raw/hydro_atlas/manual/hydro_profiles.parquet
    deps:
      - data/raw/hydro_atlas/manual/hydro_profiles.parquet
    outs:
      - data/processed/hydro_profiles.parquet

  costs:
    desc: "Technology capital and operating costs from the committed IRENA export."
    cmd: >-
      uv run --directory . alea build costs
      --out data/processed/costs.parquet
      --config config/config.kenya.yaml
      --set raw_root=data/raw
      --set irena_export=data/raw/irena_costs/manual/irena_costs.json
    deps:
      - data/raw/irena_costs/manual/irena_costs.json
    outs:
      - data/processed/costs.parquet

  fuel_prices:
    desc: "Fuel prices in USD/MWh, from the fetched Global Petrol Prices payload."
    cmd: >-
      uv run --directory . alea build fuel_prices
      --out data/processed/fuel_prices.parquet
      --config config/config.kenya.yaml
      --set raw_root=data/raw
    deps:
      - data/raw/global_petrol_prices
    outs:
      - data/processed/fuel_prices.parquet

  outage_history:
    desc: "VIIRS-detected outage evidence per grid zone (Track B)."
    cmd: >-
      uv run --directory . alea build outage_history
      --out data/processed/outage_history.parquet
      --config config/config.kenya.yaml
      --set raw_root=data/raw
    deps:
      - data/raw/viirs_vnp46a2
    outs:
      - data/processed/outage_history.parquet

  outage_truth:
    desc: "GridWatch ground truth (Track B)."
    cmd: >-
      uv run --directory . alea build outage_truth
      --out data/processed/outage_truth.parquet
      --config config/config.kenya.yaml
      --set raw_root=data/raw
      --set gridwatch_export=data/raw/gridwatch/manual/gridwatch.csv
    deps:
      - data/raw/gridwatch/manual/gridwatch.csv
    outs:
      - data/processed/outage_truth.parquet

  network_arrays:
    desc: "A solved network as the loss kernel's arrays and dispatch series."
    cmd: >-
      uv run --directory . alea build network_arrays
      --out data/processed/network_arrays.json
      --config config/config.kenya.yaml
      --set network_dir=results/networks
    deps:
      # A directory, not a file: `alea solve` writes `{network_id}-{horizon}.nc`
      # and the id is a content hash, so the filename is not knowable at parse
      # time. Declaring the directory re-runs this stage whenever a solve lands
      # or changes, which is exactly when the newest network might be different.
      - results/networks
    outs:
      - data/processed/network_arrays.json
      - data/processed/dispatch.parquet

  sector_coupling:
    desc: "A solved network extended with the sectors the config enables."
    cmd: >-
      uv run --directory . alea build sector_coupling
      --out data/processed/sector_coupling.json
      --config config/config.kenya.yaml
      --set network_dir=results/networks
    deps:
      # A directory, for the same reason `network_arrays` declares one: the
      # solved network's filename is a content hash and is not knowable at parse
      # time, so the stage resolves the newest and records what it resolved.
      - results/networks
    outs:
      - data/processed/sector_coupling.json
      - data/processed/sector_coupling.coupled.nc

  tlens:
    desc: "Branch ranking by the energy an outage would leave unserved."
    cmd: >-
      uv run --directory . alea build tlens
      --out data/processed/tlens.json
      --config config/config.kenya.yaml
    deps:
      - data/processed/network_arrays.json
      - data/processed/dispatch.parquet
    outs:
      - data/processed/tlens.json

  critical_lines:
    desc: "Each branch's loading against its own rating, over the dispatch series."
    cmd: >-
      uv run --directory . alea build critical_lines
      --out data/processed/critical_lines.parquet
      --config config/config.kenya.yaml
    deps:
      - data/processed/network_arrays.json
      - data/processed/dispatch.parquet
    outs:
      - data/processed/critical_lines.parquet

  resilience_contingency:
    desc: "The N-1 sweep as per-element serving rows for the API's contingency route."
    cmd: >-
      uv run --directory . alea build resilience_contingency
      --out data/processed/resilience/contingency.parquet
      --config config/config.kenya.yaml
    deps:
      - data/processed/network_arrays.json
      - data/processed/dispatch.parquet
    outs:
      - data/processed/resilience/contingency.parquet

  market_report:
    desc: "Per-carrier volume and average price, the monthly market section's rows."
    cmd: >-
      uv run --directory . alea build market_report
      --out data/processed/market_report.parquet
      --config config/config.kenya.yaml
      --set network_dir=results/networks
    deps:
      # A directory, for the same reason `market_prices` declares one: the
      # solved network's filename carries a content hash no rule can know at
      # parse time, so the stage resolves the newest itself.
      - results/networks
    outs:
      - data/processed/market_report.parquet

  market_outlook:
    desc: "Clearing price per horizon, the quarterly outlook section's rows."
    cmd: >-
      uv run --directory . alea build market_outlook
      --out data/processed/market_outlook.parquet
      --config config/config.kenya.yaml
      --set network_dir=results/networks
    deps:
      - results/networks
    outs:
      - data/processed/market_outlook.parquet

  capacity_update:
    desc: "Installed capacity by carrier, differenced against the previous solve."
    cmd: >-
      uv run --directory . alea build capacity_update
      --out data/processed/capacity_update.parquet
      --config config/config.kenya.yaml
      --set network_dir=results/networks
    deps:
      # A directory, and here it is read twice: the stage resolves the newest
      # solve and the one written before it, because the section's change column
      # is a difference between two networks. A new solve invalidates the delta
      # either way round, which is exactly what a directory dep tracks.
      - results/networks
    outs:
      - data/processed/capacity_update.parquet

  project_capacity_update:
    desc: >-
      The monthly capacity section at the dated path its report reads. A stage
      writes `data/processed/`; a section reads `results/<dir>/{date}.parquet`,
      and nothing bridged the two.
    cmd: >-
      uv run --directory . alea project monthly capacity_update
      --source data/processed/capacity_update.parquet
      --config config/config.kenya.yaml
    deps:
      - data/processed/capacity_update.parquet
    outs:
      # A directory: the filename is the cadence's period end, which moves with
      # the clock, so no literal is knowable at parse time. The projection
      # resolves it from the section's own declared pattern.
      - results/planning/capacity

  project_critical_lines:
    desc: >-
      The weekly critical-lines section at the dated path its report reads.
      `rules/losses.smk` writes the processed form and says the dated path "is
      the projection's `--out`"; this is that projection.
    cmd: >-
      uv run --directory . alea project weekly critical_lines
      --source data/processed/critical_lines.parquet
      --config config/config.kenya.yaml
    deps:
      - data/processed/critical_lines.parquet
    outs:
      - results/outages/critical

  project_market_report:
    desc: >-
      The monthly market section at the dated path its report reads. Required
      to the monthly cadence, so `alea report monthly` raises without it.
    cmd: >-
      uv run --directory . alea project monthly market_report
      --source data/processed/market_report.parquet
      --config config/config.kenya.yaml
    deps:
      - data/processed/market_report.parquet
    outs:
      - results/market/monthly

  project_market_outlook:
    desc: >-
      The quarterly outlook section at the dated path its report reads. The
      date is the quarter that ended, not the day the rule ran.
    cmd: >-
      uv run --directory . alea project quarterly market_outlook
      --source data/processed/market_outlook.parquet
      --config config/config.kenya.yaml
    deps:
      - data/processed/market_outlook.parquet
    outs:
      - results/market/outlook

  generation_mix:
    desc: "Dispatched MW by carrier, for the daily report's mix section."
    cmd: >-
      uv run --directory . alea build generation_mix
      --out data/processed/generation_mix.parquet
      --config config/config.kenya.yaml
      --set network_dir=results/networks
    deps:
      - results/networks
    outs:
      - data/processed/generation_mix.parquet

  price_forecast:
    desc: "The daily price section's clearing rows, per hour."
    cmd: >-
      uv run --directory . alea build price_forecast
      --out data/processed/price_forecast.parquet
      --config config/config.kenya.yaml
      --set network_dir=results/networks
    deps:
      - results/networks
    outs:
      - data/processed/price_forecast.parquet

  project_generation_mix:
    desc: >-
      The daily mix section at the dated path its report reads. A daily report
      covers yesterday, so the projection resolves the cadence's period rather
      than stamping the run date.
    cmd: >-
      uv run --directory . alea project daily generation_mix
      --source data/processed/generation_mix.parquet
      --config config/config.kenya.yaml
    deps:
      - data/processed/generation_mix.parquet
    outs:
      - results/planning/dispatch

  week_ahead:
    desc: >-
      The week-ahead balance, one row per day, for the weekly report's required
      outlook section. Capacity is the optimiser's chosen p_nom_opt where a
      component is extendable, so the stage reads a solved network.
    cmd: >-
      uv run --directory . alea build week_ahead
      --out data/processed/week_ahead.parquet
      --config config/config.kenya.yaml
      --set network_dir=results/networks
    deps:
      - results/networks
    outs:
      - data/processed/week_ahead.parquet

  project_price_forecast:
    desc: >-
      The daily price section at the dated path its report reads. Optional, so
      its absence warned rather than raised -- which is why nothing noticed it
      was missing.
    cmd: >-
      uv run --directory . alea project daily price_forecast
      --source data/processed/price_forecast.parquet
      --config config/config.kenya.yaml
    deps:
      - data/processed/price_forecast.parquet
    outs:
      - results/market/prices

  market_prices:
    desc: "The solved network's marginal prices for the API's price route."
    cmd: >-
      uv run --directory . alea build market_prices
      --out data/processed/market/prices.parquet
      --config config/config.kenya.yaml
      --set network_dir=results/networks
    deps:
      # A directory, for the same reason `network_arrays` declares one: the
      # stage resolves the newest solved network and its filename is a content
      # hash, so the path is not knowable here.
      - results/networks
    outs:
      - data/processed/market/prices.parquet

  market_capture_rates:
    desc: "The solved network's capture prices for the API's capture-rate route."
    cmd: >-
      uv run --directory . alea build market_capture_rates
      --out data/processed/market/capture_rates.parquet
      --config config/config.kenya.yaml
      --set network_dir=results/networks
    deps:
      - results/networks
    outs:
      - data/processed/market/capture_rates.parquet

  project_week_ahead:
    desc: >-
      The weekly balance at the dated path its report reads. A weekly report
      covers the week that ended, so the projection resolves the cadence's
      period rather than stamping the run date.
    cmd: >-
      uv run --directory . alea project weekly week_ahead
      --source data/processed/week_ahead.parquet
      --config config/config.kenya.yaml
    deps:
      - data/processed/week_ahead.parquet
    outs:
      - results/planning/outlook
