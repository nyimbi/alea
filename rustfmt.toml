# This project indents with tabs, in Rust as in Python. rustfmt's default is
# four spaces, so without this file `cargo fmt --check` fails on every file
# while the code is exactly as it should be -- the same conflict that makes
# `ruff format` unusable here (see the note in scripts/check.py).
#
# `hard_tabs` is honoured on stable (verified on rustfmt 1.8.0-stable: with this
# file the only diffs `cargo fmt --all --check` reported were chain-wrapping, and
# applying `cargo fmt --all` cleared them). It is *not* nightly-only, and this
# file is *not* inert. An earlier version of this comment claimed both, which is
# the worst state a comment can be in: a reader who believed it would have
# deleted the file and reintroduced the failing check.
hard_tabs = true
tab_spaces = 4
max_width = 100
